name: Finalize Audio Integration Temp

on:
  push:
    branches: [feat/audio-binary-ingest]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Wire ingested audio into runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Asset manifest
          # ------------------------------------------------------------------
          path = 'src/assets/manifest.js'
          text = read(path)
          if "'team-break': {" not in text:
              block = r"""
  // Expanded James Benjamin / Boogieman runtime catalogue.
  'team-break': { type: 'audio', url: 'assets/audio/catalog/dance-beyond-genre/team-break.mp3', source: 'James Benjamin - Team Break' },
  'ancillary-things': { type: 'audio', url: 'assets/audio/catalog/dance-beyond-genre/ancillary-things.mp3', source: 'James Benjamin - Ancillary Things' },
  gairage: { type: 'audio', url: 'assets/audio/catalog/james-benjamin/gairage.mp3', source: 'James Benjamin × Jamvvis - Gairage' },
  'hit-the-floor': { type: 'audio', url: 'assets/audio/catalog/james-benjamin/hit-the-floor.mp3', source: 'James Benjamin ft Star Amerasu + Kizaba - Hit the Floor' },
  'chi-town-drop': { type: 'audio', url: 'assets/audio/catalog/james-benjamin/chi-town-drop.mp3', source: 'James Benjamin ft AmirSaysNothing - Chi Town Drop' },
  'guestlist-andy-s': { type: 'audio', url: 'assets/audio/catalog/james-benjamin/guestlist-andy-s.mp3', source: 'James Benjamin ft Andy S - Guestlist' },
  'drop-in': { type: 'audio', url: 'assets/audio/catalog/got-you-dancin/drop-in.mp3', source: 'James Benjamin - Drop In' },
  'body-check': { type: 'audio', url: 'assets/audio/catalog/got-you-dancin/body-check.mp3', source: 'James Benjamin - Body Check' },
  'play-ball-people': { type: 'audio', url: 'assets/audio/catalog/got-you-dancin/play-ball-people.mp3', source: 'James Benjamin - Play Ball (People)' },
  etcetera: { type: 'audio', url: 'assets/audio/catalog/got-you-dancin/etcetera.mp3', source: 'James Benjamin - Etcetera' },
  'airtime-express': { type: 'audio', url: 'assets/audio/catalog/got-you-dancin/airtime-express.mp3', source: 'James Benjamin - Airtime Express' },
  'rotations-the-roll': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/the-roll.mp3', source: 'Boogieman - The Roll' },
  'rotations-den-naben': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/den-naben.mp3', source: 'Boogieman - Den Naben' },
  'rotations-water-is-boiling': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/water-is-boiling.mp3', source: 'Boogieman - Water Is Boiling' },
  'rotations-adjust': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/adjust.mp3', source: 'Boogieman - Adjust' },
  'rotations-she': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/she.mp3', source: 'Boogieman - She' },
  'rotations-devils-mountain': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/devils-mountain.mp3', source: 'Boogieman - Devils Mountain and Ngorongoro Crater' },
  'rotations-fences': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/fences.mp3', source: 'Boogieman - Fences' },
  'rotations-water-is-boiling-outro': { type: 'audio', url: 'assets/audio/catalog/boogieman/rotations/water-is-boiling-outro.mp3', source: 'Boogieman - Water Is Boiling (Outro)' },

  // Music for the End of the World listening bank for Take A Break.
  'mfteot-nature-waterfall-rebirth': { type: 'audio', url: 'assets/audio/ambient/mfteot/nature/waterfall-rebirth.mp3', source: 'Music for the End of the World - NATURE - Waterfall Rebirth' },
  'mfteot-nature-birds-at-the-sinks': { type: 'audio', url: 'assets/audio/ambient/mfteot/nature/birds-at-the-sinks.mp3', source: 'Music for the End of the World - NATURE - The Birds at the Sinks' },
  'mfteot-nature-zona': { type: 'audio', url: 'assets/audio/ambient/mfteot/nature/zona.mp3', source: 'Music for the End of the World - NATURE - Zona' },
  'mfteot-nature-cellular-imaginings': { type: 'audio', url: 'assets/audio/ambient/mfteot/nature/cellular-imaginings.mp3', source: 'Music for the End of the World - NATURE - Cellular Imaginings 1' },
  'mfteot-nature-to-philly': { type: 'audio', url: 'assets/audio/ambient/mfteot/nature/to-philly.mp3', source: 'Music for the End of the World - NATURE - To Philly v3 2022' },
  'mfteot-man-to-dream': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/to-dream.mp3', source: 'Music for the End of the World - MAN - To Dream' },
  'mfteot-man-phaser': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/phaser.mp3', source: 'Music for the End of the World - MAN - Phaser' },
  'mfteot-man-dead-mans': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/dead-mans.mp3', source: 'Music for the End of the World - MAN - Dead Mans' },
  'mfteot-man-decisions': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/decisions.mp3', source: 'Music for the End of the World - MAN - Decisions (Instrumental)' },
  'mfteot-man-deeper-b': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/deeper-b.mp3', source: 'Music for the End of the World - MAN - Deeper B' },
  'mfteot-man-nick-cave-esque': { type: 'audio', url: 'assets/audio/ambient/mfteot/man/nick-cave-esque.mp3', source: 'Music for the End of the World - MAN - Nick Cave Esque' },

  // Real grouped multitracks. Each session's buses have identical start and duration.
  'gairage-drums': { type: 'audio', url: 'assets/audio/studio/gairage/drums.mp3', source: 'Gairage grouped drums' },
  'gairage-bass': { type: 'audio', url: 'assets/audio/studio/gairage/bass.mp3', source: 'Gairage grouped bass' },
  'gairage-synths': { type: 'audio', url: 'assets/audio/studio/gairage/synths.mp3', source: 'Gairage grouped synths' },
  'gairage-fx': { type: 'audio', url: 'assets/audio/studio/gairage/fx.mp3', source: 'Gairage grouped FX' },
  'gairage-vocal-chop': { type: 'audio', url: 'assets/audio/studio/gairage/vocal-chop.mp3', source: 'Gairage vocal chop' },
  'in-an-instant-keys': { type: 'audio', url: 'assets/audio/studio/in-an-instant/keys.mp3', source: 'In an Instant ASR-88 keys' },
  'in-an-instant-jx3p': { type: 'audio', url: 'assets/audio/studio/in-an-instant/jx3p.mp3', source: 'In an Instant JX-3P' },
  'in-an-instant-syncussion': { type: 'audio', url: 'assets/audio/studio/in-an-instant/syncussion.mp3', source: 'In an Instant Syncussion' },
  'in-an-instant-modular-drums': { type: 'audio', url: 'assets/audio/studio/in-an-instant/modular-drums.mp3', source: 'In an Instant modular drums' },
  'in-an-instant-low-pulse': { type: 'audio', url: 'assets/audio/studio/in-an-instant/low-pulse.mp3', source: 'In an Instant low pulse' },

"""
              text = replace_once(text, "  'take-a-break-installation': {", block + "  'take-a-break-installation': {", 'manifest insertion')
              write(path, text)

          # ------------------------------------------------------------------
          # Music review/runtime metadata + James house-DJ programme
          # ------------------------------------------------------------------
          path = 'src/audio/musicLibrary.js'
          text = read(path)
          if "id: 'team-break', label: 'James Benjamin · Team Break'" not in text:
              runtime_block = r"""
  { id: 'team-break', label: 'James Benjamin · Team Break', collection: 'Dance Beyond Genre Vol. 1' },
  { id: 'ancillary-things', label: 'James Benjamin · Ancillary Things', collection: 'Dance Beyond Genre Vol. 1' },
  { id: 'gairage', label: 'James Benjamin × Jamvvis · Gairage', collection: 'Gairage' },
  { id: 'hit-the-floor', label: 'James Benjamin ft Star Amerasu + Kizaba · Hit the Floor', collection: 'Singles' },
  { id: 'chi-town-drop', label: 'James Benjamin ft AmirSaysNothing · Chi Town Drop', collection: 'Singles' },
  { id: 'guestlist-andy-s', label: 'James Benjamin ft Andy S · Guestlist', collection: 'Singles' },
  { id: 'drop-in', label: 'James Benjamin · Drop In', collection: 'Got You Dancin' },
  { id: 'body-check', label: 'James Benjamin · Body Check', collection: 'Got You Dancin' },
  { id: 'play-ball-people', label: 'James Benjamin · Play Ball (People)', collection: 'Got You Dancin' },
  { id: 'etcetera', label: 'James Benjamin · Etcetera', collection: 'Got You Dancin' },
  { id: 'airtime-express', label: 'James Benjamin · Airtime Express', collection: 'Got You Dancin' },
  { id: 'rotations-the-roll', label: 'Boogieman · The Roll', collection: 'Rotations' },
  { id: 'rotations-den-naben', label: 'Boogieman · Den Naben', collection: 'Rotations' },
  { id: 'rotations-water-is-boiling', label: 'Boogieman · Water Is Boiling', collection: 'Rotations' },
  { id: 'rotations-adjust', label: 'Boogieman · Adjust', collection: 'Rotations' },
  { id: 'rotations-she', label: 'Boogieman · She', collection: 'Rotations' },
  { id: 'rotations-devils-mountain', label: 'Boogieman · Devils Mountain and Ngorongoro Crater', collection: 'Rotations' },
  { id: 'rotations-fences', label: 'Boogieman · Fences', collection: 'Rotations' },
  { id: 'rotations-water-is-boiling-outro', label: 'Boogieman · Water Is Boiling (Outro)', collection: 'Rotations' },
"""
              anchor = "  { id: 'bhab', label: 'Boogaloo Jones · Bhab', collection: 'Dubki' },\n];"
              text = replace_once(text, anchor, "  { id: 'bhab', label: 'Boogaloo Jones · Bhab', collection: 'Dubki' },\n" + runtime_block + "];", 'runtime library')

          # Approved DJ and ambient sources are now actually present in the runtime build.
          text = replace_once(
              text,
              "  runtimeReady: false,\n}));\n\n// These were explicitly included for the game review",
              "  runtimeReady: true,\n}));\n\n// These were explicitly included for the game review",
              'dj runtime ready',
          )
          text = replace_once(
              text,
              "  runtimeReady: false,\n}));\n\nexport const APPROVED_STUDIO_SOURCES",
              "  runtimeReady: true,\n}));\n\nexport const APPROVED_STUDIO_SOURCES",
              'ambient runtime ready',
          )
          text = replace_once(
              text,
              "  approved: true,\n  runtimeReady: false,\n}));\n\nexport const RIGHTS_GATED_STUDIO_SOURCES",
              "  approved: true,\n  runtimeReady: ['gairage-stems', 'in-an-instant-stems'].includes(id),\n}));\n\nexport const RIGHTS_GATED_STUDIO_SOURCES",
              'studio runtime ready',
          )

          if "{ id: 'team-break', label: 'Team Break' }" not in text:
              fallback_add = r"""
      { id: 'team-break', label: 'Team Break' },
      { id: 'ancillary-things', label: 'Ancillary Things' },
      { id: 'gairage', label: 'Gairage' },
      { id: 'hit-the-floor', label: 'Hit the Floor' },
      { id: 'chi-town-drop', label: 'Chi Town Drop' },
      { id: 'guestlist-andy-s', label: 'Guestlist' },
      { id: 'drop-in', label: 'Drop In' },
      { id: 'body-check', label: 'Body Check' },
      { id: 'play-ball-people', label: 'Play Ball (People)' },
      { id: 'etcetera', label: 'Etcetera' },
      { id: 'airtime-express', label: 'Airtime Express' },
      { id: 'rotations-the-roll', label: 'The Roll' },
      { id: 'rotations-den-naben', label: 'Den Naben' },
      { id: 'rotations-water-is-boiling', label: 'Water Is Boiling' },
      { id: 'rotations-adjust', label: 'Adjust' },
      { id: 'rotations-she', label: 'She' },
      { id: 'rotations-devils-mountain', label: 'Devils Mountain and Ngorongoro Crater' },
      { id: 'rotations-fences', label: 'Fences' },
      { id: 'rotations-water-is-boiling-outro', label: 'Water Is Boiling (Outro)' },
"""
              anchor = "      { id: 'in-flux-gingele', label: 'Gingele' },\n    ],"
              text = replace_once(text, anchor, "      { id: 'in-flux-gingele', label: 'Gingele' },\n" + fallback_add + "    ],", 'house DJ fallback')
          write(path, text)

          # ------------------------------------------------------------------
          # Player DJ library. BPMs come from the actual ingested masters.
          # ------------------------------------------------------------------
          path = 'src/dj/DjMixer.js'
          text = read(path)
          if "id: 'team-break', label: 'James Benjamin · Team Break'" not in text:
              dj_block = r"""
  { id: 'team-break', label: 'James Benjamin · Team Break', bpm: 95.7, energy: 0.66, key: '—', real: true },
  { id: 'ancillary-things', label: 'James Benjamin · Ancillary Things', bpm: 143.55, energy: 0.82, key: '—', real: true },
  { id: 'gairage', label: 'James Benjamin × Jamvvis · Gairage', bpm: 152, energy: 0.86, key: '—', real: true },
  { id: 'hit-the-floor', label: 'James Benjamin ft Star Amerasu + Kizaba · Hit the Floor', bpm: 129.2, energy: 0.9, key: '—', real: true },
  { id: 'chi-town-drop', label: 'James Benjamin ft AmirSaysNothing · Chi Town Drop', bpm: 136, energy: 0.88, key: '—', real: true },
  { id: 'guestlist-andy-s', label: 'James Benjamin ft Andy S · Guestlist', bpm: 143.55, energy: 0.84, key: '—', real: true },
  { id: 'drop-in', label: 'James Benjamin · Drop In', bpm: 92.29, energy: 0.72, key: '—', real: true },
  { id: 'body-check', label: 'James Benjamin · Body Check', bpm: 103.36, energy: 0.76, key: '—', real: true },
  { id: 'play-ball-people', label: 'James Benjamin · Play Ball (People)', bpm: 143.55, energy: 0.9, key: '—', real: true },
  { id: 'etcetera', label: 'James Benjamin · Etcetera', bpm: 92.29, energy: 0.72, key: '—', real: true },
  { id: 'airtime-express', label: 'James Benjamin · Airtime Express', bpm: 99.38, energy: 0.7, key: '—', real: true },
  { id: 'rotations-the-roll', label: 'Boogieman · The Roll', bpm: 117.45, energy: 0.64, key: '—', real: true },
  { id: 'rotations-den-naben', label: 'Boogieman · Den Naben', bpm: 107.67, energy: 0.58, key: '—', real: true },
  { id: 'rotations-water-is-boiling', label: 'Boogieman · Water Is Boiling', bpm: 99.38, energy: 0.62, key: '—', real: true },
  { id: 'rotations-adjust', label: 'Boogieman · Adjust', bpm: 136, energy: 0.8, key: '—', real: true },
  { id: 'rotations-she', label: 'Boogieman · She', bpm: 129.2, energy: 0.72, key: '—', real: true },
  { id: 'rotations-devils-mountain', label: 'Boogieman · Devils Mountain and Ngorongoro Crater', bpm: 89.1, energy: 0.6, key: '—', real: true },
  { id: 'rotations-fences', label: 'Boogieman · Fences', bpm: 117.45, energy: 0.66, key: '—', real: true },
  { id: 'rotations-water-is-boiling-outro', label: 'Boogieman · Water Is Boiling (Outro)', bpm: 123.05, energy: 0.6, key: '—', real: true },
"""
              text = replace_once(text, "  {\n    id: 'diet-cake',", dj_block + "  {\n    id: 'diet-cake',", 'DJ library insertion')
              write(path, text)

          # ------------------------------------------------------------------
          # Real studio sessions
          # ------------------------------------------------------------------
          path = 'src/studio/sessionCatalog.js'
          text = read(path)
          text = text.replace(
              'export const PENDING_STUDIO_SESSION_SOURCES = APPROVED_STUDIO_SOURCES;',
              'export const PENDING_STUDIO_SESSION_SOURCES = APPROVED_STUDIO_SOURCES.filter((source) => !source.runtimeReady);',
          )
          if "id: 'gairage-multitrack'" not in text:
              sessions = r"""
  {
    id: 'gairage-multitrack',
    label: 'James Benjamin × Jamvvis · Gairage · 5 buses',
    name: 'Gairage · real multitrack',
    bpm: 152,
    stems: [
      stem('gairage-drums', 'Gairage · Drums', 'drums', 'gairage-drums', 0.78),
      stem('gairage-bass', 'Gairage · Bass', 'bass', 'gairage-bass', 0.74),
      stem('gairage-synths', 'Gairage · Synths', 'synth', 'gairage-synths', 0.66, 0.08),
      stem('gairage-fx', 'Gairage · FX', 'audio', 'gairage-fx', 0.58, -0.08),
      stem('gairage-vocal-chop', 'Gairage · Vocal Chop', 'vocal', 'gairage-vocal-chop', 0.62),
    ],
  },
  {
    id: 'in-an-instant-multitrack',
    label: 'James Benjamin · In an Instant · 5 buses',
    name: 'In an Instant · real multitrack',
    bpm: 129,
    stems: [
      stem('in-an-instant-modular-drums', 'In an Instant · Modular Drums', 'drums', 'in-an-instant-modular-drums', 0.76),
      stem('in-an-instant-low-pulse', 'In an Instant · Low Pulse', 'bass', 'in-an-instant-low-pulse', 0.7),
      stem('in-an-instant-jx3p', 'In an Instant · JX-3P', 'synth', 'in-an-instant-jx3p', 0.68, -0.1),
      stem('in-an-instant-syncussion', 'In an Instant · Syncussion', 'drums', 'in-an-instant-syncussion', 0.62, 0.12),
      stem('in-an-instant-keys', 'In an Instant · ASR-88 Keys', 'keys', 'in-an-instant-keys', 0.64),
    ],
  },
"""
              text = replace_once(text, "  {\n    id: 'got-you-dancin-master',", sessions + "  {\n    id: 'got-you-dancin-master',", 'studio sessions')
          write(path, text)

          # ------------------------------------------------------------------
          # Take A Break: two real MFEOT playlist programs.
          # ------------------------------------------------------------------
          path = 'src/audio/InstallationPrograms.js'
          text = read(path)
          if "id: 'mfteot-nature'" not in text:
              programs = r"""
  {
    id: 'mfteot-nature',
    label: 'Music for the End of the World · NATURE',
    artist: 'James Benjamin',
    available: true,
    kind: 'recorded-playlist',
    description: 'Five full-length NATURE works presented as a continuous listening program inside Take A Break.',
    assetIds: [
      'mfteot-nature-waterfall-rebirth',
      'mfteot-nature-birds-at-the-sinks',
      'mfteot-nature-zona',
      'mfteot-nature-cellular-imaginings',
      'mfteot-nature-to-philly',
    ],
  },
  {
    id: 'mfteot-man',
    label: 'Music for the End of the World · MAN',
    artist: 'James Benjamin',
    available: true,
    kind: 'recorded-playlist',
    description: 'Six full-length MAN works presented as a continuous listening program inside Take A Break.',
    assetIds: [
      'mfteot-man-to-dream',
      'mfteot-man-phaser',
      'mfteot-man-dead-mans',
      'mfteot-man-decisions',
      'mfteot-man-deeper-b',
      'mfteot-man-nick-cave-esque',
    ],
  },
"""
              text = replace_once(text, "  {\n    id: 'breakglass-compositions',", programs + "  {\n    id: 'breakglass-compositions',", 'installation programs')
              write(path, text)

          # ------------------------------------------------------------------
          # SpatialAudioSystem support for recorded playlist programs.
          # ------------------------------------------------------------------
          path = 'src/audio/SpatialAudioSystem.js'
          text = read(path)
          if 'this.recordedProgramIndex = 0;' not in text:
              text = replace_once(
                  text,
                  '    this.noiseBuffer = null;\n    this.lastEnvironmentKey = \'\';',
                  "    this.noiseBuffer = null;\n    this.recordedSource = null;\n    this.recordedGain = null;\n    this.recordedProgramIndex = 0;\n    this.recordedGeneration = 0;\n    this.lastEnvironmentKey = '';",
                  'recorded constructor state',
              )
              text = replace_once(
                  text,
                  '    this.installationBus = context.createGain();\n    this.installationBus.gain.value = 0;\n',
                  '    this.installationBus = context.createGain();\n    this.installationBus.gain.value = 0;\n    this.recordedGain = context.createGain();\n    this.recordedGain.gain.value = 0.0001;\n    this.recordedGain.connect(this.installationBus);\n',
                  'recorded gain',
              )
              methods = r"""
  stopRecordedProgram({ resetIndex = false } = {}) {
    this.recordedGeneration++;
    if (this.recordedSource) {
      this.recordedSource.onended = null;
      try {
        this.recordedSource.stop();
      } catch {
        // Already ended.
      }
      this.recordedSource.disconnect();
      this.recordedSource = null;
    }
    if (resetIndex) this.recordedProgramIndex = 0;
  }

  async startRecordedProgram({ resetIndex = false } = {}) {
    const context = this.audio.context;
    const program = this.installationProgram();
    if (!context || program.kind !== 'recorded-playlist' || !program.assetIds?.length) return false;
    if (!this.audio.assets?.audio) return false;
    if (resetIndex) this.recordedProgramIndex = 0;
    if (!this.installationBus) this.ensureInstallation();

    this.stopRecordedProgram();
    const generation = this.recordedGeneration;
    const index = this.recordedProgramIndex % program.assetIds.length;
    const assetId = program.assetIds[index];
    const buffer = await this.audio.assets.audio(assetId, context);
    if (
      !buffer ||
      generation !== this.recordedGeneration ||
      this.installationProgramId !== program.id
    )
      return false;

    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(this.recordedGain);
    this.recordedSource = source;
    source.onended = () => {
      if (this.recordedSource !== source) return;
      source.disconnect();
      this.recordedSource = null;
      this.recordedProgramIndex = (index + 1) % program.assetIds.length;
      void this.startRecordedProgram();
    };
    source.start();
    return true;
  }

"""
              text = replace_once(text, '  applyInstallationProgram() {', methods + '  applyInstallationProgram() {', 'recorded methods')
              text = replace_once(
                  text,
                  "    const program = this.installationProgram();\n    for (const emitter of this.emitters) {",
                  "    const program = this.installationProgram();\n    if (program.kind === 'recorded-playlist') {\n      for (const emitter of this.emitters) {\n        this.setParam(emitter.toneGain.gain, 0, 0.18);\n        if (emitter.noiseGain) this.setParam(emitter.noiseGain.gain, 0, 0.18);\n      }\n      if (!this.recordedSource) void this.startRecordedProgram();\n      this.applyInstallationMix();\n      return;\n    }\n    this.stopRecordedProgram({ resetIndex: true });\n    for (const emitter of this.emitters) {",
                  'apply recorded program',
              )
              text = replace_once(
                  text,
                  "    this.installationProgramId = program.id;\n    this.applyInstallationProgram();",
                  "    const changed = this.installationProgramId !== program.id;\n    if (changed) this.stopRecordedProgram({ resetIndex: true });\n    this.installationProgramId = program.id;\n    this.applyInstallationProgram();",
                  'program switch',
              )
              text = replace_once(
                  text,
                  '    const installationActive = inLounge && this.installationEnabled;\n    this.updateInstallationField(installationActive);',
                  "    const installationActive = inLounge && this.installationEnabled;\n    const recordedProgram = this.installationProgram().kind === 'recorded-playlist';\n    this.updateInstallationField(installationActive && !recordedProgram);\n    if (this.recordedGain)\n      this.setParam(this.recordedGain.gain, installationActive && recordedProgram ? 0.82 : 0.0001, 0.18);",
                  'recorded update',
              )
              text = replace_once(
                  text,
                  '    this.installationFeedback?.disconnect();',
                  '    this.stopRecordedProgram({ resetIndex: true });\n    this.recordedGain?.disconnect();\n    this.installationFeedback?.disconnect();',
                  'recorded dispose',
              )
