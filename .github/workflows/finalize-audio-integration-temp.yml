      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source
        run: pnpm exec prettier --write src/assets/manifest.js src/audio/musicLibrary.js src/dj/DjMixer.js src/studio/sessionCatalog.js src/audio/InstallationPrograms.js src/audio/SpatialAudioSystem.js scripts/verify-media.mjs tests/music-library.test.js tests/installation-programs.test.js
      - name: Verify all runtime media
        run: pnpm run media:check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Formatting check
        run: pnpm run format:check
      - name: Commit completed integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-audio-integration-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests .github/workflows/finalize-audio-integration-temp.yml
          git commit -m 'Finish expanded game audio integration'
          git push origin HEAD:feat/audio-binary-ingest
