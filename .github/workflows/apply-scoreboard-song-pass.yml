name: Apply Scoreboard Song Pass

on:
  push:
    branches:
      - feat/character-realism-pass
    paths:
      - .github/workflows/apply-scoreboard-song-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/character-realism-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Apply stats, scoreboard, song playback and upstairs espresso pass
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:140]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Persistent game records + saved studio-song library.
          patch(
              'src/state/GameState.js',
              "const defaults = () => ({\n",
              """const normalizeGameStats = (value = {}) => {\n  const djLongestByName = {};\n  if (value.djLongestByName && typeof value.djLongestByName === 'object') {\n    for (const [rawKey, rawEntry] of Object.entries(value.djLongestByName).slice(0, 32)) {\n      if (typeof rawKey !== 'string' || !rawKey.trim()) continue;\n      const key = rawKey.trim().slice(0, 48);\n      const entry = rawEntry && typeof rawEntry === 'object' ? rawEntry : {};\n      djLongestByName[key] = {\n        label:\n          typeof entry.label === 'string' && entry.label.trim()\n            ? entry.label.trim().slice(0, 32)\n            : key.slice(0, 32),\n        seconds: Math.max(0, Math.min(86400, Number(entry.seconds) || 0)),\n      };\n    }\n  }\n  return {\n    walkingMeters: Math.max(0, Math.min(10000000, Number(value.walkingMeters) || 0)),\n    peakCrowdEngagement: Math.max(\n      0,\n      Math.min(100, Math.round(Number(value.peakCrowdEngagement) || 0)),\n    ),\n    peakDanceFloorCount: Math.max(\n      0,\n      Math.min(999, Math.floor(Number(value.peakDanceFloorCount) || 0)),\n    ),\n    djLongestByName,\n  };\n};\n\nconst normalizeStudioSong = (song, index) => {\n  if (!song || typeof song !== 'object') return null;\n  const session = normalizeStudioSession(song.session);\n  return {\n    id:\n      typeof song.id === 'string' && song.id.trim()\n        ? song.id.trim().slice(0, 64)\n        : `studio-song-${index + 1}`,\n    name:\n      typeof song.name === 'string' && song.name.trim()\n        ? song.name.trim().slice(0, 72)\n        : `Studio song ${index + 1}`,\n    savedAt: Math.max(0, Math.floor(Number(song.savedAt) || 0)),\n    session,\n  };\n};\n\nconst defaults = () => ({\n""",
          )
          patch(
              'src/state/GameState.js',
              """  studio: normalizeStudioSession(),\n  candy: 0,\n""",
              """  studio: normalizeStudioSession(),\n  studioSongs: [],\n  gameStats: normalizeGameStats(),\n  candy: 0,\n""",
          )
          patch(
              'src/state/GameState.js',
              """  state.studio = normalizeStudioSession(value.studio);\n  state.candy = Math.max(0, Math.min(9, Math.floor(Number(value.candy) || 0)));\n""",
              """  state.studio = normalizeStudioSession(value.studio);\n  state.gameStats = normalizeGameStats(value.gameStats);\n  if (Array.isArray(value.studioSongs)) {\n    state.studioSongs = value.studioSongs.map(normalizeStudioSong).filter(Boolean).slice(-8);\n  }\n  state.candy = Math.max(0, Math.min(9, Math.floor(Number(value.candy) || 0)));\n""",
          )

          # Make loop-builder settings survive save validation and cloned song sessions.
          patch(
              'src/studio/StudioSession.js',
              """export const DANCE_SHOES_STEMS = studioSessionById('dance-shoes').stems;\n\n""",
              """export const DANCE_SHOES_STEMS = studioSessionById('dance-shoes').stems;\n\nconst LOOP_BAR_OPTIONS = [1, 2, 4, 8, 16];\nconst QUANTIZE_OPTIONS = ['1/4', '1/8', '1/16'];\n\n""",
          )
          patch(
              'src/studio/StudioSession.js',
              """    stems,\n    takeCounter: Math.max(0, Math.floor(Number(value.takeCounter) || 0)),\n  };\n}\n""",
              """    stems,\n    takeCounter: Math.max(0, Math.floor(Number(value.takeCounter) || 0)),\n    loopEnabled: value.loopEnabled === true,\n    loopBars: LOOP_BAR_OPTIONS.includes(Number(value.loopBars)) ? Number(value.loopBars) : 4,\n    quantize: QUANTIZE_OPTIONS.includes(value.quantize) ? value.quantize : '1/16',\n    swing: clamp(Number(value.swing) || 0, 0, 0.45),\n  };\n}\n""",
          )
          patch(
              'src/studio/StudioSession.js',
              """    this.stems = normalized.stems;\n    this.takeCounter = normalized.takeCounter;\n    this.recordings = new Map();\n""",
              """    this.stems = normalized.stems;\n    this.takeCounter = normalized.takeCounter;\n    this.loopEnabled = normalized.loopEnabled;\n    this.loopBars = normalized.loopBars;\n    this.quantize = normalized.quantize;\n    this.swing = normalized.swing;\n    this.recordings = new Map();\n""",
          )
          patch(
              'src/studio/StudioSession.js',
              """      takeCounter: this.takeCounter,\n    };\n  }\n}\n""",
              """      takeCounter: this.takeCounter,\n      loopEnabled: this.loopEnabled === true,\n      loopBars: LOOP_BAR_OPTIONS.includes(Number(this.loopBars)) ? Number(this.loopBars) : 4,\n      quantize: QUANTIZE_OPTIONS.includes(this.quantize) ? this.quantize : '1/16',\n      swing: clamp(Number(this.swing) || 0, 0, 0.45),\n    };\n  }\n}\n""",
          )

          # Studio loop/song builder: save loops and play them back from Take A Break or the DJ booth.
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """const GRID_DIVISIONS = {\n""",
              """import { StudioSession } from '../studio/StudioSession.js';\n\nconst GRID_DIVISIONS = {\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """  playback.loopDuration = () => loopSeconds(session);\n  playback.loopSteps = () => Math.max(16, session.loopBars * 16);\n  playback.transportPosition = () => {\n    if (!playback.audio.context || !playback.playing) return 0;\n    const elapsed = Math.max(0, playback.audio.context.currentTime - playback.transportStartedAt);\n    if (!session.loopEnabled) return elapsed;\n    return elapsed % playback.loopDuration();\n  };\n""",
              """  playback.loopDuration = (activeSession = playback.session ?? session) => loopSeconds(activeSession);\n  playback.loopSteps = (activeSession = playback.session ?? session) =>\n    Math.max(16, activeSession.loopBars * 16);\n  playback.transportPosition = () => {\n    if (!playback.audio.context || !playback.playing) return 0;\n    const activeSession = playback.session ?? session;\n    const elapsed = Math.max(0, playback.audio.context.currentTime - playback.transportStartedAt);\n    if (!activeSession.loopEnabled) return elapsed;\n    return elapsed % playback.loopDuration(activeSession);\n  };\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """  playback.renderPerformance = (stem, step, when) => {\n    if (!session.loopEnabled) return baseRenderPerformance(stem, step, when);\n    const performance = stem.performance;\n    if (performance?.events?.length) {\n      performance.duration = loopSeconds(session);\n      performance.bpm = session.bpm;\n    }\n    return baseRenderPerformance(stem, step % playback.loopSteps(), when);\n  };\n""",
              """  playback.renderPerformance = (stem, step, when) => {\n    const activeSession = playback.session ?? session;\n    if (!activeSession.loopEnabled) return baseRenderPerformance(stem, step, when);\n    const performance = stem.performance;\n    if (performance?.events?.length) {\n      performance.duration = loopSeconds(activeSession);\n      performance.bpm = activeSession.bpm;\n    }\n    return baseRenderPerformance(stem, step % playback.loopSteps(activeSession), when);\n  };\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """function buildLoopPanel(game, ui) {\n""",
              """function cloneSongSnapshot(session) {\n  const snapshot = session.snapshot();\n  const droppedMicTakes = snapshot.stems.filter(\n    (stem) => stem.source === 'browser-microphone' && !stem.assetId && !stem.performance,\n  ).length;\n  snapshot.stems = snapshot.stems.filter(\n    (stem) => stem.source !== 'browser-microphone' || stem.assetId || stem.performance,\n  );\n  return { snapshot, droppedMicTakes };\n}\n\nfunction saveSongToLibrary(game, ui) {\n  const songs = game.state.data.studioSongs ?? (game.state.data.studioSongs = []);\n  const { snapshot, droppedMicTakes } = cloneSongSnapshot(game.studio);\n  const number = songs.length + 1;\n  const song = {\n    id: `studio-song-${Date.now()}`,\n    name: `${game.studio.name || 'Breakglass Session'} · loop ${number}`,\n    savedAt: Date.now(),\n    session: snapshot,\n  };\n  songs.push(song);\n  if (songs.length > 8) songs.splice(0, songs.length - 8);\n  game.save();\n  if (droppedMicTakes) {\n    ui.warning?.(\n      'Saved the playable loop. Browser-mic audio remains available in the current studio session but is not yet stored in the house song library.',\n    );\n  } else ui.warning?.(`Saved “${song.name}” to the Breakglass house song library.`);\n  return song;\n}\n\nfunction makeSongSession(song) {\n  const session = new StudioSession(song.session);\n  enhanceSession(session);\n  return session;\n}\n\nasync function playStudioSessionDownstairs(game, session, songId = null) {\n  game.dj?.stop?.();\n  game.partyLife?.houseDj?.holdForPlayer?.(8);\n  game.audio?.stop?.();\n  enhanceSession(session);\n  const played = await game.studioPlayback.play(session);\n  game.activeStudioSongId = played ? songId : null;\n  return played;\n}\n\nfunction buildSongLibraryPanel(game, ui, location = 'HOUSE PLAYBACK') {\n  const songs = game.state.data.studioSongs ?? [];\n  const currentHasMaterial =\n    game.studio.takeCounter > 0 ||\n    game.studio.stems.some((stem) => stem.assetId || stem.performance || game.studio.recordings.has(stem.id));\n  const actions = [\n    ...(currentHasMaterial\n      ? [\n          [\n            'Play current studio session',\n            async () => {\n              await playStudioSessionDownstairs(game, game.studio, 'current');\n              buildSongLibraryPanel(game, ui, location);\n            },\n          ],\n        ]\n      : []),\n    ...[...songs].reverse().map((song) => [\n      `Play ${song.name}`,\n      async () => {\n        await playStudioSessionDownstairs(game, makeSongSession(song), song.id);\n        buildSongLibraryPanel(game, ui, location);\n      },\n    ]),\n    [\n      'Stop studio playback',\n      () => {\n        game.studioPlayback.stop();\n        game.activeStudioSongId = null;\n        buildSongLibraryPanel(game, ui, location);\n      },\n    ],\n    ...(songs.length\n      ? [\n          [\n            'Delete newest saved song',\n            () => {\n              songs.pop();\n              game.save();\n              buildSongLibraryPanel(game, ui, location);\n            },\n          ],\n        ]\n      : []),\n  ];\n  ui.panel(\n    `${location.toUpperCase()} · STUDIO SONGS`,\n    songs.length\n      ? `${songs.length} saved studio loop${songs.length === 1 ? '' : 's'} are in the house library. The current studio session can also be auditioned directly, including any in-memory mic takes.`\n      : 'No studio loops have been saved to the house library yet. Build one upstairs and use SAVE SONG TO HOUSE LIBRARY. The current studio session can still be auditioned directly.',\n    actions,\n  );\n}\n\nfunction buildLoopPanel(game, ui) {\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """    [\n      'Delete latest take',\n      () => {\n        if (!studio.removeLatestTake()) ui.warning?.('There are no recorded takes to remove.');\n        game.save();\n        buildLoopPanel(game, ui);\n      },\n    ],\n  ];\n""",
              """    [\n      'Delete latest take',\n      () => {\n        if (!studio.removeLatestTake()) ui.warning?.('There are no recorded takes to remove.');\n        game.save();\n        buildLoopPanel(game, ui);\n      },\n    ],\n    [\n      'Save song to house library',\n      () => {\n        saveSongToLibrary(game, ui);\n        buildLoopPanel(game, ui);\n      },\n    ],\n    ['Open house song library', () => buildSongLibraryPanel(game, ui, 'Studio')],\n  ];\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """  game.showStudioLoopBuilder = () => buildLoopPanel(game, ui);\n\n  if (!ui._studioLoopBuilderPatched && typeof ui.studioMixer === 'function') {\n""",
              """  game.showStudioLoopBuilder = () => buildLoopPanel(game, ui);\n  game.showStudioSongLibrary = (location = 'House playback') =>\n    buildSongLibraryPanel(game, ui, location);\n\n  if (!game.interactions._studioSongPlayerPatched) {\n    const baseDispatch = game.interactions.dispatch.bind(game.interactions);\n    game.interactions.dispatch = (target) => {\n      if (target?.action === 'studioSongPlayer') {\n        buildSongLibraryPanel(game, ui, target.location ?? target.name ?? 'House playback');\n        return;\n      }\n      baseDispatch(target);\n    };\n    game.interactions._studioSongPlayerPatched = true;\n  }\n\n  if (!ui._studioLoopBuilderPatched && typeof ui.studioMixer === 'function') {\n""",
          )
          patch(
              'src/gameplay/StudioLoopEnhancements.js',
              """    ui._studioLoopBuilderPatched = true;\n  }\n  return game.studio;\n}\n""",
              """    ui._studioLoopBuilderPatched = true;\n  }\n\n  if (!ui._studioSongDjPatched && typeof ui.djMixer === 'function') {\n    const baseDjMixer = ui.djMixer.bind(ui);\n    ui.djMixer = (...args) => {\n      const result = baseDjMixer(...args);\n      const button = ui.document.createElement('button');\n      button.type = 'button';\n      button.textContent = 'STUDIO SONGS / LOOPS';\n      button.onclick = () => buildSongLibraryPanel(game, ui, 'DJ booth');\n      ui.buttons?.appendChild(button);\n      return result;\n    };\n    ui._studioSongDjPatched = true;\n  }\n  return game.studio;\n}\n""",
          )

          # Add a persistent game-stat tracker and interactive bar scoreboard.
          Path('src/gameplay/GameStatsSystem.js').write_text("""const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, Number(value) || 0));\n\nexport function crowdEngagementScore(snapshot = {}) {\n  const attendance = Math.max(0, Number(snapshot.attendance) || 0);\n  const danceFloor = Math.max(0, Number(snapshot.danceFloor) || 0);\n  const dancing = attendance > 0 ? clamp(danceFloor / attendance) : clamp(snapshot.danceShare);\n  const vibe = clamp(snapshot.vibe);\n  const mixQuality = clamp(snapshot.mixQuality);\n  return Math.round(clamp(dancing * 0.62 + vibe * 0.23 + mixQuality * 0.15) * 100);\n}\n\nexport function formatSetDuration(seconds) {\n  const total = Math.max(0, Math.floor(Number(seconds) || 0));\n  const hours = Math.floor(total / 3600);\n  const minutes = Math.floor((total % 3600) / 60);\n  const secs = total % 60;\n  if (hours) return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;\n  return `${minutes}:${String(secs).padStart(2, '0')}`;\n}\n\nexport function normalizeGameStats(value = {}) {\n  return {\n    walkingMeters: Math.max(0, Number(value.walkingMeters) || 0),\n    peakCrowdEngagement: Math.max(0, Math.min(100, Math.round(Number(value.peakCrowdEngagement) || 0))),\n    peakDanceFloorCount: Math.max(0, Math.floor(Number(value.peakDanceFloorCount) || 0)),\n    djLongestByName:\n      value.djLongestByName && typeof value.djLongestByName === 'object'\n        ? { ...value.djLongestByName }\n        : {},\n  };\n}\n\nfunction meter(value) {\n  const filled = Math.max(0, Math.min(10, Math.round((Number(value) || 0) / 10)));\n  return `${'█'.repeat(filled)}${'░'.repeat(10 - filled)}`;\n}\n\nexport class GameStatsSystem {\n  constructor(game, ui) {\n    this.game = game;\n    this.ui = ui;\n    game.state.data.gameStats = normalizeGameStats(game.state.data.gameStats);\n    this.lastSceneId = null;\n    this.lastPosition = null;\n    this.activeDjKey = null;\n    this.activeDjLabel = null;\n    this.activeDjSeconds = 0;\n    this.liveCrowdEngagement = 0;\n  }\n\n  stats() {\n    return this.game.state.data.gameStats;\n  }\n\n  trackWalking() {\n    const sceneId = this.game.sceneManager.current?.definition?.id ?? null;\n    const position = this.game.player?.position;\n    if (!position) return;\n    if (this.lastPosition && this.lastSceneId === sceneId) {\n      const distance = Math.hypot(position.x - this.lastPosition.x, position.z - this.lastPosition.z);\n      if (distance > 0.001 && distance < 0.9) this.stats().walkingMeters += distance;\n    }\n    this.lastSceneId = sceneId;\n    this.lastPosition = { x: position.x, z: position.z };\n  }\n\n  djIdentity() {\n    const downstairs = this.game.sceneManager.current?.definition?.id === 'downstairs';\n    const playerDj = downstairs && this.game.dj?.metrics?.().playing;\n    if (playerDj) {\n      const label = this.game.state.data.avatar?.displayName || 'Guest';\n      return { key: `player:${label.toLowerCase()}`, label };\n    }\n    const house = this.game.partyLife?.houseDj;\n    if (house?.isHouseAudio?.()) {\n      return { key: `house:${house.selected.id}`, label: house.selected.name };\n    }\n    return null;\n  }\n\n  trackDj(dt) {\n    const identity = this.djIdentity();\n    if (!identity || identity.key !== this.activeDjKey) {\n      this.activeDjKey = identity?.key ?? null;\n      this.activeDjLabel = identity?.label ?? null;\n      this.activeDjSeconds = 0;\n    }\n    if (!identity || dt <= 0) return;\n    this.activeDjSeconds += dt;\n    const current = this.stats().djLongestByName[identity.key];\n    if (!current || this.activeDjSeconds > Number(current.seconds || 0)) {\n      this.stats().djLongestByName[identity.key] = {\n        label: identity.label,\n        seconds: this.activeDjSeconds,\n      };\n    }\n  }\n\n  trackCrowd() {\n    const snapshot = this.game.scenes.get('downstairs')?.crowd?.snapshot?.();\n    if (!snapshot) return;\n    const score = crowdEngagementScore(snapshot);\n    this.liveCrowdEngagement = score;\n    this.stats().peakCrowdEngagement = Math.max(this.stats().peakCrowdEngagement, score);\n    this.stats().peakDanceFloorCount = Math.max(\n      this.stats().peakDanceFloorCount,\n      Math.floor(Number(snapshot.danceFloor) || 0),\n    );\n  }\n\n  update(dt) {\n    this.trackWalking();\n    this.trackDj(dt);\n    this.trackCrowd();\n  }\n\n  djLeaders() {\n    return Object.values(this.stats().djLongestByName)\n      .filter((entry) => entry && Number(entry.seconds) > 0)\n      .sort((a, b) => Number(b.seconds) - Number(a.seconds))\n      .slice(0, 5);\n  }\n\n  addCard(grid, title, value, detail = '') {\n    const card = this.ui.document.createElement('div');\n    card.className = 'mixer-strip';\n    const heading = this.ui.document.createElement('strong');\n    heading.textContent = title;\n    const number = this.ui.document.createElement('div');\n    number.textContent = String(value);\n    number.style.fontSize = '1.35rem';\n    number.style.margin = '0.3rem 0';\n    card.append(heading, number);\n    if (detail) {\n      const small = this.ui.document.createElement('small');\n      small.textContent = detail;\n      card.appendChild(small);\n    }\n    grid.appendChild(card);\n  }\n\n  panel() {\n    const state = this.game.state.data;\n    const stats = this.stats();\n    const name = state.avatar?.displayName || 'Guest';\n    const leaders = this.djLeaders();\n    const steps = Math.floor(stats.walkingMeters / 0.74);\n    this.ui.panel(\n      'BREAKGLASS SCOREBOARD',\n      `House records for ${name}. The FLOOR METER is a 0–100 crowd-engagement score based on how much of the room is dancing, the floor vibe and mix quality — not a literal sound-pressure dB reading.`,\n      [['Refresh board', () => this.panel()]],\n    );\n    const grid = this.ui.document.createElement('div');\n    grid.className = 'control-grid';\n    this.addCard(\n      grid,\n      'LONGEST DJ SETS',\n      leaders.length ? formatSetDuration(leaders[0].seconds) : '—',\n      leaders.length\n        ? leaders.map((entry, index) => `${index + 1}. ${entry.label} ${formatSetDuration(entry.seconds)}`).join(' · ')\n        : 'No completed or active sets yet.',\n    );\n    this.addCard(\n      grid,\n      'FLOOR METER',\n      `${this.liveCrowdEngagement}/100`,\n      `${meter(this.liveCrowdEngagement)} · peak ${stats.peakCrowdEngagement}/100 · ${stats.peakDanceFloorCount} dancers peak`,\n    );\n    this.addCard(grid, 'CIGARETTES', Math.max(0, Math.floor(Number(state.smokesShared) || 0)), 'smoked in the alley');\n    this.addCard(grid, 'MADDOX PETS', Math.max(0, Math.floor(Number(state.maddoxPets) || 0)), 'good dog counter');\n    this.addCard(grid, 'DRINKS', Math.max(0, Math.floor(Number(state.drinksServed) || 0)), 'alcoholic drinks consumed');\n    this.addCard(grid, 'COFFEES', Math.max(0, Math.floor(Number(state.coffeesMade) || 0)), 'espresso / coffee consumed');\n    this.addCard(grid, 'STEPS', steps.toLocaleString(), `${Math.round(stats.walkingMeters)} m explored`);\n    this.ui.buttons.prepend(grid);\n  }\n}\n\nexport function installGameStatsEnhancements(game, ui) {\n  const system = new GameStatsSystem(game, ui);\n  game.gameStats = system;\n\n  const baseDispatch = game.interactions.dispatch.bind(game.interactions);\n  game.interactions.dispatch = (target) => {\n    if (target?.action === 'scoreboard') {\n      system.panel();\n      return;\n    }\n    baseDispatch(target);\n  };\n\n  let lastNow = null;\n  const baseUpdate = game.update.bind(game);\n  game.update = (now, movementOverride = null) => {\n    const dt = lastNow == null ? 0 : Math.max(0, Math.min(0.05, (now - lastNow) / 1000));\n    lastNow = now;\n    const result = baseUpdate(now, movementOverride);\n    if (game.started && !document.hidden) system.update(dt);\n    return result;\n  };\n\n  return system;\n}\n""")

          # Put the scoreboard and Take A Break studio-song player into the club world.
          patch(
              'src/world/levels.js',
              """      coffeeMachine: anchor('Kitchen coffee machine', [-9.18, 0, 2.55], 1.35, 'coffee'),\n      devin: anchor('Devin', [-4.95, 0, 2.7], 1.2, 'dialogue'),\n      installation: anchor('Take A Break installation', [7.65, 0, 4.8], 1.5, 'installation'),\n""",
              """      coffeeMachine: anchor('Kitchen coffee machine', [-9.18, 0, 2.55], 1.35, 'coffee'),\n      scoreboard: anchor('Breakglass scoreboard', [-9.45, 0, 0.9], 1.35, 'scoreboard'),\n      devin: anchor('Devin', [-4.95, 0, 2.7], 1.2, 'dialogue'),\n      installation: anchor('Take A Break installation', [7.65, 0, 4.8], 1.5, 'installation'),\n      studioSongPlayer: {\n        ...anchor('Take A Break · studio song playback', [8.45, 0, 5.72], 1.4, 'studioSongPlayer'),\n        location: 'Take A Break',\n      },\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  label(downScene, 'COURTNEY + SIMLA · BAR', -8.15, 2.62, 3.25, 0.23, '#ffc9b0');\n\n  box(downScene, 1.45, 0.34, 0.08, mat(0x3f6c55, 0.45, 0.04), 4.6, 2.45, -3.33);\n""",
              """  label(downScene, 'COURTNEY + SIMLA · BAR', -8.15, 2.62, 3.25, 0.23, '#ffc9b0');\n\n  // House record board in the bar. Live values are shown in the interaction panel.\n  box(downScene, 0.08, 1.42, 1.72, mat(0x101916, 0.52, 0.06), -9.84, 1.72, 0.92);\n  box(downScene, 0.035, 1.24, 1.54, mat(0x26372f, 0.6, 0.03), -9.78, 1.72, 0.92);\n  label(downScene, 'BREAKGLASS SCOREBOARD', -9.68, 2.55, 0.92, 0.19, '#d8ffd5');\n  for (const z of [0.43, 0.68, 0.93, 1.18, 1.43])\n    box(downScene, 0.025, 0.025, 1.2, mat(0x7ca58c, 0.7, 0.02), -9.73, 1.35, z);\n\n  box(downScene, 1.45, 0.34, 0.08, mat(0x3f6c55, 0.45, 0.04), 4.6, 2.45, -3.33);\n""",
          )

          # Upstairs studio kitchen espresso machine: interactive + visible.
          patch(
              'src/gameplay/BarServiceSystem.js',
              """  handle(target) {\n    if (this.sceneManager.current?.definition?.id !== 'downstairs') return false;\n    if (target?.action === 'coffee') {\n      this.coffeePanel();\n      return true;\n    }\n    const id = target?.npcId ?? target?.id;\n""",
              """  handle(target) {\n    const sceneId = this.sceneManager.current?.definition?.id;\n    if (target?.action === 'coffee') {\n      if (!['downstairs', 'upstairs'].includes(sceneId)) return false;\n      this.coffeePanel(sceneId === 'upstairs' ? 'You use the espresso machine in the studio kitchen.' : '');\n      return true;\n    }\n    if (sceneId !== 'downstairs') return false;\n    const id = target?.npcId ?? target?.id;\n""",
          )
          patch(
              'src/world/upstairs/definition.js',
              """      photoFridge: {\n        name: 'Kitchen fridge · Nora photos',\n        position: fridgePosition,\n        radius: 1.6,\n        action: 'photoFridge',\n      },\n      instruments: {\n""",
              """      photoFridge: {\n        name: 'Kitchen fridge · Nora photos',\n        position: fridgePosition,\n        radius: 1.6,\n        action: 'photoFridge',\n      },\n      coffeeMachine: {\n        name: 'Studio kitchen espresso machine',\n        position: at(786, 594),\n        radius: 1.5,\n        action: 'coffee',\n      },\n      instruments: {\n""",
