name: Format Music Temp

on:
  push:
    branches: [feat/expanded-music-library]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/audio/musicLibrary.js tests/music-library.test.js
      - name: Commit canonical formatting if needed
        run: |
          if git diff --quiet -- src/audio/musicLibrary.js tests/music-library.test.js; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audio/musicLibrary.js tests/music-library.test.js
          git commit -m 'Format music library files'
          git push origin HEAD:feat/expanded-music-library
