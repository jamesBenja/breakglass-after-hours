name: Activate Multiplayer

on:
  push:
    branches:
      - feat/live-multiplayer-foundation
    paths:
      - .github/workflows/activate-multiplayer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-multiplayer-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Activate default live multiplayer endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/multiplayer/MultiplayerClient.js')
          text = path.read_text()
          text = text.replace(
              "const DEFAULT_ROOM = 'breakglass-main';",
              "const DEFAULT_ROOM = 'breakglass-main';\nconst DEFAULT_SERVER = 'https://multiplayer-production-8f39.up.railway.app';",
          )
          old = """  const configured =
    queryServer ||
    globalThis.BREAKGLASS_MULTIPLAYER_URL ||
    import.meta.env?.VITE_MULTIPLAYER_URL ||
    stored ||
    null;"""
          new = """  const configured =
    queryServer ||
    globalThis.BREAKGLASS_MULTIPLAYER_URL ||
    import.meta.env?.VITE_MULTIPLAYER_URL ||
    stored ||
    DEFAULT_SERVER;"""
          if old not in text:
              raise SystemExit('Expected multiplayer endpoint block not found')
          text = text.replace(old, new)
          old_start = """    // The optional selfie texture was promised as local-only. Multiplayer therefore shares the
    // chosen avatar shape/style/name but deliberately never uploads that processed face image.
    this.avatar = { ...normalizeAvatar(avatar), faceTexture: null };"""
          new_start = """    // Selfie sharing remains opt-in. multiplayerAvatar strips the processed texture unless
    // shareFaceMultiplayer was explicitly enabled by the player.
    this.avatar = multiplayerAvatar(avatar);"""
          if old_start not in text:
              raise SystemExit('Expected stale local-only avatar block not found')
          text = text.replace(old_start, new_start)
          path.write_text(text)
          PY
      - name: Format and verify
        run: |
          pnpm exec prettier --write src/multiplayer/MultiplayerClient.js
          pnpm test
          pnpm build
          pnpm format:check
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer/MultiplayerClient.js
          git commit -m "Activate live multiplayer endpoint"
          git push origin HEAD:feat/live-multiplayer-foundation
