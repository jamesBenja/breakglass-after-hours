name: Final character reference pass

on:
  push:
    branches:
      - feat/sam-malaika-group-photo
    paths:
      - scripts/final_character_refs.py
      - .github/workflows/final-character-refs.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sam-malaika-group-photo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply final reference patch
        run: python scripts/final_character_refs.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/npcs/NpcSystem.js
          src/npcs/dialogues.js
          src/world/roof.js
          docs/CHARACTER_REFERENCES.md
          tests/character-social-pass.test.js

      - name: Verify requested mappings
        shell: bash
        run: |
          grep -q "jashim:" src/npcs/NpcSystem.js
          grep -q "dave:" src/npcs/NpcSystem.js
          grep -q "DAVE · FOUNDER" src/npcs/dialogues.js
          grep -q "id: 'dave'" src/world/roof.js
          grep -q "Drive/Jashim" docs/CHARACTER_REFERENCES.md
          grep -q "Dave and David remain separate" docs/CHARACTER_REFERENCES.md
          git diff --check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Production multiplayer smoke
        env:
          MULTIPLAYER_URL: wss://multiplayer-phase2-webrtc-production.up.railway.app
        run: node scripts/smoke-live-multiplayer.mjs

      - name: Formatting check
        run: >-
          pnpm exec prettier --check
          src/npcs/NpcSystem.js
          src/npcs/dialogues.js
          src/world/roof.js
          docs/CHARACTER_REFERENCES.md
          tests/character-social-pass.test.js

      - name: Commit verified final pass and remove temporary validation files
        shell: bash
        run: |
          rm scripts/final_character_refs.py
          rm -f .github/workflows/malaika-companion-fix.yml
          rm -f .github/workflows/final-character-refs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Jashim and roof-founder Dave character references"
          git push origin HEAD:feat/sam-malaika-group-photo
