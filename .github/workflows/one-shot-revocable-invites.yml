name: One-shot revocable invitations

on:
  push:
    branches:
      - feat/revocable-invite-tokens
    paths:
      - .github/workflows/one-shot-revocable-invites.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/revocable-invite-tokens
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Apply patch
        run: python scripts/patch_revocable_invite_tokens.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: node --check server/multiplayerServer.mjs
      - name: Verify exact invitation token
        env:
          PORT: '8799'
          GOD_MODE_TOKEN: fallback-test-secret
          INVITE_DJ_TOKEN: dj.test-revocable-token
        run: |
          node server/multiplayerServer.mjs > /tmp/server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8799/health && break || sleep 0.25; done
          curl -fsS -H 'Authorization: Bearer dj.test-revocable-token' http://127.0.0.1:8799/invite/verify | grep '"type":"dj"'
          if curl -fsS -H 'Authorization: Bearer dj.forged' http://127.0.0.1:8799/invite/verify; then exit 1; fi
      - name: Production build
        run: pnpm build
      - name: Commit verified backend
        run: |
          rm .github/workflows/one-shot-revocable-invites.yml scripts/patch_revocable_invite_tokens.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add revocable server-side invitation tokens"
          git push origin HEAD:feat/revocable-invite-tokens
