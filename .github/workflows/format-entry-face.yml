name: Format Entry Face

on:
  push:
    branches:
      - feat/mobile-performance-dj-surface

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-performance-dj-surface
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format entry and face files
        run: >-
          pnpm exec prettier --write
          src/avatar/faceAvatarEnhancements.js
          src/avatar/profile.js
          src/gameplay/entryEnhancements.js
          src/ui/avatarFace.css
          src/main.js
          tests/entry-avatar.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/avatar/faceAvatarEnhancements.js src/avatar/profile.js src/gameplay/entryEnhancements.js src/ui/avatarFace.css src/main.js tests/entry-avatar.test.js
          git commit -m "Format entry and face avatar pass"
          git push origin HEAD:feat/mobile-performance-dj-surface
