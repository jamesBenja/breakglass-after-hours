name: Apply Club Flow Pass Retry

on:
  push:
    branches:
      - feat/character-realism-pass
    paths:
      - .github/workflows/apply-club-flow-pass-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/character-realism-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Apply existing club-flow patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-club-flow-pass.yml').read_text()
          marker = '      - name: Apply room swap and guided progression'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          script_start = workflow.index(run_marker, start) + len(run_marker)
          script_end = workflow.index('\n      - name: Format', script_start)
          script = textwrap.dedent(workflow[script_start:script_end])
          exec(compile(script, 'apply-club-flow-pass.yml', 'exec'), {'__name__': '__main__'})

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/scenes/geometry/belowBlockout.js
          src/scenes/geometry/roomFurniture.js
          src/gameplay/roomExperienceEnhancements.js
          src/audio/SpatialAudioSystem.js
          src/world/levels.js
          src/state/GameState.js
          src/world/upstairs/definition.js
          src/interactions/createActions.js
          tests/club-flow.test.js

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting check for changed files
        run: >-
          pnpm exec prettier --check
          src/scenes/geometry/belowBlockout.js
          src/scenes/geometry/roomFurniture.js
          src/gameplay/roomExperienceEnhancements.js
          src/audio/SpatialAudioSystem.js
          src/world/levels.js
          src/state/GameState.js
          src/world/upstairs/definition.js
          src/interactions/createActions.js
          tests/club-flow.test.js

      - name: Commit verified club-flow pass
        run: |
          rm .github/workflows/apply-club-flow-pass.yml
          rm .github/workflows/apply-club-flow-pass-retry.yml
          git config user.name "jamesBenja"
          git config user.email "70452184+jamesBenja@users.noreply.github.com"
          git add -A
          git commit -m "Swap Below side rooms and gate studio progression"
          git push origin HEAD:feat/character-realism-pass
