name: Format dance floor social

on:
  push:
    branches: [feat/dance-floor-social]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dance-floor-social

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --write src/gameplay/DanceFloorSocial.js src/multiplayer/MultiplayerClient.js

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameplay/DanceFloorSocial.js src/multiplayer/MultiplayerClient.js
          git commit -m "Format dance floor social changes"
          git push
