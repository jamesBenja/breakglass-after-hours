name: Temporary A9 UI formatter
on:
  push:
    branches: [feat/multiplayer-phase-2-shared-world]
    paths: [.github/workflows/format-a9-ui.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write src/ui/djHardwareV2.css
          pnpm exec prettier --check src/ui/djHardwareV2.css
      - run: |
          if git diff --quiet -- src/ui/djHardwareV2.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/djHardwareV2.css
          git commit -m "Format A9 meter styles"
          git push
