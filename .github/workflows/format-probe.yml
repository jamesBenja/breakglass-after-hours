name: Format Probe

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/format-probe.yml
      - src/studio/SpectraRecorder.js
      - tests/spectra-recorder.test.js

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write src/studio/SpectraRecorder.js tests/spectra-recorder.test.js
          git diff --no-color -- src/studio/SpectraRecorder.js tests/spectra-recorder.test.js
