name: Apply god mode backend
on:
  push:
    branches:
      - feat/god-mode-backend
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/god-mode-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: python scripts/applyGodModeBackendPatch.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Remove patch helpers
        run: git rm .github/workflows/apply-god-mode-backend.yml scripts/applyGodModeBackendPatch.py
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/multiplayerServer.mjs
          git commit -m 'Add server-verified god mode access'
          git push origin HEAD:feat/god-mode-backend
