name: Apply god mode backend
on:
  push:
    branches: [feat/god-mode-backend]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/god-mode-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Apply backend patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/multiplayerServer.mjs')
          s = p.read_text()
          s = s.replace("const MAX_PLAYERS_PER_ROOM = Number(process.env.MAX_PLAYERS_PER_ROOM || 24);", "const MAX_PLAYERS_PER_ROOM = Number(process.env.MAX_PLAYERS_PER_ROOM || 24);\nconst GOD_MODE_TOKEN = String(process.env.GOD_MODE_TOKEN || '');")
          marker = "const server = http.createServer((request, response) => {\n  const url = new URL(request.url || '/', `http://${request.headers.host || 'localhost'}`);\n  if (url.pathname === '/health') {"
          replacement = """function validGodModeToken(value) {
  const candidate = typeof value === 'string' ? value.trim() : '';
  if (!GOD_MODE_TOKEN || !candidate) return false;
  const expected = Buffer.from(GOD_MODE_TOKEN);
  const received = Buffer.from(candidate);
  return expected.length === received.length && crypto.timingSafeEqual(expected, received);
}

function godModeCors(response) {
  response.setHeader('access-control-allow-origin', '*');
  response.setHeader('access-control-allow-methods', 'GET, OPTIONS');
  response.setHeader('access-control-allow-headers', 'authorization');
  response.setHeader('cache-control', 'no-store');
}

const server = http.createServer((request, response) => {
  const url = new URL(request.url || '/', `http://${request.headers.host || 'localhost'}`);
  if (url.pathname === '/god-mode/verify') {
    godModeCors(response);
    if (request.method === 'OPTIONS') {
      response.writeHead(204);
      response.end();
      return;
    }
    const authorization = String(request.headers.authorization || '');
    const token = authorization.startsWith('Bearer ') ? authorization.slice(7) : '';
    const ok = validGodModeToken(token);
    response.writeHead(ok ? 200 : 401, { 'content-type': 'application/json; charset=utf-8' });
    response.end(JSON.stringify({ ok }));
    return;
  }
  if (url.pathname === '/health') {"""
          if marker not in s:
              raise SystemExit('server handler marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-god-mode-backend.yml
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/multiplayerServer.mjs
          git commit -m 'Add server-verified god mode access'
          git push origin HEAD:feat/god-mode-backend
