name: Apply god mode backend
on:
  push:
    branches:
      - feat/god-mode-backend
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/god-mode-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: python scripts/applyGodModeBackendPatch.py
      - run: pnpm install --frozen-lockfile
      - name: Server syntax check
        run: node --check server/multiplayerServer.mjs
      - name: God Mode verification smoke test
        run: |
          GOD_MODE_TOKEN=ci-secret PORT=8799 node server/multiplayerServer.mjs > /tmp/bg-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" = "1"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/god-mode/verify)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:8799/god-mode/verify)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-secret' http://127.0.0.1:8799/god-mode/verify)" = "200"
          kill $pid
          wait $pid || true
          trap - EXIT
      - run: pnpm build
      - name: Remove patch helpers
        run: git rm .github/workflows/apply-god-mode-backend.yml scripts/applyGodModeBackendPatch.py
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/multiplayerServer.mjs
          git commit -m 'Add server-verified god mode access'
          git push origin HEAD:feat/god-mode-backend
