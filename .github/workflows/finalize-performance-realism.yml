name: Finalize Performance Realism

on:
  push:
    branches:
      - feat/performance-realism-pass
    paths:
      - .github/workflows/finalize-performance-realism.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-realism-pass

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Harden turntable transport and shared ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          # Turntable motor / platter should freeze the real transport position, not merely the UI.
          path = Path('src/gameplay/DjPerformanceRealismSystem.js')
          text = path.read_text()
          text = text.replace(
              "  deck._phaseErrorMs ??= 0;\n}",
              "  deck._phaseErrorMs ??= 0;\n  deck._transportFrozenAt ??= null;\n}",
              1,
          )
          text = text.replace(
              "  if (deck.source?.playbackRate) deck.source.playbackRate.value = deck.platterHeld ? 0.001 : rate;",
              "  if (deck.source?.playbackRate)\n    deck.source.playbackRate.value = deck.platterHeld || !deck.motorOn ? 0.001 : rate;",
              1,
          )
          text = text.replace(
              "  const baseSnapshot = mixer.snapshot.bind(mixer);\n\n  mixer.setDeviceMode",
              "  const baseSnapshot = mixer.snapshot.bind(mixer);\n  const baseDeckPosition =\n    typeof mixer.deckPosition === 'function' ? mixer.deckPosition.bind(mixer) : null;\n\n  if (baseDeckPosition) {\n    mixer.deckPosition = (deckId) => {\n      const deck = mixer.decks[deckId];\n      if (!deck) return 0;\n      ensureState(deck);\n      if (Number.isFinite(deck._transportFrozenAt)) return deck._transportFrozenAt;\n      return baseDeckPosition(deckId);\n    };\n  }\n\n  mixer.setDeviceMode",
              1,
          )
          old = """  mixer.toggleMotor = (deckId) => {
              const deck = mixer.decks[deckId];
              if (!deck) return false;
              ensureState(deck);
              deck.motorOn = !deck.motorOn;
              if (!deck.motorOn && deck.media) deck.media.pause();
              applyPlaybackRate(mixer, deck);
              return deck.motorOn;
            };

            mixer.setPlatterHeld = (deckId, held) => {
              const deck = mixer.decks[deckId];
              if (!deck) return false;
              ensureState(deck);
              deck.platterHeld = held === true;
              applyPlaybackRate(mixer, deck);
              return deck.platterHeld;
            };
          """
          new = """  mixer.toggleMotor = (deckId) => {
              const deck = mixer.decks[deckId];
              if (!deck) return false;
              ensureState(deck);
              if (deck.motorOn) {
                deck._transportFrozenAt = mixer.deckPosition?.(deckId) ?? 0;
                deck.motorOn = false;
              } else {
                const resumeAt = Number.isFinite(deck._transportFrozenAt)
                  ? deck._transportFrozenAt
                  : mixer.deckPosition?.(deckId) ?? 0;
                deck.motorOn = true;
                deck._transportFrozenAt = null;
                if (deck.playing) mixer.restartDeckAt?.(deckId, resumeAt);
              }
              if (!deck.motorOn && deck.media) deck.media.pause();
              applyPlaybackRate(mixer, deck);
              return deck.motorOn;
            };

            mixer.setPlatterHeld = (deckId, held) => {
              const deck = mixer.decks[deckId];
              if (!deck) return false;
              ensureState(deck);
              const next = held === true;
              if (next && !deck.platterHeld) {
                deck._transportFrozenAt = mixer.deckPosition?.(deckId) ?? 0;
              } else if (!next && deck.platterHeld) {
                const resumeAt = Number.isFinite(deck._transportFrozenAt)
                  ? deck._transportFrozenAt
                  : mixer.deckPosition?.(deckId) ?? 0;
                deck._transportFrozenAt = null;
                if (deck.playing && deck.motorOn) mixer.restartDeckAt?.(deckId, resumeAt);
              }
              deck.platterHeld = next;
              applyPlaybackRate(mixer, deck);
              return deck.platterHeld;
            };
          """
          if old not in text:
              raise SystemExit('turntable motor block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "    return mixer.restartDeckAt?.(deckId, target) ?? false;\n  };\n\n  mixer.jog =",
              "    if (Number.isFinite(deck._transportFrozenAt)) {\n      deck._transportFrozenAt = target;\n      return true;\n    }\n    return mixer.restartDeckAt?.(deckId, target) ?? false;\n  };\n\n  mixer.jog =",
              1,
          )
          text = text.replace(
              "    const target = Math.max(0, current + Number(beats || 0) * sourceBeatSeconds(deck));\n    return mixer.restartDeckAt?.(deckId, target) ?? false;\n  };\n\n  mixer.setPreciseLoop",
              "    const target = Math.max(0, current + Number(beats || 0) * sourceBeatSeconds(deck));\n    if (Number.isFinite(deck._transportFrozenAt)) {\n      deck._transportFrozenAt = target;\n      return true;\n    }\n    return mixer.restartDeckAt?.(deckId, target) ?? false;\n  };\n\n  mixer.setPreciseLoop",
              1,
          )
          text = text.replace(
              "      deck._jogBend = 0;\n    }",
              "      deck._jogBend = 0;\n      deck._transportFrozenAt = null;\n    }",
              1,
          )
          path.write_text(text)

          # Do not mark an LED state as broadcast before the multiplayer ownership guard succeeds.
          path = Path('src/gameplay/LedWallSystem.js')
          text = path.read_text()
          old = """    if (signature === this.lastBroadcastState) return;
              this.lastBroadcastState = signature;
              if (this.game.multiplayer?.joined) {
                if (world && !world.owns?.('led-wall-controller')) {
                  this.ui.warning?.('Take control of the VISUALS desk before changing the shared LED wall.');
                  return;
                }
                this.game.multiplayer.send({ type: 'object_update', objectId: 'dj-led-wall', data: snapshot });
              } else if (world?.objects) world.objects.set('dj-led-wall', snapshot);
          """
          new = """    if (signature === this.lastBroadcastState) return;
              if (this.game.multiplayer?.joined) {
                if (world && !world.owns?.('led-wall-controller')) {
                  this.ui.warning?.('Take control of the VISUALS desk before changing the shared LED wall.');
                  return;
                }
                if (
                  this.game.multiplayer.send({
                    type: 'object_update',
                    objectId: 'dj-led-wall',
                    data: snapshot,
                  })
                )
                  this.lastBroadcastState = signature;
              } else {
                if (world?.objects) world.objects.set('dj-led-wall', snapshot);
                this.lastBroadcastState = signature;
              }
          """
          if old not in text:
              raise SystemExit('LED broadcast block not found')
          path.write_text(text.replace(old, new, 1))

          # Applying a remote motor/platter state must update the actual audio source too.
          path = Path('src/multiplayer/SharedWorld.js')
          text = path.read_text()
          old = """        if (target.deviceMode) dj.setDeviceMode?.(deckId, target.deviceMode);
                if (target.deviceMode === 'vinyl' && target.vinylRpm) dj.setVinylRpm?.(deckId, target.vinylRpm);
                deck.motorOn = target.motorOn !== false;
                deck.platterHeld = target.platterHeld === true;
                if (Array.isArray(target.cuePoints)) deck.cuePoints = target.cuePoints.slice(0, 8);
          """
          new = """        if (target.deviceMode) dj.setDeviceMode?.(deckId, target.deviceMode);
                if (target.deviceMode === 'vinyl' && target.vinylRpm)
                  dj.setVinylRpm?.(deckId, target.vinylRpm);
                const targetMotorOn = target.motorOn !== false;
                if (typeof dj.toggleMotor === 'function' && deck.motorOn !== targetMotorOn)
                  dj.toggleMotor(deckId);
                else deck.motorOn = targetMotorOn;
                const targetHeld = target.platterHeld === true;
                if (typeof dj.setPlatterHeld === 'function' && deck.platterHeld !== targetHeld)
                  dj.setPlatterHeld(deckId, targetHeld);
                else deck.platterHeld = targetHeld;
                if (Array.isArray(target.cuePoints)) deck.cuePoints = target.cuePoints.slice(0, 8);
          """
          if old not in text:
              raise SystemExit('remote turntable apply block not found')
          text = text.replace(old, new, 1)
          old = """          if (target.loopBeats) (dj.setPreciseLoop ?? dj.setLoop).call(dj, deckId, target.loopBeats);
                    else if (deck.loopBeats) dj.setLoop(deckId, deck.loopBeats);
          """
          new = """          if (target.loopBeats)
                      (dj.setPreciseLoop ?? dj.setLoop).call(dj, deckId, target.loopBeats);
                    else if (deck.loopBeats) {
                      if (typeof dj.setPreciseLoop === 'function') dj.setPreciseLoop(deckId, 0);
                      else dj.setLoop(deckId, deck.loopBeats);
                    }
          """
          if old not in text:
              raise SystemExit('remote loop release block not found')
          path.write_text(text.replace(old, new, 1))

          # LED updates are authoritative: only the player holding the VISUALS desk may change it.
          path = Path('server/multiplayerServer.mjs')
          text = path.read_text()
          old = """  const room = roomFor(player.roomId);
            const data = objectId === 'dj-led-wall' ? sanitizeLedWall(message.data) : sanitizeJson(message.data);
          """
          new = """  const room = roomFor(player.roomId);
            if (objectId === 'dj-led-wall') {
              const controller = room.resources.get('led-wall-controller');
              if (!controller || controller.ownerId !== player.id) return;
            }
            const data =
              objectId === 'dj-led-wall' ? sanitizeLedWall(message.data) : sanitizeJson(message.data);
          """
          if old not in text:
              raise SystemExit('server LED ownership insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          src/main.js
          src/gameplay/DjPerformanceRealismSystem.js
          src/gameplay/LedWallSystem.js
          src/gameplay/StudioLoopEnhancements.js
          src/gameplay/PerformancePropSystem.js
          src/gameplay/installPerformanceRealismSystems.js
          src/gameplay/LiveBandSystem.js
          src/scenes/geometry/djBoothRealism.js
          src/scenes/geometry/belowBlockout.js
          src/world/levels.js
          src/interactions/createActions.js
          src/multiplayer/SharedWorld.js
          server/multiplayerServer.mjs
          src/ui/performanceRealism.css
          .github/workflows/iphone-preview.yml

      - name: Verify before publishing
        run: |
          pnpm test
          pnpm build

      - name: Remove temporary one-shot workflows
        run: |
          rm -f .github/workflows/apply-performance-realism-geometry.yml
          rm -f .github/workflows/apply-performance-realism-integration.yml
          rm -f .github/workflows/fix-performance-realism-runtime.yml
          rm -f .github/workflows/finalize-performance-realism.yml

      - name: Commit final pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize performance realism pass"
          git push origin HEAD:feat/performance-realism-pass
