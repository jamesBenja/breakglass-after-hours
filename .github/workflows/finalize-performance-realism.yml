name: Finalize Performance Realism v2

on:
  push:
    branches:
      - feat/performance-realism-pass
    paths:
      - .github/workflows/finalize-performance-realism.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-realism-pass

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Harden performance transport and multiplayer ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_sub(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return updated

          # Real turntable transport: platter hold and motor stop freeze the musical position.
          path = Path('src/gameplay/DjPerformanceRealismSystem.js')
          text = path.read_text()
          if 'deck._transportFrozenAt ??= null;' not in text:
              text = text.replace(
                  '  deck._phaseErrorMs ??= 0;\n',
                  '  deck._phaseErrorMs ??= 0;\n  deck._transportFrozenAt ??= null;\n',
                  1,
              )
          text = text.replace(
              'if (deck.source?.playbackRate) deck.source.playbackRate.value = deck.platterHeld ? 0.001 : rate;',
              'if (deck.source?.playbackRate)\n    deck.source.playbackRate.value = deck.platterHeld || !deck.motorOn ? 0.001 : rate;',
              1,
          )
          if 'const baseDeckPosition =' not in text:
              text = text.replace(
                  '  const baseSnapshot = mixer.snapshot.bind(mixer);\n',
                  "  const baseSnapshot = mixer.snapshot.bind(mixer);\n  const baseDeckPosition =\n    typeof mixer.deckPosition === 'function' ? mixer.deckPosition.bind(mixer) : null;\n\n  if (baseDeckPosition) {\n    mixer.deckPosition = (deckId) => {\n      const deck = mixer.decks[deckId];\n      if (!deck) return 0;\n      ensureState(deck);\n      if (Number.isFinite(deck._transportFrozenAt)) return deck._transportFrozenAt;\n      return baseDeckPosition(deckId);\n    };\n  }\n",
                  1,
              )

          transport_block = """  mixer.toggleMotor = (deckId) => {
            const deck = mixer.decks[deckId];
            if (!deck) return false;
            ensureState(deck);
            if (deck.motorOn) {
              deck._transportFrozenAt = mixer.deckPosition?.(deckId) ?? 0;
              deck.motorOn = false;
            } else {
              const resumeAt = Number.isFinite(deck._transportFrozenAt)
                ? deck._transportFrozenAt
                : mixer.deckPosition?.(deckId) ?? 0;
              deck.motorOn = true;
              deck._transportFrozenAt = null;
              if (deck.playing) mixer.restartDeckAt?.(deckId, resumeAt);
            }
            if (!deck.motorOn && deck.media) deck.media.pause();
            applyPlaybackRate(mixer, deck);
            return deck.motorOn;
          };

          mixer.setPlatterHeld = (deckId, held) => {
            const deck = mixer.decks[deckId];
            if (!deck) return false;
            ensureState(deck);
            const next = held === true;
            if (next && !deck.platterHeld) {
              deck._transportFrozenAt = mixer.deckPosition?.(deckId) ?? 0;
            } else if (!next && deck.platterHeld) {
              const resumeAt = Number.isFinite(deck._transportFrozenAt)
                ? deck._transportFrozenAt
                : mixer.deckPosition?.(deckId) ?? 0;
              deck._transportFrozenAt = null;
              if (deck.playing && deck.motorOn) mixer.restartDeckAt?.(deckId, resumeAt);
            }
            deck.platterHeld = next;
            applyPlaybackRate(mixer, deck);
            return deck.platterHeld;
          };
          """
          text = must_sub(
              text,
              r"  mixer\.toggleMotor = \(deckId\) => \{.*?\n  \};\n\n  mixer\.setPlatterHeld = \(deckId, held\) => \{.*?\n  \};\n",
              transport_block,
              'turntable transport block',
              re.S,
          )

          # Beat-jump and jog should move the frozen record position while the platter is held.
          beatjump_pattern = r"(  mixer\.beatJump = \(deckId, beats\) => \{.*?const target = Math\.max\(0, current \+ Number\(beats \|\| 0\) \* sourceBeatSeconds\(deck\)\);\n)(    return mixer\.restartDeckAt\?\.\(deckId, target\) \?\? false;\n  \};)"
          text = must_sub(
              text,
              beatjump_pattern,
              r"\1    if (Number.isFinite(deck._transportFrozenAt)) {\n      deck._transportFrozenAt = target;\n      return true;\n    }\n\2",
              'beat jump frozen transport',
              re.S,
          )
          jog_pattern = r"(  mixer\.jog = \(deckId, beats\) => \{.*?const target = Math\.max\(0, current \+ Number\(beats \|\| 0\) \* sourceBeatSeconds\(deck\)\);\n)(    return mixer\.restartDeckAt\?\.\(deckId, target\) \?\? false;\n  \};)"
          text = must_sub(
              text,
              jog_pattern,
              r"\1    if (Number.isFinite(deck._transportFrozenAt)) {\n      deck._transportFrozenAt = target;\n      return true;\n    }\n\2",
              'jog frozen transport',
              re.S,
          )
          if 'deck._transportFrozenAt = null;' not in re.search(r"mixer\.stopDeck = .*?\n  \};", text, re.S).group(0):
              text = text.replace(
                  '      deck._jogBend = 0;\n',
                  '      deck._jogBend = 0;\n      deck._transportFrozenAt = null;\n',
                  1,
              )
          path.write_text(text)

          # LED wall: only mark a state broadcast once the send succeeds.
          path = Path('src/gameplay/LedWallSystem.js')
          text = path.read_text()
          publish_block = """    if (signature === this.lastBroadcastState) return;
            if (this.game.multiplayer?.joined) {
              if (world && !world.owns?.('led-wall-controller')) {
                this.ui.warning?.('Take control of the VISUALS desk before changing the shared LED wall.');
                return;
              }
              if (
                this.game.multiplayer.send({
                  type: 'object_update',
                  objectId: 'dj-led-wall',
                  data: snapshot,
                })
              )
                this.lastBroadcastState = signature;
            } else {
              if (world?.objects) world.objects.set('dj-led-wall', snapshot);
              this.lastBroadcastState = signature;
            }
          """
          text = must_sub(
              text,
              r"    if \(signature === this\.lastBroadcastState\) return;.*?\n  \}\n\n  drawGraphic",
              publish_block + "\n  }\n\n  drawGraphic",
              'LED publish block',
              re.S,
          )
          path.write_text(text)

          # Remote DJ clients must apply motor/platter and loop-off state to the actual audio engine.
          path = Path('src/multiplayer/SharedWorld.js')
          text = path.read_text()
          remote_block = """        if (target.deviceMode) dj.setDeviceMode?.(deckId, target.deviceMode);
                if (target.deviceMode === 'vinyl' && target.vinylRpm)
                  dj.setVinylRpm?.(deckId, target.vinylRpm);
                const targetMotorOn = target.motorOn !== false;
                if (typeof dj.toggleMotor === 'function' && deck.motorOn !== targetMotorOn)
                  dj.toggleMotor(deckId);
                else deck.motorOn = targetMotorOn;
                const targetHeld = target.platterHeld === true;
                if (typeof dj.setPlatterHeld === 'function' && deck.platterHeld !== targetHeld)
                  dj.setPlatterHeld(deckId, targetHeld);
                else deck.platterHeld = targetHeld;
                if (Array.isArray(target.cuePoints)) deck.cuePoints = target.cuePoints.slice(0, 8);
          """
          text = must_sub(
              text,
              r"        if \(target\.deviceMode\) dj\.setDeviceMode\?\.\(deckId, target\.deviceMode\);.*?        if \(Array\.isArray\(target\.cuePoints\)\) deck\.cuePoints = target\.cuePoints\.slice\(0, 8\);\n",
              remote_block,
              'remote turntable state',
              re.S,
          )
          loop_block = """          if (target.loopBeats)
                    (dj.setPreciseLoop ?? dj.setLoop).call(dj, deckId, target.loopBeats);
                  else if (deck.loopBeats) {
                    if (typeof dj.setPreciseLoop === 'function') dj.setPreciseLoop(deckId, 0);
                    else dj.setLoop(deckId, deck.loopBeats);
                  }
          """
          text = must_sub(
              text,
              r"          if \(target\.loopBeats\).*?          else if \(deck\.loopBeats\) dj\.setLoop\(deckId, deck\.loopBeats\);\n",
              loop_block,
              'remote loop release',
              re.S,
          )
          path.write_text(text)

          # Server-side LED ownership enforcement, not just a browser-side convention.
          path = Path('server/multiplayerServer.mjs')
          text = path.read_text()
          if "room.resources.get('led-wall-controller')" not in text:
              text = must_sub(
                  text,
                  r"(  const room = roomFor\(player\.roomId\);\n)(  const data =\s*objectId === 'dj-led-wall' \? sanitizeLedWall\(message\.data\) : sanitizeJson\(message\.data\);)",
                  r"\1  if (objectId === 'dj-led-wall') {\n    const controller = room.resources.get('led-wall-controller');\n    if (!controller || controller.ownerId !== player.id) return;\n  }\n  const data =\n    objectId === 'dj-led-wall' ? sanitizeLedWall(message.data) : sanitizeJson(message.data);",
                  'server LED ownership',
                  re.S,
              )
          path.write_text(text)
          PY

      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          src/main.js
          src/gameplay/DjPerformanceRealismSystem.js
          src/gameplay/LedWallSystem.js
          src/gameplay/StudioLoopEnhancements.js
          src/gameplay/PerformancePropSystem.js
          src/gameplay/installPerformanceRealismSystems.js
          src/gameplay/LiveBandSystem.js
          src/scenes/geometry/djBoothRealism.js
          src/scenes/geometry/belowBlockout.js
          src/world/levels.js
          src/interactions/createActions.js
          src/multiplayer/SharedWorld.js
          server/multiplayerServer.mjs
          src/ui/performanceRealism.css
          .github/workflows/iphone-preview.yml

      - name: Verify before publishing
        run: |
          pnpm test
          pnpm build
          pnpm exec prettier --check src server tests .github/workflows

      - name: Remove temporary one-shot workflows
        run: |
          rm -f .github/workflows/apply-performance-realism-geometry.yml
          rm -f .github/workflows/apply-performance-realism-integration.yml
          rm -f .github/workflows/fix-performance-realism-runtime.yml
          rm -f .github/workflows/finalize-performance-realism.yml

      - name: Commit final pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize performance realism pass"
          git push origin HEAD:feat/performance-realism-pass
