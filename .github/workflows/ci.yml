name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier diagnostic
        run: |
          pnpm exec prettier --write src/audio/AcousticZones.js src/audio/AudioEngine.js src/multiplayer/SharedMediaSync.js tests/acoustic-zones.test.js
          echo "::group::PRETTIER_DIFF"
          git diff -- src/audio/AcousticZones.js src/audio/AudioEngine.js src/multiplayer/SharedMediaSync.js tests/acoustic-zones.test.js
          echo "::endgroup::"

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting
        run: pnpm run format:check
