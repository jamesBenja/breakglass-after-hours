name: CI

on:
  pull_request:
  push:
    branches: [main, feat/multiplayer-phase-2-shared-world]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting
        run: |
          pnpm exec prettier --write src/interactions/createActions.js src/multiplayer/SharedMediaSync.js tests/shared-media-sync.test.js tests/spectra-recorder.test.js
          git diff -- src/interactions/createActions.js src/multiplayer/SharedMediaSync.js tests/shared-media-sync.test.js tests/spectra-recorder.test.js
