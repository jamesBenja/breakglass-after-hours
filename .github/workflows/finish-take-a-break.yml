name: Finish Take A Break pass

on:
  push:
    branches:
      - feat/take-a-break-immersive-fixes
    paths:
      - .github/workflows/finish-take-a-break.yml
      - scripts/finish-take-a-break.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/take-a-break-immersive-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update installation copy
        run: node scripts/finish-take-a-break.mjs
      - name: Format changed files
        run: pnpm exec prettier --write src/audio/SpatialAudioSystem.js src/gameplay/TakeABreakImmersiveSystem.js src/interactions/createActions.js tests/camera-room.test.js tests/take-a-break-immersive.test.js
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Formatting check
        run: pnpm run format:check
      - name: Remove temporary finalizer
        run: rm .github/workflows/finish-take-a-break.yml scripts/finish-take-a-break.mjs
      - name: Commit finalized pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Take A Break immersive pass"
          git push origin HEAD:feat/take-a-break-immersive-fixes
