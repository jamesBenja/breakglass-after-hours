name: Format Multiplayer Phase 2

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/format-multiplayer-phase2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 2 files
        run: >-
          pnpm exec prettier --write
          src/multiplayer/MultiplayerClient.js
          src/multiplayer/RemotePlayer.js
          src/multiplayer/SharedWorld.js
          src/multiplayer/RealtimeMedia.js
          src/multiplayer/emoteAnimations.js
          src/multiplayer/installMultiplayerEnhancements.js
          src/ui/multiplayer.css
          server/multiplayerServer.mjs
          tests/multiplayer-server.test.js
          .github/workflows/iphone-preview.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer src/ui/multiplayer.css server/multiplayerServer.mjs tests/multiplayer-server.test.js .github/workflows/iphone-preview.yml
          git commit -m "Format multiplayer Phase 2"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
