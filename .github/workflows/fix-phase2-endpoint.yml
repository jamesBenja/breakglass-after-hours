name: Fix Phase 2 Endpoint

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/fix-phase2-endpoint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - name: Point frontend and smoke to the authoritative live service
        run: |
          sed -i 's#multiplayer-phase2-production\.up\.railway\.app#multiplayer-phase2-live-production.up.railway.app#g' src/multiplayer/MultiplayerClient.js scripts/smoke-live-multiplayer.mjs .github/workflows/live-multiplayer-smoke.yml
      - name: Commit endpoint correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer/MultiplayerClient.js scripts/smoke-live-multiplayer.mjs .github/workflows/live-multiplayer-smoke.yml
          git commit -m "Use authoritative Phase 2 multiplayer service"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
