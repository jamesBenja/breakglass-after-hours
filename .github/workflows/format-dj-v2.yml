name: Temporary DJ V2 formatter

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/format-dj-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format DJ V2 files
        run: |
          pnpm exec prettier --write src/ui/djHardwareV2.js src/ui/djHardwareV2.css
          git diff -- src/ui/djHardwareV2.js src/ui/djHardwareV2.css

      - name: Commit formatting
        run: |
          if git diff --quiet -- src/ui/djHardwareV2.js src/ui/djHardwareV2.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/djHardwareV2.js src/ui/djHardwareV2.css
          git commit -m "Format DJ hardware V2"
          git push
