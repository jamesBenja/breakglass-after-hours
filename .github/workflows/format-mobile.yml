name: Format Mobile UI

on:
  push:
    branches:
      - feat/mobile-performance-dj-surface

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/ui/mobileMixerEnhancements.js
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-mobile-ui
          path: src/ui/mobileMixerEnhancements.js
