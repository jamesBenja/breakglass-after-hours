name: Live Multiplayer Smoke

# Keep this workflow tied to the same endpoint used by the Phase 2 browser preview.
on:
  push:
    branches:
      - feat/live-multiplayer-foundation
      - feat/multiplayer-phase-2-shared-world
    paths:
      - src/multiplayer/**
      - src/avatar/**
      - server/**
      - scripts/smoke-live-multiplayer.mjs
      - .github/workflows/live-multiplayer-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify production WebSocket room
        env:
          MULTIPLAYER_URL: wss://multiplayer-phase2-webrtc-production.up.railway.app
        run: node scripts/smoke-live-multiplayer.mjs
      - name: Verify shared DJ upload endpoint
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL('https://multiplayer-phase2-webrtc-production.up.railway.app/dj-upload');
          endpoint.searchParams.set('room', 'breakglass-main');
          endpoint.searchParams.set('player', 'smoke-no-player');
          endpoint.searchParams.set('token', 'smoke-no-token');
          endpoint.searchParams.set('filename', 'smoke.mp3');
          endpoint.searchParams.set('bpm', '120');
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'audio/mpeg' },
            body: new Uint8Array([0x49, 0x44, 0x33]),
          });
          const body = await response.json();
          if (response.status !== 401 || body?.error !== 'Upload authorization expired.') {
            throw new Error(`Unexpected shared DJ upload response: ${response.status} ${JSON.stringify(body)}`);
          }
          console.log('Shared DJ upload endpoint is live and enforcing room authorization.');
          NODE
