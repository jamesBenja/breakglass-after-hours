name: Format feature branch

on:
  push:
    branches: [feat/club-lighting-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/club-lighting-foundation

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: pnpm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests index.html vite.config.js
          git commit -m "Format feature changes"
          git push origin HEAD:feat/club-lighting-foundation
