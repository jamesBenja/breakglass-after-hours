name: Temp Prettier Vocal

on:
  push:
    branches:
      - fix/spectra-multiplayer-vocal-multitrack

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/multiplayer/VocalSync.js
      - run: git diff -- src/multiplayer/VocalSync.js
