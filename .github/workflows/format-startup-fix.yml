name: Format Startup Fix

on:
  push:
    branches:
      - feat/mobile-performance-dj-surface

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-performance-dj-surface
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format startup fix files
        run: >-
          pnpm exec prettier --write
          src/gameplay/HouseDjSystem.js
          src/world/upstairs/definition.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameplay/HouseDjSystem.js src/world/upstairs/definition.js
          git commit -m "Format startup regression fix"
          git push origin HEAD:feat/mobile-performance-dj-surface
