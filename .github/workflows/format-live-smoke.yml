name: Format Live Smoke

on:
  push:
    branches:
      - feat/live-multiplayer-foundation
    paths:
      - .github/workflows/format-live-smoke.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-multiplayer-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/smoke-live-multiplayer.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-live-multiplayer.mjs
          git commit -m "Format live multiplayer smoke test with Prettier"
          git push origin HEAD:feat/live-multiplayer-foundation
