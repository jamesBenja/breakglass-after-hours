name: Hydrate Breakglass Audio

on:
  push:
    branches:
      - feat/dynamic-below-avatar-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydrate-breakglass-audio
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-below-avatar-foundation

      - name: Install downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download and encode public playback copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            public/assets/audio/catalog/in-flux \
            public/assets/audio/catalog/jashim \
            public/assets/audio/catalog/boogaloo \
            public/assets/audio/dance-shoes \
            /tmp/breakglass-audio

          fetch() {
            local id="$1"
            local out="$2"
            echo "Downloading $(basename "$out")"
            gdown --quiet --id "$id" -O "$out"
            test -s "$out"
          }

          wav_to_mp3() {
            local id="$1"
            local out="$2"
            local tmp="/tmp/breakglass-audio/$(basename "${out%.mp3}").wav"
            fetch "$id" "$tmp"
            echo "Encoding $(basename "$out")"
            ffmpeg -nostdin -hide_banner -loglevel error -y \
              -i "$tmp" -map_metadata -1 -vn -c:a libmp3lame -b:a 192k -ar 48000 "$out"
            rm -f "$tmp"
          }

          # Existing public MP3 masters: preserve the source playback copies without another lossy encode.
          fetch 1JLUgk49QDfwX2kZ16T9v6j38IXFnMsFo public/assets/audio/catalog/got-you-dancin.mp3
          fetch 1P6t7zj4l3KICvNLvzPcpwWZ1qADLQWsV public/assets/audio/catalog/in-flux/just-be.mp3
          fetch 1bO-uNngeBgXN0Ds-AyqXeUIId2siPsoX public/assets/audio/catalog/in-flux/breath.mp3
          fetch 18JxuPqiODFjoE5pO7hNzb4lEXpToPiIH public/assets/audio/catalog/in-flux/break.mp3
          fetch 18Shfdoc0NRJTEyMkVr8BENQTsUdi_wdx public/assets/audio/catalog/in-flux/gingele.mp3

          fetch 1QGGdLdIzWeJ2q9eoJP5HcVZXssOskdJ8 public/assets/audio/catalog/boogaloo/dubki.mp3
          fetch 1gjN65vQbQczjJt04RzWUyGIsG9TLwBXh public/assets/audio/catalog/boogaloo/paharpur.mp3
          fetch 1fX_FjToZ7Ew04W0LIVAvWRSUbDy2eLdw public/assets/audio/catalog/boogaloo/fakir.mp3
          fetch 1MyvYGVPBFlmm2_5R-BzjCKoLX0uKUezk public/assets/audio/catalog/boogaloo/bhab.mp3

          # WAV-only archive material: make browser-friendly public playback copies.
          wav_to_mp3 1dQcdZ0XQC1-u2sRyMqySBObNrzpHEdgX public/assets/audio/catalog/jashim/atrakar.mp3
          wav_to_mp3 1VDLzuchjwNIX1g0Qm9e-zYSIJPgCnEa7 public/assets/audio/catalog/jashim/atrakar-instrumental.mp3
          wav_to_mp3 1pBtrR15nn7Okk4qRyzVaKEAKSWCS_5uR public/assets/audio/catalog/jashim/atrakar-vocal.mp3

          wav_to_mp3 19sjrt3914VeGuOH___ys9DYJT_x7cpWU public/assets/audio/dance-shoes/drums.mp3
          wav_to_mp3 1MU0KJOYGlpXXEyWSPyXjZC63z6rnSLYQ public/assets/audio/dance-shoes/bass.mp3
          wav_to_mp3 1bAJjCl8JX_Lo52_z1_GnaiAJfe7IayU- public/assets/audio/dance-shoes/synths-fx.mp3
          wav_to_mp3 1snVDkF49BR6HXkFwb1Sjbd6gnb6RR7qz public/assets/audio/dance-shoes/vox.mp3

      - name: Verify runtime media
        run: node scripts/verify-media.mjs

      - name: Commit playback assets and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hydrate-breakglass-audio.yml
          git add public/assets/audio
          git commit -m "Deploy Breakglass audio catalogue"
          git push origin HEAD:feat/dynamic-below-avatar-foundation
