name: Apply Performance Realism Geometry

on:
  push:
    branches:
      - feat/performance-realism-pass
    paths:
      - .github/workflows/apply-performance-realism-geometry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-realism-pass
      - name: Replace prototype DJ booth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scenes/geometry/belowBlockout.js')
          text = path.read_text()
          imp = "import { createPrimitives } from './primitives.js';\n"
          if "./djBoothRealism.js" not in text:
              text = text.replace(imp, imp + "import { buildRealisticDjBooth } from './djBoothRealism.js';\n")
          start_marker = "  box(downScene, 3.7, 0.16, 1.75, mat(0x2d2725), 1.5, 0.08, -2.42);"
          end_marker = "  const ring = new Mesh("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'prototype booth markers not found: start={start} end={end}')
          text = text[:start] + "  buildRealisticDjBooth(downScene);\n\n" + text[end:]
          path.write_text(text)
          PY
      - name: Commit geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/geometry/belowBlockout.js
          git diff --cached --quiet && exit 0
          git commit -m "Replace prototype booth with hybrid DJ rig"
          git push origin HEAD:feat/performance-realism-pass
