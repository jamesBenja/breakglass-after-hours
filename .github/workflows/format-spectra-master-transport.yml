name: Format Spectra master transport

on:
  push:
    branches: [feat/spectra-master-transport]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format Spectra master transport'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-master-transport
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            src/gameplay/ModularSynthSystem.js \
            src/gameplay/StudioLoopEnhancements.js \
            src/studio/KeyboardPerformance.js \
            src/studio/SpectraTransport.js \
            src/studio/StudioExporter.js \
            src/studio/StudioPlayback.js \
            tests/spectra-recorder.test.js
          git rm .github/workflows/format-spectra-master-transport.yml
          git config user.name "breakglass-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/gameplay/ModularSynthSystem.js src/gameplay/StudioLoopEnhancements.js src/studio/KeyboardPerformance.js src/studio/SpectraTransport.js src/studio/StudioExporter.js src/studio/StudioPlayback.js tests/spectra-recorder.test.js
          git commit -m "Format Spectra master transport"
          git push origin HEAD:feat/spectra-master-transport
