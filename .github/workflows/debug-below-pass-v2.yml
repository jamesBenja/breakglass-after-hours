name: Debug Below Pass V2

on:
  push:
    branches:
      - feat/below-alley-world-systems
    paths:
      - .github/workflows/debug-below-pass-v2.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/below-alley-world-systems
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Diagnose pass and tests
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import traceback

          out = []

          def execute_block(path, marker, next_marker):
              workflow = Path(path).read_text()
              section = workflow.index(marker)
              start = workflow.index('        run: |\n', section) + len('        run: |\n')
              end = workflow.index(next_marker, start)
              block = workflow[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
              exec(compile(script, f'{path}:{marker}', 'exec'))

          try:
              execute_block(
                  '.github/workflows/apply-scoreboard-song-pass.yml',
                  '      - name: Apply stats, scoreboard, song playback and upstairs espresso pass',
                  '\n      - name: Format changed files',
              )
              out.append('scoreboard apply: OK')
          except Exception:
              out.append('scoreboard apply: FAILED\n' + traceback.format_exc())

          try:
              execute_block(
                  '.github/workflows/apply-below-alley-world-pass.yml',
                  '      - name: Apply Below layout, circulation, storage and alley life pass',
                  '\n      - name: Format changed files',
              )
              out.append('below/alley apply: OK')
          except Exception:
              out.append('below/alley apply: FAILED\n' + traceback.format_exc())

          result = subprocess.run(['pnpm', 'test'], text=True, capture_output=True)
          out.append(f'pnpm test exit: {result.returncode}\nSTDOUT:\n{result.stdout}\nSTDERR:\n{result.stderr}')
          Path('debug-v2-output.txt').write_text('\n\n'.join(out))
      - name: Publish diagnostic output
        run: |
          git config user.name "jamesBenja"
          git config user.email "70452184+jamesBenja@users.noreply.github.com"
          git add debug-v2-output.txt
          git commit -m "Capture detailed Below pass diagnostics"
          git push origin HEAD:feat/below-alley-world-systems
