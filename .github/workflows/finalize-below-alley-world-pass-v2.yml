name: Finalize Below Alley World Pass V2

on:
  push:
    branches:
      - feat/below-alley-world-systems
    paths:
      - .github/workflows/finalize-below-alley-world-pass-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/below-alley-world-systems
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Reapply finalized world pass and update expanded-lounge regression
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/finalize-below-alley-world-pass.yml').read_text()
          marker = '      - name: Apply complete world pass from prepared workflows'
          section = workflow.index(marker)
          start = workflow.index('        run: |\n', section) + len('        run: |\n')
          end = workflow.index('\n      - name: Format complete pass', start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          scope = {'__builtins__': __builtins__, 'Path': Path, 're': re}
          exec(compile(script, 'finalize-pass-v1.py', 'exec'), scope, scope)

          p = Path('tests/camera-room.test.js')
          text = p.read_text()
          old = '  assert.equal(TAKE_A_BREAK_SEATS.length, 3);\n'
          new = "  assert.ok(TAKE_A_BREAK_SEATS.length >= 5, 'expanded Take A Break exposes additional real seating');\n"
          if old not in text:
              raise SystemExit('Expected legacy Take A Break seat-count assertion not found')
          p.write_text(text.replace(old, new, 1))

      - name: Format complete pass
        run: >-
          pnpm exec prettier --write
          src/state/GameState.js
          src/studio/StudioSession.js
          src/gameplay/StudioLoopEnhancements.js
          src/gameplay/GameStatsSystem.js
          src/gameplay/BelowAlleyWorldSystem.js
          src/world/levels.js
          src/world/alley.js
          src/scenes/geometry/belowBlockout.js
          src/scenes/geometry/alleyBlockout.js
          src/scenes/geometry/roomFurniture.js
          src/photos/PhotoSystem.js
          src/npcs/NpcSystem.js
          src/npcs/dialogues.js
          src/gameplay/PartyLifePhotoSystem.js
          src/gameplay/roomExperienceEnhancements.js
          src/gameplay/BarServiceSystem.js
          src/world/upstairs/definition.js
          src/scenes/geometry/upstairsFixtures.js
          src/gameplay/HouseDjSystem.js
          src/main.js
          tests/bar-service.test.js
          tests/camera-room.test.js
          tests/scoreboard-song.test.js
          tests/below-alley-world.test.js

      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Formatting check
        run: pnpm run format:check

      - name: Commit verified pass and remove one-shot machinery
        run: |
          rm -f .github/workflows/apply-scoreboard-song-pass.yml
          rm -f .github/workflows/apply-below-alley-world-pass.yml
          rm -f .github/workflows/debug-below-pass.yml
          rm -f .github/workflows/debug-below-pass-v2.yml
          rm -f .github/workflows/debug-below-pass-v3.yml
          rm -f .github/workflows/finalize-below-alley-world-pass.yml
          rm -f .github/workflows/finalize-below-alley-world-pass-v2.yml
          rm -f notes/below-alley-world-systems-plan.md notes/scoreboard-spec.md notes/.keep-below-pass notes/placeholder.tmp
          rm -f debug-test-output.txt debug-test-status.txt debug-v2-output.txt debug-v3-output.txt
          rmdir notes 2>/dev/null || true
          git config user.name "jamesBenja"
          git config user.email "70452184+jamesBenja@users.noreply.github.com"
          git add -A
          git commit -m "Build Below world systems, scoreboard and alley life"
          git push origin HEAD:feat/below-alley-world-systems
