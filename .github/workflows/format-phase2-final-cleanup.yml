name: Format Phase 2 Final Cleanup

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/format-phase2-final-cleanup.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          src/multiplayer/InstrumentSync.js
          src/multiplayer/MultiplayerClient.js
          scripts/smoke-live-multiplayer.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer/InstrumentSync.js src/multiplayer/MultiplayerClient.js scripts/smoke-live-multiplayer.mjs
          git commit -m "Format final Phase 2 multiplayer files"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
