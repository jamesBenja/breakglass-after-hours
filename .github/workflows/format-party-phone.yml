name: Format party phone

on:
  push:
    branches:
      - feat/party-phone-private-calls
    paths:
      - .github/workflows/format-party-phone.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/party-phone-private-calls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/multiplayer/PartyPhone.js tests/party-phone.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer/PartyPhone.js tests/party-phone.test.js
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Format party phone files"
            git push origin HEAD:feat/party-phone-private-calls
          fi
