name: Format Spectra spatial mixer

on:
  push:
    branches: [feat/spectra-spatial-mixer]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format Spectra spatial mixer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-spatial-mixer
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            src/audio/SpatialAudioSystem.js \
            src/core/Game.js \
            src/gameplay/StudioLoopEnhancements.js \
            src/scenes/geometry/upstairsFixtures.js \
            src/state/GameState.js \
            src/studio/SpectraSpatialLayout.js \
            src/studio/SpectraSpatialMixer.js \
            src/studio/StudioExporter.js \
            src/studio/StudioPlayback.js \
            src/studio/StudioSession.js \
            src/ui/musicEnhancements.css \
            src/world/upstairs/gameSpace.js \
            tests/spectra-spatial-mixer.test.js
          git rm .github/workflows/format-spectra-spatial-mixer.yml
          git config user.name "breakglass-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "Format Spectra spatial mixer"
          git push origin HEAD:feat/spectra-spatial-mixer
