name: Guided progression + Spectra mixing architecture

on:
  push:
    branches:
      - feat/guided-progression-mixing-game
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guided-progression-mixing-architecture
  cancel-in-progress: true

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/guided-progression-mixing-game
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply gameplay architecture patch
        run: node scripts/apply-guided-progression-mixing.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write src tests docs server index.html vite.config.js

      - name: Unit tests
        run: pnpm test

      - name: Verify packaged media
        run: pnpm run media:check

      - name: Production build
        run: pnpm build

      - name: Production multiplayer smoke
        env:
          MULTIPLAYER_URL: wss://multiplayer-phase2-webrtc-production.up.railway.app
        run: node scripts/smoke-live-multiplayer.mjs

      - name: Formatting check
        run: pnpm run format:check

      - name: Verify progression hooks
        run: |
          grep -q "Tell me about the studio tape archives" src/interactions/createActions.js
          grep -q "Which amps should I pair with which guitars" src/interactions/createActions.js
          grep -q "Spectra mix challenge" src/interactions/createActions.js
          grep -q "createWorldNameplate" src/npcs/NpcSystem.js
          grep -q "alleyShortcutUnlocked" src/world/alley.js

      - name: Commit verified architecture and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/guided-progression-mixing.yml scripts/apply-guided-progression-mixing.mjs
          git add -A
          git commit -m "Add guided studio progression and Spectra mixing game"
          git push origin HEAD:feat/guided-progression-mixing-game
