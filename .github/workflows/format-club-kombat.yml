name: Format club Kombat

on:
  push:
    branches:
      - feat/club-rig-devin-kombat-roster

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/club-rig-devin-kombat-roster
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/arcade/UndergroundKombat.js src/core/Game.js src/scenes/geometry/belowBlockout.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arcade/UndergroundKombat.js src/core/Game.js src/scenes/geometry/belowBlockout.js
          git diff --cached --quiet && exit 0
          git commit -m "Format club Kombat pass"
          git push origin HEAD:feat/club-rig-devin-kombat-roster
