name: One-shot format multi Vocal test

on:
  push:
    branches:
      - fix/multi-vocal-resume-and-editor-navigation
    paths:
      - .github/workflows/one-shot-format-multi-vocal.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/multi-vocal-resume-and-editor-navigation

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format multi Vocal regression test
        run: pnpm exec prettier --write tests/spectra-vocal-input.test.js

      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-format-multi-vocal.yml

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/spectra-vocal-input.test.js .github/workflows/one-shot-format-multi-vocal.yml
          git commit -m "Apply canonical formatting to multi Vocal tests"
          git push origin HEAD:fix/multi-vocal-resume-and-editor-navigation
