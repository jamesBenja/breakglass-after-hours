name: Format Alley

on:
  push:
    branches:
      - feat/dynamic-below-avatar-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-below-avatar-foundation

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format alley system
        run: pnpm exec prettier --write src/alley/AlleySystem.js

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alley/AlleySystem.js
          git commit -m "Format alley police system"
          git push origin HEAD:feat/dynamic-below-avatar-foundation
