name: One-shot format Vocal route resync

on:
  push:
    branches:
      - fix/vocal-ios-route-resync
    paths:
      - .github/workflows/one-shot-format-vocal-route-resync.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/vocal-ios-route-resync

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Vocal route resync files
        run: pnpm exec prettier --write src/studio/StudioPlayback.js tests/spectra-fader-routing.test.js tests/spectra-vocal-input.test.js

      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-format-vocal-route-resync.yml

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/StudioPlayback.js tests/spectra-fader-routing.test.js tests/spectra-vocal-input.test.js .github/workflows/one-shot-format-vocal-route-resync.yml
          git commit -m "Apply canonical formatting to Vocal route resync"
          git push origin HEAD:fix/vocal-ios-route-resync
