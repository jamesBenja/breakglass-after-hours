name: Format DJ lesson

on:
  push:
    branches: [feat/dj-lesson-crowd-training]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dj-lesson-crowd-training

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format new DJ lesson files
        run: pnpm exec prettier --write src/gameplay/DjLessonSystem.js tests/dj-lesson.test.js

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameplay/DjLessonSystem.js tests/dj-lesson.test.js
          git commit -m "Format DJ lesson files [skip format]"
          git push origin HEAD:feat/dj-lesson-crowd-training
