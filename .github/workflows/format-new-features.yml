name: Format New Gameplay Features

on:
  push:
    branches:
      - feat/dynamic-below-avatar-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-below-avatar-foundation

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix runtime UI scope and format feature files
        run: |
          sed -i 's/^        ui\.warning(/        this.ui.warning(/' src/core/Game.js
          pnpm exec prettier --write \
            src/arcade/UndergroundFight.js \
            src/arcade/UndergroundKombat.js \
            src/ui/arcade.css \
            src/pets/CompanionMaddoxSystem.js \
            src/core/Game.js \
            src/scenes/createLevel.js \
            src/scenes/BelowScene.js \
            src/world/roof.js \
            src/gameplay/MaddoxInteractionSystem.js \
            src/state/GameState.js \
            tests/arcade.test.js \
            tests/maddox-companion.test.js

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Format new gameplay features"
          git push origin HEAD:feat/dynamic-below-avatar-foundation
