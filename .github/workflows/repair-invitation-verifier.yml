name: Repair invitation verifier

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-invitation-verifier.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Apply verifier patch
        run: python scripts/patch_invite_fingerprint_verifier.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: node --check server/multiplayerServer.mjs && node --check server/inviteTokenFingerprints.js
      - name: Verify fingerprint mapping
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { invitationTypeFromFingerprint } from './server/inviteTokenFingerprints.js';
          const expected = new Map([
            ['eVF9fupBKuVctoYcXEY39dun1Oszpm8jQWu3Z2nINas', 'participant'],
            ['RpHtfLbCcfYQVfz_K6slXKFZFtYqQxvvGehBX5ZNQBQ', 'guestlist'],
            ['_xlUebO_rwl_hhxkGnin26E5hW3TLwQR4YRCKNYvtGE', 'dj'],
            ['IhURLSmcagjxV0fi0s8PW7aTd-UHZ3vqD02N5Y_jIr0', 'producer'],
            ['KRzqgj227VQZW1SRrMLABqdLs8dsZu4DaZmKHBN7hfs', 'promoter'],
          ]);
          for (const [token, type] of expected) {
            if (invitationTypeFromFingerprint(token, crypto) !== type) process.exit(1);
          }
          if (invitationTypeFromFingerprint('forged-token', crypto) !== null) process.exit(1);
          NODE
      - name: Production build
        run: pnpm build
      - name: Commit repaired verifier
        run: |
          rm .github/workflows/repair-invitation-verifier.yml scripts/patch_invite_fingerprint_verifier.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair invitation role verification"
          git push origin HEAD:main
