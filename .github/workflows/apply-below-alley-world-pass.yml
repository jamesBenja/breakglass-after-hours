              """  installGameStatsEnhancements(game, ui);\n  installAudioReliabilityEnhancements(game, ui);\n""",
              """  installGameStatsEnhancements(game, ui);\n  installBelowAlleyWorldSystem(game, ui);\n  installAudioReliabilityEnhancements(game, ui);\n""",
