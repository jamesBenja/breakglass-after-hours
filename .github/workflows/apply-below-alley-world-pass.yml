name: Apply Below Alley World Pass

on:
  push:
    branches:
      - feat/below-alley-world-systems
    paths:
      - .github/workflows/apply-below-alley-world-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/below-alley-world-systems
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Apply inherited scoreboard, song-library and espresso pass
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-scoreboard-song-pass.yml').read_text()
          marker = '      - name: Apply stats, scoreboard, song playback and upstairs espresso pass'
          section = workflow.index(marker)
          start = workflow.index('        run: |\n', section) + len('        run: |\n')
          end = workflow.index('\n      - name: Format changed files', start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'apply-scoreboard-song-pass.py', 'exec'))

      - name: Apply Below layout, circulation, storage and alley life pass
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, count))

          def replace_regex(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text()
              updated, hits = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if hits != count:
                  raise SystemExit(f'Expected {count} regex match(es) in {path}, got {hits}: {pattern[:120]!r}')
              p.write_text(updated)

          # Persist David/storage progression and Beaver-food counters.
          patch(
              'src/state/GameState.js',
              """  'devin',\n  'bouncer',\n];\n""",
              """  'devin',\n  'david',\n  'beaver',\n  'bouncer',\n];\n""",
          )
          patch(
              'src/state/GameState.js',
              """  studioAccessGranted: false,\n  houseDjDeskIntroduced: false,\n  maddoxCompanion: false,\n""",
              """  studioAccessGranted: false,\n  houseDjDeskIntroduced: false,\n  storageAccessGranted: false,\n  hotDogsEaten: 0,\n  tacosEaten: 0,\n  maddoxCompanion: false,\n""",
          )
          patch(
              'src/state/GameState.js',
              """  state.studioAccessGranted = value.studioAccessGranted === true;\n  state.houseDjDeskIntroduced = value.houseDjDeskIntroduced === true;\n  state.maddoxCompanion = state.roofSecretUnlocked && value.maddoxCompanion === true;\n""",
              """  state.studioAccessGranted = value.studioAccessGranted === true;\n  state.houseDjDeskIntroduced = value.houseDjDeskIntroduced === true;\n  state.storageAccessGranted = value.storageAccessGranted === true;\n  state.hotDogsEaten = Math.max(0, Math.min(999, Math.floor(Number(value.hotDogsEaten) || 0)));\n  state.tacosEaten = Math.max(0, Math.min(999, Math.floor(Number(value.tacosEaten) || 0)));\n  state.maddoxCompanion = state.roofSecretUnlocked && value.maddoxCompanion === true;\n""",
          )

          # Correct Below circulation and room assignments.
          patch(
              'src/world/levels.js',
              """      stairs: [-6.55, 0.78, -2.95],\n      alley: [4.6, 0.64, -5.0],\n""",
              """      stairs: [-6.55, 0.78, -2.95],\n      alley: [-6.55, 0, -0.55],\n""",
          )
          patch(
              'src/world/levels.js',
              """        { x1: 6.35, x2: 8.55, z1: 3.35, z2: 4.05, weight: 1.7, kind: 'social' },\n""",
              """        { x1: 6.35, x2: 8.55, z1: 1.05, z2: 5.9, weight: 1.7, kind: 'social' },\n""",
          )
          patch(
              'src/world/levels.js',
              """        surface('storage', 'Storage', -5, 1.8, 3.35, 6.2),\n        surface('lounge', 'Take A Break', 6.2, 8.8, 2.8, 6.15),\n        surface('lounge-door', 'Take A Break Doorway', 5.65, 6.5, 1.35, 2.8),\n        surface('east-service', 'Production / Service', 6.2, 8.8, -2.7, 2.8),\n        surface('coat-check', 'Coat Check / Alley Entry', 3.55, 5.65, -5.35, -3.2),\n        rampSurface('alley-stairs', 'Stairs to alley', 3.82, 5.38, -5.2, -3.4, 0.72, 0),\n""",
              """        surface('storage', 'Storage', -5, 1.8, 3.35, 6.2),\n        surface('lounge', 'Take A Break', 6.2, 8.8, 0.8, 6.15),\n        surface('lounge-door', 'Take A Break Doorway', 5.65, 6.5, 1.35, 2.8),\n        surface('east-service', 'Nora Photo Room / Production', 6.2, 8.8, -2.7, 0.8),\n        surface('coat-check', 'Clark Emergency Exit', 3.55, 5.65, -5.35, -3.2),\n        rampSurface('clark-emergency-stairs', 'Clark emergency exit stair', 3.82, 5.38, -5.2, -3.4, 0.72, 0),\n""",
          )
          patch(
              'src/world/levels.js',
              """        cameraWall('cam-club-east-north', 5.97, 6.23, -3.62, -2.1),\n        cameraWall('cam-club-east-mid', 5.97, 6.23, -0.62, 1.35),\n        cameraWall('cam-club-east-south', 5.97, 6.23, 2.8, 3.62),\n""",
              """        cameraWall('cam-club-east-lower', 5.97, 6.23, -3.62, 1.35),\n        cameraWall('cam-club-east-south', 5.97, 6.23, 2.8, 3.62),\n        {\n          id: 'east-service-wall',\n          x1: 5.95,\n          x2: 6.25,\n          z1: -3.62,\n          z2: 1.35,\n          y1: 0,\n          y2: 3.2,\n          camera: false,\n        },\n        {\n          id: 'storage-secret-boundary',\n          x1: -5.2,\n          x2: 2.0,\n          z1: 3.22,\n          z2: 3.6,\n          y1: 0,\n          y2: 3.2,\n          camera: false,\n        },\n""",
          )
          patch(
              'src/world/levels.js',
              """      alleyExit: {\n        ...anchor('Stairs to alley / club entrance', [4.6, 0.64, -5.0], 1.3, 'travel'),\n        target: 'alley@clubDoor',\n      },\n""",
              """      alleyExit: {\n        ...anchor('Alley stairs · down from the studio stair core', [-6.55, 0, -0.55], 1.35, 'travel'),\n        target: 'alley@clubDoor',\n      },\n      clarkEmergencyExit: anchor(\n        'Clark emergency exit',\n        [4.6, 0.64, -5.0],\n        1.3,\n        'clarkEmergencyExit',\n      ),\n""",
          )
          patch(
              'src/world/levels.js',
              """      photoWall: anchor('Nora photo wall', [-8.15, 0, 3.0], 1.6, 'photoWall'),\n""",
              """      photoWall: anchor('Nora photo wall', [8.35, 0, -1.05], 1.7, 'photoWall'),\n      storagePassage: anchor(\n        'Overstuffed furniture panel',\n        [-2.15, 0, 3.03],\n        1.45,\n        'storagePassage',\n      ),\n      storageExit: anchor(\n        'Back through the furniture wall',\n        [-2.15, 0, 3.78],\n        1.35,\n        'storageExit',\n      ),\n""",
          )
          patch(
              'src/world/levels.js',
              """      { id: 'jashim', name: 'Jashim', anchor: 'jashim', role: 'artist', color: 0x60728f },\n""",
              """      {\n        id: 'david',\n        name: 'David',\n        position: [-3.55, 0, 2.55],\n        role: 'furniture-dealer',\n        color: 0x725a48,\n        rotationY: Math.PI,\n      },\n      { id: 'jashim', name: 'Jashim', anchor: 'jashim', role: 'artist', color: 0x60728f },\n""",
          )

          # Visually seal the leftover east-side ghost doorway, expand Take A Break, move the photo area,
          # turn the old alley stair into the Clark emergency exit and make the west stair a shared core.
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  // East wall gets a dedicated opening into Take A Break while preserving the service opening.\n  wall(6.1, -2.825, 0.24, 1.35);\n  wall(6.1, 0.4, 0.24, 1.9);\n  wall(6.1, 3.15, 0.24, 0.7);\n  doorwayFrame(downScene, 5.98, 2.05, 'vertical', 'TAKE A BREAK');\n""",
              """  // East wall now has one intentional club opening: the doorway into Take A Break.\n  // The old lower service opening was the confusing invisible/ghost door and is sealed.\n  wall(6.1, -1.075, 0.24, 4.85);\n  wall(6.1, 3.15, 0.24, 0.7);\n  doorwayFrame(downScene, 5.98, 2.05, 'vertical', 'TAKE A BREAK');\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  // East side: Take A Break sits above the remaining production/service strip.\n  floor(downScene, 7.65, 4.8, 2.8, 3.2, mat(0x5e4331));\n  floor(downScene, 7.65, 1.5, 2.8, 2.6, serviceFloor);\n  floor(downScene, 7.65, -1.4, 2.8, 3.0, serviceFloor);\n  wall(9.05, 1.7, 0.24, 9.4);\n  wall(7.65, 6.4, 2.8, 0.24);\n  wall(7.65, -2.9, 2.8, 0.24);\n  box(downScene, 0.95, 0.035, 1.28, mat(0xc58a66), 6.08, 0.018, 2.05);\n  label(downScene, 'TAKE A BREAK', 7.65, 2.55, 4.8, 0.32);\n  label(downScene, 'PRODUCTION', 7.65, 2.55, 1.5, 0.3);\n  label(downScene, 'SERVICE', 7.65, 2.55, -1.4, 0.32);\n""",
              """  // East side: Take A Break now occupies most of the room entered directly from the club.\n  // The smaller room beside it becomes Nora's photo / production room and keeps the wall space.\n  floor(downScene, 7.65, 3.6, 2.8, 5.6, mat(0x5e4331));\n  floor(downScene, 7.65, -1.05, 2.8, 3.7, serviceFloor);\n  wall(9.05, 1.7, 0.24, 9.4);\n  wall(7.65, 6.4, 2.8, 0.24);\n  wall(7.65, -2.9, 2.8, 0.24);\n  // Divider between Take A Break and the photo room, with a real internal doorway at the west edge.\n  wall(8.25, 0.8, 1.6, 0.24);\n  doorwayFrame(downScene, 6.72, 0.8, 'horizontal', 'PHOTO ROOM');\n  box(downScene, 0.95, 0.035, 1.28, mat(0xc58a66), 6.08, 0.018, 2.05);\n  label(downScene, 'TAKE A BREAK', 7.65, 2.55, 3.9, 0.32);\n  label(downScene, 'NORA PHOTO ROOM', 7.65, 2.55, -1.05, 0.27);\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  doorwayFrame(downScene, 4.6, -3.38, 'horizontal', 'ALLEY / COAT CHECK');\n""",
              """  doorwayFrame(downScene, 4.6, -3.38, 'horizontal', 'CLARK EMERGENCY');\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  label(downScene, 'COAT CHECK', 4.6, 2.2, -4.0, 0.31);\n  label(downScene, 'ALLEY / EXIT ↑', 4.6, 2.85, -5.34, 0.36, '#ffd7ad');\n""",
              """  label(downScene, 'COAT CHECK', 4.6, 2.2, -4.0, 0.31);\n  label(downScene, 'EMERGENCY EXIT · CLARK', 4.6, 2.85, -5.34, 0.31, '#ffd7ad');\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  doorwayFrame(downScene, -6.55, -3.45, 'horizontal', 'UPSTAIRS / STUDIO');\n""",
              """  doorwayFrame(downScene, -6.55, -3.45, 'horizontal', 'STUDIO ↑ · ALLEY ↓');\n""",
          )

          # Add storage clutter, a disguised furniture-wall passage, and a permanent Zander label.
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  // Take A Break installation/chill room. Detailed couches and loose cushions are built by\n""",
              """  // Zander is a progression key, so his name stays visible even before the player walks into\n  // the normal interaction radius.\n  label(downScene, 'ZANDER', -5.42, 2.42, -1.42, 0.32, '#d9ffe9');\n\n  // David's storage room is intentionally dense: old furniture, paintings and studio overflow.\n  // The club-facing opening looks like a wall of furniture until David explains the passage.\n  const storageWood = mat(0x5a4030, 0.9, 0.02);\n  const storageFabric = mat(0x57464e, 0.96, 0.01);\n  const storageGold = mat(0xa68445, 0.66, 0.05);\n  const storageDark = mat(0x242326, 0.92, 0.02);\n  for (const [x, z, w, d, h] of [\n    [-4.25, 5.72, 1.25, 0.58, 0.72],\n    [-2.65, 5.55, 1.65, 0.68, 0.78],\n    [-0.55, 5.82, 1.35, 0.62, 0.74],\n    [0.95, 5.4, 1.0, 0.55, 0.68],\n    [-4.35, 4.3, 0.82, 0.82, 0.56],\n    [0.72, 4.22, 0.9, 0.74, 0.62],\n  ]) box(downScene, w, h, d, storageFabric, x, h / 2, z);\n  for (const [x, z, w, d] of [\n    [-3.65, 4.82, 1.15, 0.55],\n    [-1.72, 5.0, 1.35, 0.62],\n    [0.15, 4.75, 1.05, 0.5],\n  ]) {\n    box(downScene, w, 0.12, d, storageWood, x, 0.72, z);\n    for (const dx of [-w * 0.38, w * 0.38])\n      for (const dz of [-d * 0.32, d * 0.32])\n        box(downScene, 0.07, 0.68, 0.07, storageDark, x + dx, 0.34, z + dz);\n  }\n  for (const [x, z, r] of [\n    [-4.5, 3.95, -0.25],\n    [-3.7, 4.08, 0.18],\n    [-0.9, 4.0, -0.15],\n    [0.15, 4.05, 0.24],\n  ]) {\n    const seat = box(downScene, 0.52, 0.12, 0.52, storageWood, x, 0.52, z);\n    seat.rotation.y = r;\n    box(downScene, 0.52, 0.75, 0.12, storageWood, x, 0.88, z + 0.22).rotation.y = r;\n  }\n  for (const [x, y, z, w, h, color] of [\n    [-4.82, 1.85, 5.2, 0.78, 1.0, 0x8c463e],\n    [-2.2, 2.0, 6.15, 1.1, 0.72, 0x4f7390],\n    [0.9, 1.78, 6.12, 0.82, 1.08, 0x756646],\n    [1.55, 1.55, 4.9, 0.64, 0.8, 0x765376],\n  ]) {\n    box(downScene, w + 0.12, h + 0.12, 0.08, storageGold, x, y, z);\n    box(downScene, w, h, 0.045, mat(color, 0.84, 0.02), x, y, z - 0.065);\n  }\n  // Disguised club-side furniture panel marking the secret route without an always-visible label.\n  box(downScene, 1.4, 2.25, 0.28, storageWood, -2.15, 1.13, 3.34);\n  box(downScene, 1.08, 0.18, 0.35, storageDark, -2.15, 0.55, 3.13);\n  box(downScene, 0.7, 0.06, 0.36, storageGold, -2.15, 1.68, 3.16);\n\n  // Take A Break installation/chill room. Detailed couches and loose cushions are built by\n""",
          )
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  label(downScene, 'NORA · NIGHT PHOTOS', -8.1, 3.32, 3.67, 0.27, '#f3d4df');\n  for (const x of [-9.18, -8.13, -7.08])\n    box(downScene, 0.08, 0.22, 0.08, mat(0x262226), x, 3.15, 3.68);\n""",
              """  label(downScene, 'NORA · NIGHT PHOTOS', 8.72, 3.25, -1.05, 0.24, '#f3d4df');\n  for (const z of [-2.1, -1.05, 0.0])\n    box(downScene, 0.08, 0.22, 0.08, mat(0x262226), 8.86, 3.05, z);\n""",
          )

          # Make the photo textures live in the adjacent photo room, not behind the bartenders.
          patch(
              'src/photos/PhotoSystem.js',
              """ * textures in frames on the north wall of Take A Break, so the saved club night becomes visible\n""",
              """ * textures in frames in Nora's photo room beside Take A Break, so the saved club night becomes visible\n""",
          )
          patch(
              'src/photos/PhotoSystem.js',
              """    const positions = [\n      [-9.18, 2.28, 3.7],\n      [-8.13, 2.28, 3.7],\n      [-7.08, 2.28, 3.7],\n      [-9.18, 1.32, 3.7],\n      [-8.13, 1.32, 3.7],\n      [-7.08, 1.32, 3.7],\n    ];\n""",
              """    const positions = [\n      [8.9, 2.28, -2.1],\n      [8.9, 2.28, -1.05],\n      [8.9, 2.28, 0.0],\n      [8.9, 1.32, -2.1],\n      [8.9, 1.32, -1.05],\n      [8.9, 1.32, 0.0],\n    ];\n""",
          )
          patch(
              'src/photos/PhotoSystem.js',
              """      frame.rotation.y = Math.PI;\n""",
              """      frame.rotation.y = -Math.PI / 2;\n""",
          )
          patch(
              'src/photos/PhotoSystem.js',
              """      matte.position.set(x, y, z - 0.031);\n      matte.rotation.y = Math.PI;\n""",
              """      matte.position.set(x - 0.031, y, z);\n      matte.rotation.y = -Math.PI / 2;\n""",
          )
          patch(
              'src/photos/PhotoSystem.js',
              """      plane.position.set(x, y, z - 0.038);\n      plane.rotation.y = Math.PI;\n""",
              """      plane.position.set(x - 0.038, y, z);\n      plane.rotation.y = -Math.PI / 2;\n""",
          )
          patch(
              'src/gameplay/PartyLifePhotoSystem.js',
              """        choices.push({ position: [-8.1, 0, 1.55], tags: ['take-a-break', 'crowd'] });\n""",
              """        choices.push({ position: [7.65, 0, 3.65], tags: ['take-a-break', 'crowd'] });\n""",
          )

          # Expand the actual Take A Break furniture footprint and listening seats.
          replace_regex(
              'src/scenes/geometry/roomFurniture.js',
              r"export function buildTakeABreakFurniture\(root\) \{.*?export const TAKE_A_BREAK_SEATS = \[.*?\];",
              """export function buildTakeABreakFurniture(root) {\n  const primitives = createPrimitives();\n  const { box, cyl, mat } = primitives;\n\n  couch(root, primitives, {\n    x: 7.65,\n    z: 1.55,\n    width: 2.18,\n    depth: 0.78,\n    color: 0x713e45,\n  }).name = 'take-a-break-front-couch';\n\n  couch(root, primitives, {\n    x: 7.65,\n    z: 5.82,\n    width: 2.18,\n    depth: 0.72,\n    color: 0x504452,\n    rotation: Math.PI,\n  }).name = 'take-a-break-back-couch';\n\n  couch(root, primitives, {\n    x: 8.47,\n    z: 3.72,\n    width: 2.2,\n    depth: 0.68,\n    color: 0x5a4e45,\n    rotation: -Math.PI / 2,\n  }).name = 'take-a-break-side-couch';\n\n  const cushionData = [\n    [6.72, 2.55, 0x9f6a73, -0.2],\n    [7.55, 2.65, 0xb28b58, 0.08],\n    [6.82, 3.72, 0x6d718f, 0.16],\n    [7.62, 4.25, 0x81719e, -0.08],\n    [6.72, 5.05, 0x9a735b, 0.18],\n  ];\n  cushionData.forEach(([x, z, color, rotation], index) => {\n    const cushion = floorCushion(root, primitives, x, z, color, rotation);\n    cushion.name = `take-a-break-cushion-${index + 1}`;\n  });\n\n  box(root, 0.72, 0.1, 0.52, mat(0x594431, 0.83, 0.03), 6.7, 0.27, 4.28);\n  for (const x of [6.52, 6.88])\n    box(root, 0.06, 0.25, 0.06, mat(0x2f2c2d), x, 0.125, 4.28);\n  cyl(root, 0.09, 0.9, mat(0x3b3b40, 0.56, 0.15), 8.55, 0.46, 5.42);\n  cyl(root, 0.28, 0.18, mat(0xc89062, 0.5, 0.02), 8.55, 1.02, 5.42);\n}\n\nexport const TAKE_A_BREAK_SEATS = [\n  [6.72, 0, 2.55],\n  [7.55, 0, 2.65],\n  [6.82, 0, 3.72],\n  [7.62, 0, 4.25],\n  [6.72, 0, 5.05],\n];""",
          )
          patch(
              'src/gameplay/roomExperienceEnhancements.js',
              """    const centre = [7.65, 4.8];\n""",
              """    const centre = [7.65, 3.65];\n""",
          )

          # Add David and Beaver character looks/dialogue.
          patch(
              'src/npcs/NpcSystem.js',
              """  bouncer: {\n""",
              """  david: {\n    skin: 0xb68a68,\n    hair: 0x5a4638,\n    outfit: 0x66513f,\n    accent: 0xa88a62,\n    hairStyle: 'short',\n  },\n  beaver: {\n    skin: 0xa96f52,\n    hair: 0x3a2b24,\n    outfit: 0x4a3a31,\n    accent: 0xc26d3e,\n    hairStyle: 'short',\n  },\n  bouncer: {\n""",
          )
          patch(
              'src/npcs/dialogues.js',
              """  bouncer: {\n""",
              """  david: {\n    title: 'DAVID · FURNITURE DEALER',\n    text: '“Half the building is furniture if you know which wall to move.”',\n  },\n  beaver: {\n    title: 'BEAVER · BACK ALLEY BBQ',\n    text: '“Hot dogs, tacos, beer. Keep the alley chill and eat something.”',\n  },\n  bouncer: {\n""",
          )

          # Beaver lives in the alley beside a real BBQ/vendor station.
          patch(
              'src/world/alley.js',
              """    bouncer: anchor('Bouncer', [-4.9, 0, -1.2], 1.2, 'dialogue'),\n    social: anchor('Alley conversation', [7.7, 0, 0.7], 1.9, 'alleySocial'),\n""",
              """    bouncer: anchor('Bouncer', [-4.9, 0, -1.2], 1.2, 'dialogue'),\n    social: anchor('Alley conversation', [7.7, 0, 0.7], 1.9, 'alleySocial'),\n    beaver: anchor('Beaver', [14.35, 0, -0.72], 1.35, 'dialogue'),\n    beaverBbq: anchor('Beaver BBQ', [15.35, 0, -0.78], 1.6, 'beaverBbq'),\n""",
          )
          patch(
              'src/world/alley.js',
              """    { id: 'smoker-1', position: [6.2, 0, -0.6], color: 0x596b4f, interactive: false },\n""",
              """    {\n      id: 'beaver',\n      name: 'Beaver',\n      anchor: 'beaver',\n      role: 'vendor',\n      color: 0x6d4b38,\n      rotationY: -Math.PI / 2,\n    },\n    { id: 'smoker-1', position: [6.2, 0, -0.6], color: 0x596b4f, interactive: false },\n""",
          )
          patch(
              'src/scenes/geometry/alleyBlockout.js',
              """  // Planters / trees create the narrow garden rhythm visible from De Castelnau.\n""",
              """  // Beaver's alley BBQ: grill, prep table and cooler, kept deliberately low-key outside.\n  const grill = mat(0x25282b, 0.5, 0.28);\n  const grillHot = mat(0x6d2d1f, 0.72, 0.05);\n  box(root, 1.05, 0.18, 0.62, grill, 15.35, 0.82, -0.78);\n  box(root, 1.0, 0.22, 0.58, grill, 15.35, 1.04, -0.78).rotation.x = -0.22;\n  for (const x of [14.95, 15.75]) box(root, 0.08, 0.8, 0.08, metal, x, 0.4, -0.78);\n  for (const x of [15.02, 15.25, 15.48, 15.7])\n    box(root, 0.15, 0.04, 0.34, grillHot, x, 0.94, -0.78);\n  box(root, 1.25, 0.1, 0.65, wood, 13.45, 0.72, -0.45);\n  for (const x of [12.95, 13.95]) box(root, 0.08, 0.68, 0.08, metal, x, 0.34, -0.45);\n  box(root, 0.82, 0.58, 0.62, mat(0x48647a, 0.7, 0.08), 16.65, 0.29, -0.52);\n  box(root, 0.84, 0.08, 0.64, mat(0xd8d7cc, 0.7, 0.03), 16.65, 0.62, -0.52);\n  label(root, 'BEAVER · BBQ', 14.65, 2.35, -2.15, 0.3, '#ffd0a6');\n  label(root, 'HOT DOGS · TACOS · BEER', 15.1, 1.85, -2.12, 0.2, '#f6dfc7');\n\n  // Planters / trees create the narrow garden rhythm visible from De Castelnau.\n""",
          )

          # Central interaction system for David's secret passage, the Clark emergency exit and Beaver's BBQ.
          Path('src/gameplay/BelowAlleyWorldSystem.js').write_text("""const clamp01 = (value) => Math.max(0, Math.min(1, Number(value) || 0));\n\nexport class BelowAlleyWorldSystem {\n  constructor(game, ui) {\n    this.game = game;\n    this.ui = ui;\n  }\n\n  save() {\n    this.game.save?.();\n  }\n\n  talkToDavid() {\n    const state = this.game.state.data;\n    this.game.state.meet?.('david');\n    const firstUnlock = state.storageAccessGranted !== true;\n    state.storageAccessGranted = true;\n    this.save();\n    this.ui.panel(\n      'DAVID · FURNITURE DEALER',\n      firstUnlock\n        ? '“See that impossible wall of furniture beside storage? Push the narrow panel behind the little gold frame. It is not a wall. Just do not knock over half my inventory getting through.” The hidden storage passage is now usable.'\n        : '“The panel with the little gold frame still opens. Everything behind it is technically organized, depending on your definition.”',\n      [],\n    );\n  }\n\n  moveThroughStorage(inside) {\n    if (this.game.state.data.storageAccessGranted !== true) {\n      this.ui.panel(\n        'OVERSTUFFED FURNITURE WALL',\n        'It looks like a dead end made of stacked furniture. There is probably a trick to it, but you do not know it yet.',\n        [],\n      );\n      return;\n    }\n    const position = inside ? [-2.15, 0, 4.05] : [-2.15, 0, 2.72];\n    this.game.player.position.set(...position);\n    this.game.player.velocity?.set?.(0, 0, 0);\n    this.game.camera?.recenter?.();\n    this.ui.warning?.(\n      inside\n        ? 'The furniture panel shifts. You squeeze into David’s packed storage room.'\n        : 'You push back through the disguised furniture wall into the club.',\n    );\n    this.save();\n  }\n\n  emergencyExit() {\n    this.ui.panel(\n      'CLARK EMERGENCY EXIT',\n      'This stair is the emergency exit to Clark. The normal route to the alley is at Zander’s stair core on the other side of the club.',\n      [],\n    );\n  }\n\n  beaverPanel() {\n    const state = this.game.state.data;\n    this.game.state.meet?.('beaver');\n    this.save();\n    this.ui.panel(\n      'BEAVER · BACK ALLEY BBQ',\n      `The grill is going beside the picnic tables. Hot dogs eaten: ${state.hotDogsEaten || 0}. Tacos eaten: ${state.tacosEaten || 0}. Beers from Beaver count toward your Breakglass drink total.`,\n      [\n        [\n          'Buy a hot dog',\n          () => {\n            state.hotDogsEaten = Math.min(999, (state.hotDogsEaten || 0) + 1);\n            this.save();\n            this.ui.warning?.('Beaver hands you a hot dog straight off the grill.');\n            this.beaverPanel();\n          },\n        ],\n        [\n          'Buy a taco',\n          () => {\n            state.tacosEaten = Math.min(999, (state.tacosEaten || 0) + 1);\n            this.save();\n            this.ui.warning?.('Beaver passes you a taco from the alley prep table.');\n            this.beaverPanel();\n          },\n        ],\n        [\n          'Buy a beer',\n          () => {\n            state.drinksServed = Math.min(999, (state.drinksServed || 0) + 1);\n            state.intoxication = clamp01((state.intoxication || 0) + 0.08);\n            this.save();\n            this.ui.warning?.('Beaver pulls a cold beer from the cooler.');\n            this.beaverPanel();\n          },\n        ],\n      ],\n    );\n  }\n\n  handle(target) {\n    const sceneId = this.game.sceneManager.current?.definition?.id;\n    if (sceneId === 'downstairs' && (target?.npcId === 'david' || target?.id === 'david')) {\n      this.talkToDavid();\n      return true;\n    }\n    if (sceneId === 'downstairs' && target?.action === 'storagePassage') {\n      this.moveThroughStorage(true);\n      return true;\n    }\n    if (sceneId === 'downstairs' && target?.action === 'storageExit') {\n      this.moveThroughStorage(false);\n      return true;\n    }\n    if (sceneId === 'downstairs' && target?.action === 'clarkEmergencyExit') {\n      this.emergencyExit();\n      return true;\n    }\n    if (\n      sceneId === 'alley' &&\n      (target?.action === 'beaverBbq' || target?.npcId === 'beaver' || target?.id === 'beaver')\n    ) {\n      this.beaverPanel();\n      return true;\n    }\n    return false;\n  }\n}\n\nexport function installBelowAlleyWorldSystem(game, ui) {\n  if (game.belowAlleyWorld) return game.belowAlleyWorld;\n  const system = new BelowAlleyWorldSystem(game, ui);\n  const baseDispatch = game.interactions.dispatch.bind(game.interactions);\n  game.interactions.dispatch = (target) => {\n    if (system.handle(target)) return;\n    baseDispatch(target);\n  };\n  game.belowAlleyWorld = system;\n  return system;\n}\n""")

          patch(
              'src/main.js',
              """import { installGameStatsEnhancements } from './gameplay/GameStatsSystem.js';\nimport { installAudioReliabilityEnhancements } from './gameplay/audioReliabilityEnhancements.js';\n""",
              """import { installGameStatsEnhancements } from './gameplay/GameStatsSystem.js';\nimport { installBelowAlleyWorldSystem } from './gameplay/BelowAlleyWorldSystem.js';\nimport { installAudioReliabilityEnhancements } from './gameplay/audioReliabilityEnhancements.js';\n""",
          )
          patch(
