name: Format Spectra drum machine

on:
  push:
    branches: [feat/spectra-drum-machine]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format Spectra drum machine implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-drum-machine
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            src/gameplay/DrumMachineSystem.js \
            src/scenes/geometry/upstairsFixtures.js \
            src/studio/StudioExporter.js \
            src/studio/StudioPlayback.js \
            src/ui/musicEnhancements.css
          git rm .github/workflows/format-spectra-drum-machine.yml
          git config user.name "breakglass-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/gameplay/DrumMachineSystem.js src/scenes/geometry/upstairsFixtures.js src/studio/StudioExporter.js src/studio/StudioPlayback.js src/ui/musicEnhancements.css
          git commit -m "Format Spectra drum machine implementation"
          git push origin HEAD:feat/spectra-drum-machine
