name: Format NPC dance social

on:
  push:
    branches: [feat/npc-dance-social]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-dance-social
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/crowd/CrowdSystem.js src/gameplay/DanceFloorSocial.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crowd/CrowdSystem.js src/gameplay/DanceFloorSocial.js
          git commit -m "Format NPC dance social changes"
          git push
