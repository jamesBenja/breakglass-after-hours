name: Temporary God Mode formatter

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format God Mode verification repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec prettier --write
          server/multiplayerServer.mjs
          server/inviteTokenFingerprints.js
          tests/multiplayer-server.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/multiplayerServer.mjs server/inviteTokenFingerprints.js tests/multiplayer-server.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format God Mode verification repair"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
