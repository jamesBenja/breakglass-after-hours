name: Temp Prettier Diff 153

on:
  push:
    branches:
      - fix/spectra-multiplayer-timing-and-mute-sync

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/spectra-recorder.test.js
      - run: git diff -- tests/spectra-recorder.test.js
