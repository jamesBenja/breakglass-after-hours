name: Format Spectra fader routing test

on:
  push:
    branches: [fix/spectra-fader-routing-surfaces]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format Spectra fader routing test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectra-fader-routing-surfaces
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format test
        run: |
          pnpm exec prettier --write tests/spectra-fader-routing.test.js
          git rm .github/workflows/format-spectra-fader-routing.yml
          git config user.name "breakglass-ci"
          git config user.email "actions@users.noreply.github.com"
          git add tests/spectra-fader-routing.test.js
          git commit -m "Format Spectra fader routing test"
          git push origin HEAD:fix/spectra-fader-routing-surfaces
