name: Temp Prettier Diff 155

on:
  push:
    branches:
      - feat/spectra-multiplayer-vocal-transfer

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/interactions/createActions.js src/multiplayer/VocalSync.js tests/multiplayer-vocal-sync.test.js
      - run: git diff -- src/interactions/createActions.js src/multiplayer/VocalSync.js tests/multiplayer-vocal-sync.test.js
