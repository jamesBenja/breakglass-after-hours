name: Character social pass

on:
  push:
    branches:
      - feat/sam-malaika-group-photo
    paths:
      - .github/workflows/character-social-pass.yml
      - scripts/character_social_part1.py
      - scripts/character_social_part2.py
      - scripts/character_social_part3.py
      - src/gameplay/GroupPhotoSystem.js

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sam-malaika-group-photo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply reference and social patches
        run: |
          python scripts/character_social_part1.py
          python scripts/character_social_part2.py
          python scripts/character_social_part3.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/npcs/NpcSystem.js
          src/npcs/dialogues.js
          src/world/alley.js
          src/gameplay/partyLifeEnhancements.js
          src/gameplay/HouseDjSystem.js
          src/gameplay/GroupPhotoSystem.js
          docs/CHARACTER_REFERENCES.md
          tests/character-social-pass.test.js
          tests/party-life.test.js

      - name: Verify requested features
        shell: bash
        run: |
          grep -q "SAM · SECURITY" src/npcs/dialogues.js
          grep -q "DJ FLLEUR" src/gameplay/HouseDjSystem.js
          grep -q "GroupPhotoSystem" src/gameplay/partyLifeEnhancements.js
          grep -q "group-photo-session" src/gameplay/GroupPhotoSystem.js
          grep -q "id: 'sam'" src/world/alley.js
          grep -q "id: 'malaika'" src/gameplay/partyLifeEnhancements.js
          grep -q "Take A Break" src/world/levels.js
          grep -q "Kitchen + Bar" src/world/levels.js

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting check
        run: pnpm exec prettier --check src tests server docs/CHARACTER_REFERENCES.md

      - name: Commit verified game pass
        shell: bash
        run: |
          rm scripts/character_social_part1.py scripts/character_social_part2.py scripts/character_social_part3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs tests scripts
          git commit -m "Add Sam, DJ FLLEUR and multiplayer group photos"
          git push origin HEAD:feat/sam-malaika-group-photo
