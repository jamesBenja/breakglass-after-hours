name: One-shot invitation backend

on:
  push:
    branches:
      - feat/invitation-backend
    paths:
      - .github/workflows/one-shot-invitation-backend.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invitation-backend
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply server patch
        run: python scripts/patch_invitation_backend.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check server/multiplayerServer.mjs

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Commit verified backend
        run: |
          rm .github/workflows/one-shot-invitation-backend.yml scripts/patch_invitation_backend.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add server-verified invitation access"
          git push origin HEAD:feat/invitation-backend
