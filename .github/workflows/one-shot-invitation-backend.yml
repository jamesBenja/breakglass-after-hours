name: One-shot invitation backend

on:
  push:
    branches:
      - feat/invitation-backend
    paths:
      - .github/workflows/one-shot-invitation-backend.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invitation-backend
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply server patch
        run: python scripts/patch_invitation_backend.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check server/multiplayerServer.mjs

      - name: Verify invitation endpoint
        shell: bash
        run: |
          GOD_MODE_TOKEN=test-secret PORT=8787 node server/multiplayerServer.mjs > /tmp/invite-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const type = 'producer';
          const signature = crypto
            .createHmac('sha256', 'test-secret')
            .update(`breakglass-invite:${type}`)
            .digest('base64url');
          const good = await fetch('http://127.0.0.1:8787/invite/verify', {
            headers: { Authorization: `Bearer ${type}.${signature}` },
          });
          const payload = await good.json();
          if (!good.ok || payload.ok !== true || payload.type !== type)
            throw new Error(`valid invite rejected: ${good.status} ${JSON.stringify(payload)}`);
          const bad = await fetch('http://127.0.0.1:8787/invite/verify', {
            headers: { Authorization: 'Bearer dj.forged' },
          });
          if (bad.status !== 401) throw new Error(`forged invite accepted: ${bad.status}`);
          NODE

      - name: Production build
        run: pnpm build

      - name: Commit verified backend
        run: |
          rm .github/workflows/one-shot-invitation-backend.yml scripts/patch_invitation_backend.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add server-verified invitation access"
          git push origin HEAD:feat/invitation-backend
