name: Format Current Pass

on:
  push:
    branches:
      - feat/mobile-performance-dj-surface
    paths:
      - .github/workflows/format-current-pass.yml
      - src/audio/SpatialAudioSystem.js
      - src/player/FollowCamera.js
      - index.html

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Prettier formatting') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-performance-dj-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: pnpm exec prettier --write src/audio/SpatialAudioSystem.js src/player/FollowCamera.js index.html
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/SpatialAudioSystem.js src/player/FollowCamera.js index.html
          git commit -m "Apply Prettier formatting"
          git push origin HEAD:feat/mobile-performance-dj-surface
