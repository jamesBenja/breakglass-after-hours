name: Debug Below Pass V3

on:
  push:
    branches:
      - feat/below-alley-world-systems
    paths:
      - .github/workflows/debug-below-pass-v3.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/below-alley-world-systems
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Reproduce finalized pass and capture tests
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import traceback

          out = []
          try:
              workflow = Path('.github/workflows/finalize-below-alley-world-pass.yml').read_text()
              marker = '      - name: Apply complete world pass from prepared workflows'
              section = workflow.index(marker)
              start = workflow.index('        run: |\n', section) + len('        run: |\n')
              end = workflow.index('\n      - name: Format complete pass', start)
              block = workflow[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
              scope = {'__builtins__': __builtins__, 'Path': Path, 're': re}
              exec(compile(script, 'finalize-pass.py', 'exec'), scope, scope)
              out.append('finalized apply: OK')
          except Exception:
              out.append('finalized apply: FAILED\n' + traceback.format_exc())

          result = subprocess.run(['pnpm', 'test'], text=True, capture_output=True)
          out.append(f'pnpm test exit: {result.returncode}\nSTDOUT:\n{result.stdout}\nSTDERR:\n{result.stderr}')
          Path('debug-v3-output.txt').write_text('\n\n'.join(out))
      - name: Publish diagnostic output
        run: |
          git config user.name "jamesBenja"
          git config user.email "70452184+jamesBenja@users.noreply.github.com"
          git add debug-v3-output.txt
          git commit -m "Capture final Below pass test diagnostics"
          git push origin HEAD:feat/below-alley-world-systems
