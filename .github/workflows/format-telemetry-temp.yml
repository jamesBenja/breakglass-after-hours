name: Format Telemetry Temp

on:
  push:
    branches:
      - feat/playtest-telemetry
    paths:
      - .github/workflows/format-telemetry-temp.yml
      - src/gameplay/PlaytestTelemetry.js

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/gameplay/PlaytestTelemetry.js
      - name: Emit formatted file
        run: |
          echo 'FORMATTED_FILE_BEGIN'
          base64 -w0 src/gameplay/PlaytestTelemetry.js
          echo
          echo 'FORMATTED_FILE_END'
