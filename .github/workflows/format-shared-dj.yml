name: Format Shared DJ Branch

on:
  push:
    branches:
      - feat/shared-dj-track-uploads

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-dj-track-uploads
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: >
          pnpm exec prettier --write
          src/gameplay/DjPerformanceRealismSystem.js
          src/multiplayer/SharedWorld.js
          src/ui/djHardwareV2.css
          tests/dj-four-channel.test.js
          tests/multiplayer-server.test.js
          server/multiplayerServer.mjs
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameplay/DjPerformanceRealismSystem.js src/multiplayer/SharedWorld.js src/ui/djHardwareV2.css tests/dj-four-channel.test.js tests/multiplayer-server.test.js server/multiplayerServer.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format shared DJ upload pass"
          git push origin HEAD:feat/shared-dj-track-uploads
