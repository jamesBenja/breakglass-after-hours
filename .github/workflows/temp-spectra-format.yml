name: Temporary Spectra Formatter

on:
  push:
    branches:
      - feat/spectra-add-tracks-verify-inputs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-add-tracks-verify-inputs
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/studio/SpectraInputs.js src/studio/StudioPlayback.js tests/spectra-recording-monitor.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git add src/studio/SpectraInputs.js src/studio/StudioPlayback.js tests/spectra-recording-monitor.test.js
            git commit -m "Format Spectra multi-track input changes"
            git push origin HEAD:feat/spectra-add-tracks-verify-inputs
          fi
