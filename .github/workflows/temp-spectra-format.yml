name: Temporary Spectra Formatter

on:
  push:
    branches:
      - fix/spectra-recording-session-performance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectra-recording-session-performance
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/ui/Hud.js src/ui/mobileMixing.css tests/spectra-recorder.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git add src/ui/Hud.js src/ui/mobileMixing.css tests/spectra-recorder.test.js
            git commit -m "Format Spectra recording and session pass"
            git push origin HEAD:fix/spectra-recording-session-performance
          fi
