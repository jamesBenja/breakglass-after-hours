name: Temporary Spectra Formatter

on:
  push:
    branches:
      - feat/spectra-console-real-desk

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-console-real-desk
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/gameplay/ModularSynthSystem.js src/gameplay/StudioLoopEnhancements.js src/studio/SpectraInputs.js src/studio/SpectraRecorder.js src/studio/StudioPlayback.js src/ui/mobileMixerEnhancements.js src/ui/mobileMixing.css src/ui/styles.css tests/spectra-fader-routing.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git add src/gameplay/ModularSynthSystem.js src/gameplay/StudioLoopEnhancements.js src/studio/SpectraInputs.js src/studio/SpectraRecorder.js src/studio/StudioPlayback.js src/ui/mobileMixerEnhancements.js src/ui/mobileMixing.css src/ui/styles.css tests/spectra-fader-routing.test.js
            git commit -m "Format Spectra console redesign"
            git push origin HEAD:feat/spectra-console-real-desk
          fi
