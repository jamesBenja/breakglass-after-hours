name: Validate shared media recovery

on:
  push:
    branches:
      - fix/recover-world-live
    paths:
      - .github/workflows/fix-shared-media-sync.yml
      - scripts/fix_shared_media_sync.py
      - src/multiplayer/SharedMediaSync.js

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recover-world-live
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply shared media patch
        run: python scripts/fix_shared_media_sync.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format patched files
        run: pnpm exec prettier --write src/multiplayer/MultiplayerClient.js src/multiplayer/SharedWorld.js src/multiplayer/SharedMediaSync.js src/multiplayer/installMultiplayerEnhancements.js src/dj/DjMixer.js src/gameplay/DjPerformanceRealismSystem.js src/audio/AudioEngine.js src/studio/StudioPlayback.js src/gameplay/StudioLoopEnhancements.js src/archive/LiveArchivePlayer.js src/interactions/createActions.js .github/workflows/iphone-preview.yml

      - name: Verify recovery and synchronization features
        shell: bash
        run: |
          grep -q "Show me the tape archive" src/interactions/createActions.js
          grep -q "restartDeckAt" src/dj/DjMixer.js
          grep -q "deckPosition" src/dj/DjMixer.js
          grep -q "serverNow" src/multiplayer/MultiplayerClient.js
          grep -q "shared-studio-playback" src/multiplayer/SharedMediaSync.js
          grep -q "shared-live-archive" src/multiplayer/SharedMediaSync.js
          grep -q "ZANDER" src/scenes/geometry/belowBlockout.js
          grep -q "storagePassage" src/world/levels.js
          grep -q "Beaver" src/world/alley.js
          grep -q "Nora photo wall" src/world/levels.js
          grep -q "Take A Break" src/world/levels.js
          grep -q "Kitchen + Bar" src/world/levels.js
          test "$(grep -c 'feat/multiplayer-phase-2-shared-world' .github/workflows/iphone-preview.yml)" -eq 1
          ! grep -q 'feat/below-alley-world-systems' .github/workflows/iphone-preview.yml

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting check
        run: pnpm exec prettier --check src tests server .github/workflows/iphone-preview.yml

      - name: Commit verified recovery
        shell: bash
        run: |
          rm .github/workflows/fix-shared-media-sync.yml scripts/fix_shared_media_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore world systems and synchronize shared media"
          git push origin HEAD:fix/recover-world-live
