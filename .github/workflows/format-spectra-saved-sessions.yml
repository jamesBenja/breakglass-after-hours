name: Format Spectra saved sessions

on:
  push:
    branches: [feat/spectra-saved-sessions]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format Spectra saved sessions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-saved-sessions
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format files
        run: |
          pnpm exec prettier --write src/gameplay/StudioLoopEnhancements.js src/studio/SpectraProjectStore.js
          git rm .github/workflows/format-spectra-saved-sessions.yml
          git config user.name "breakglass-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/gameplay/StudioLoopEnhancements.js src/studio/SpectraProjectStore.js
          git commit -m "Format Spectra saved sessions"
          git push origin HEAD:feat/spectra-saved-sessions
