name: Prepare Rainforest AmbiX Derivative

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/rainforest-derive.yml

permissions:
  contents: write

concurrency:
  group: rainforest-ambix-one-shot
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical live branch
        uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Download public 06:00 rainforest master
        env:
          DRIVE_FILE_ID: 1MatoeuV6khOAGFShjgJlRyYZL2ixQpLt
        run: |
          set -euo pipefail
          gdown --id "$DRIVE_FILE_ID" -O /tmp/rainforest-06.wav
          test -s /tmp/rainforest-06.wav

      - name: Verify source is four-channel AmbiX container
        run: |
          set -euo pipefail
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 /tmp/rainforest-06.wav)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/rainforest-06.wav)"
          echo "Source channels: $channels"
          echo "Source duration: $duration"
          test "$channels" = "4"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          assert 3590 <= duration <= 3610, duration
          PY

      - name: Extract compact AmbiX dawn loop without channel remapping
        run: |
          set -euo pipefail
          out="public/assets/audio/ambient/rainforest/rainforest-ambix-dawn-loop.wav"
          mkdir -p "$(dirname "$out")"
          # Stream-copy the original PCM payload: no downmix, reordering, normalization or codec conversion.
          # 1800 seconds into the 06:00 master corresponds to approximately 06:30.
          ffmpeg -hide_banner -loglevel error             -ss 1800 -i /tmp/rainforest-06.wav             -t 120 -map 0:a:0 -c:a copy -y "$out"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$out")"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")"
          bytes="$(stat -c %s "$out")"
          echo "Derivative channels: $channels"
          echo "Derivative duration: $duration"
          echo "Derivative bytes: $bytes"
          test "$channels" = "4"
          test "$bytes" -gt 1000000
          test "$bytes" -lt 95000000

      - name: Commit compact runtime media
        run: |
          set -euo pipefail
          git config user.name "breakglass-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/audio/ambient/rainforest/rainforest-ambix-dawn-loop.wav
          if git diff --cached --quiet; then
            echo "Rainforest derivative already present."
          else
            git commit -m "Add real rainforest AmbiX dawn loop"
            git push origin HEAD:feat/multiplayer-phase-2-shared-world
          fi
