name: Apply Multiplayer Face Sharing

on:
  push:
    branches:
      - feat/live-multiplayer-foundation
    paths:
      - .github/workflows/apply-face-sharing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-multiplayer-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Patch multiplayer consent handling
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/multiplayer/MultiplayerClient.js')
          text = client.read_text()
          text = text.replace("import { normalizeAvatar } from '../avatar/profile.js';", "import { multiplayerAvatar } from '../avatar/profile.js';")
          text = text.replace('this.avatar = normalizeAvatar(avatar);', 'this.avatar = multiplayerAvatar(avatar);')
          client.write_text(text)

          server = Path('server/multiplayerServer.mjs')
          text = server.read_text()
          old = """  const faceTexture =\n    typeof value.faceTexture === 'string' &&\n    value.faceTexture.length <= 180_000 &&\n    /^data:image\\/(?:png|webp|jpeg);base64,/i.test(value.faceTexture)\n      ? value.faceTexture\n      : null;"""
          new = """  const faceTexture =\n    value.shareFaceMultiplayer === true &&\n    typeof value.faceTexture === 'string' &&\n    value.faceTexture.length <= 180_000 &&\n    /^data:image\\/(?:png|webp|jpeg);base64,/i.test(value.faceTexture)\n      ? value.faceTexture\n      : null;"""
          if old not in text:
              raise SystemExit('Expected server face sanitizer block not found')
          text = text.replace(old, new)
          text = text.replace('    faceTexture,\n  };', '    faceTexture,\n    shareFaceMultiplayer: value.shareFaceMultiplayer === true && !!faceTexture,\n  };')
          server.write_text(text)
          PY
      - name: Format
        run: pnpm exec prettier --write src/avatar/profile.js src/avatar/faceAvatarEnhancements.js src/multiplayer/MultiplayerClient.js server/multiplayerServer.mjs tests/multiplayer-face-consent.test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/avatar/profile.js src/avatar/faceAvatarEnhancements.js src/multiplayer/MultiplayerClient.js server/multiplayerServer.mjs tests/multiplayer-face-consent.test.js
          git commit -m "Enable opt-in multiplayer face sharing"
          git push origin HEAD:feat/live-multiplayer-foundation
