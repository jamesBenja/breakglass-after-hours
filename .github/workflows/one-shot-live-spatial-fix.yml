name: One-shot live stair and entry fix

on:
  push:
    branches:
      - fix/live-stairs-entry-alley
    paths:
      - .github/workflows/one-shot-live-spatial-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-stairs-entry-alley
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply gameplay patch
        run: python scripts/one_shot_live_spatial_fix.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write src/world/upstairs/plan.js src/world/upstairs/gameSpace.js src/world/upstairs/definition.js src/scenes/geometry/upstairsBlockout.js src/world/levels.js src/scenes/geometry/belowBlockout.js src/scenes/geometry/alleyBlockout.js src/world/alley.js tests/spatial-routes.js tests/spatial.test.js tests/browser-smoke.js

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit verified fix
        run: |
          rm .github/workflows/one-shot-live-spatial-fix.yml scripts/one_shot_live_spatial_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live studio circulation and shared alley stair"
          git push origin HEAD:fix/live-stairs-entry-alley
