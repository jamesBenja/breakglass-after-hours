name: One-shot format invitation access

on:
  push:
    branches:
      - feat/invitation-access
    paths:
      - .github/workflows/one-shot-format-invitation.yml

permissions:
  contents: write

jobs:
  format-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invitation-access
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format invitation files
        run: pnpm exec prettier --write src/gameplay/InvitationAccess.js src/ui/invitation.css src/main.js tests/invitationAccess.test.js

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Formatting check
        run: pnpm format:check

      - name: Commit verified formatting
        run: |
          rm .github/workflows/one-shot-format-invitation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and verify invitation access"
          git push origin HEAD:feat/invitation-access
