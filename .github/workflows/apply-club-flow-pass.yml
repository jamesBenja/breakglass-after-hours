name: Apply Club Flow Pass

on:
  push:
    branches:
      - feat/character-realism-pass
    paths:
      - .github/workflows/apply-club-flow-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/character-realism-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Apply room swap and guided progression
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # 1) Below architecture: two west-side door openings (studio + bar), east-side Take A Break door.
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  wall(-6.1, -0.55, 0.24, 1.3);\n  wall(-6.1, 2.45, 0.24, 2.1);\n  wall(6.1, -2.825, 0.24, 1.35);\n  wall(6.1, 1.475, 0.24, 4.05);\n  wall(0, 3.5, 12.2, 0.24);\n""",
              """  // West wall now has two explicit openings: one into the bar and one onto the Clark stair.\n  wall(-6.1, -2.8, 0.24, 1.4);\n  wall(-6.1, -0.05, 0.24, 1.0);\n  wall(-6.1, 2.45, 0.24, 2.1);\n  doorwayFrame(downScene, -5.98, -1.34, 'vertical', 'STUDIO ↑');\n  doorwayFrame(downScene, -5.98, 0.92, 'vertical', 'BAR');\n\n  // East wall gets a dedicated opening into Take A Break while preserving the service opening.\n  wall(6.1, -2.825, 0.24, 1.35);\n  wall(6.1, 0.4, 0.24, 1.9);\n  wall(6.1, 3.15, 0.24, 0.7);\n  doorwayFrame(downScene, 5.98, 2.05, 'vertical', 'TAKE A BREAK');\n  wall(0, 3.5, 12.2, 0.24);\n""",
          )

          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  floor(downScene, -8.1, 1.7, 3.8, 4.3, mat(0x5e4331));\n  wall(-10, 1.7, 0.24, 4.3);\n  wall(-8.1, 3.85, 3.8, 0.24);\n  wall(-8.1, -0.45, 3.8, 0.24);\n  wall(-6.2, 2.6, 0.24, 2.5);\n  box(downScene, 0.95, 0.035, 1.28, mat(0xc58a66), -6.08, 0.018, 0.76);\n  label(downScene, 'TAKE A BREAK', -8.1, 2.9, 1.7, 0.45);\n""",
              """  // West room: kitchen + bar. The original shell is preserved but its function is swapped.\n  floor(downScene, -8.1, 1.7, 3.8, 4.3, mat(0x4d2f2d));\n  wall(-10, 1.7, 0.24, 4.3);\n  wall(-8.1, 3.85, 3.8, 0.24);\n  wall(-8.1, -0.45, 3.8, 0.24);\n  wall(-6.2, 2.6, 0.24, 2.5);\n  box(downScene, 0.95, 0.035, 0.88, mat(0xb75c50), -6.08, 0.018, 0.9);\n  label(downScene, 'KITCHEN + BAR', -8.1, 2.9, 1.7, 0.42);\n""",
          )

          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  floor(downScene, 7.65, 4.8, 2.8, 3.2, serviceFloor);\n  floor(downScene, 7.65, 1.5, 2.8, 2.6, serviceFloor);\n  floor(downScene, 7.65, -1.4, 2.8, 3.0, mat(0x4d2f2d));\n  wall(9.05, 1.7, 0.24, 9.4);\n  wall(7.65, 6.4, 2.8, 0.24);\n  wall(7.65, -2.9, 2.8, 0.24);\n  box(downScene, 0.95, 0.035, 1.28, mat(0xb75c50), 6.08, 0.018, -1.3);\n  label(downScene, 'KITCHEN + BAR', 7.65, 2.55, 4.8, 0.3);\n  label(downScene, 'PRODUCTION', 7.65, 2.55, 1.5, 0.3);\n  label(downScene, 'SERVICE', 7.65, 2.55, -1.4, 0.32);\n""",
              """  // East side: Take A Break sits above the remaining production/service strip.\n  floor(downScene, 7.65, 4.8, 2.8, 3.2, mat(0x5e4331));\n  floor(downScene, 7.65, 1.5, 2.8, 2.6, serviceFloor);\n  floor(downScene, 7.65, -1.4, 2.8, 3.0, serviceFloor);\n  wall(9.05, 1.7, 0.24, 9.4);\n  wall(7.65, 6.4, 2.8, 0.24);\n  wall(7.65, -2.9, 2.8, 0.24);\n  box(downScene, 0.95, 0.035, 1.28, mat(0xc58a66), 6.08, 0.018, 2.05);\n  label(downScene, 'TAKE A BREAK', 7.65, 2.55, 4.8, 0.32);\n  label(downScene, 'PRODUCTION', 7.65, 2.55, 1.5, 0.3);\n  label(downScene, 'SERVICE', 7.65, 2.55, -1.4, 0.32);\n""",
          )

          # Move the installation's visible emitters and focal sculpture to the east room.
          patch(
              'src/scenes/geometry/belowBlockout.js',
              """  box(downScene, 0.08, 1.45, 2.35, mat(0xb7929f, 0.45, 0.02), -9.76, 1.55, 1.85);\n  box(downScene, 0.78, 0.52, 0.78, mat(0x2b242c), -8.72, 0.26, 1.85);\n  cyl(downScene, 0.19, 1.05, mat(0xd4a45f, 0.38, 0.12), -8.72, 1.03, 1.85);\n  label(downScene, 'IMMERSIVE INSTALLATION', -8.9, 2.45, 1.85, 0.25, '#f2c7df');\n\n  for (const [x, y, z, accent] of [\n    [-9.15, 1.25, 0.35, 0xc98696],\n    [-7.05, 1.45, 0.55, 0x7799a6],\n    [-9.2, 1.6, 2.95, 0xb69b63],\n    [-7.0, 1.25, 3.0, 0x81719e],\n  ]) {\n""",
              """  box(downScene, 0.08, 1.45, 2.35, mat(0xb7929f, 0.45, 0.02), 8.84, 1.55, 4.8);\n  box(downScene, 0.78, 0.52, 0.78, mat(0x2b242c), 7.65, 0.26, 4.8);\n  cyl(downScene, 0.19, 1.05, mat(0xd4a45f, 0.38, 0.12), 7.65, 1.03, 4.8);\n  label(downScene, 'IMMERSIVE INSTALLATION', 7.65, 2.45, 5.95, 0.23, '#f2c7df');\n\n  for (const [x, y, z, accent] of [\n    [6.55, 1.25, 3.65, 0xc98696],\n    [8.55, 1.45, 3.75, 0x7799a6],\n    [6.55, 1.6, 5.9, 0xb69b63],\n    [8.55, 1.25, 6.0, 0x81719e],\n  ]) {\n""",
          )

          # Move the working bar geometry into the west room. Keep the arcade/photo wall intact.
          start = Path('src/scenes/geometry/belowBlockout.js').read_text()
          old_start = "  const counterZ = 4.42;\n"
          old_end = "  label(downScene, 'COURTNEY + SIMLA · BAR', 7.65, 2.62, 5.45, 0.23, '#ffc9b0');\n"
          i = start.index(old_start)
          j = start.index(old_end, i) + len(old_end)
          bar_block = """  const counterZ = 2.55;\n  box(downScene, 2.7, 1.0, 0.82, MAT.wood, -8.15, 0.5, counterZ);\n  box(downScene, 2.8, 0.075, 0.9, mat(0xb18a61), -8.15, 1.025, counterZ);\n  for (const x of [-9.15, -8.48, -7.81, -7.14]) {\n    cyl(downScene, 0.22, 0.62, MAT.metal, x, 0.31, 1.62);\n    cyl(downScene, 0.3, 0.08, mat(0x4e2729), x, 0.66, 1.62);\n  }\n\n  const shelf = mat(0x6f523d, 0.78, 0.03);\n  for (const y of [1.05, 1.62, 2.19]) {\n    box(downScene, 3.1, 0.07, 0.24, shelf, -8.15, y, 3.62);\n    for (let i = 0; i < 10; i++) {\n      const x = -9.35 + i * 0.265;\n      const bottleHeight = 0.18 + ((i + Math.round(y * 10)) % 3) * 0.045;\n      cyl(\n        downScene,\n        0.04,\n        bottleHeight,\n        mat([0x526a48, 0x74503c, 0x6a5178, 0x8c7646][i % 4], 0.38, 0.04),\n        x,\n        y + bottleHeight / 2 + 0.04,\n        3.54,\n      );\n    }\n  }\n\n  // Espresso machine on the working side of the west-room bar.\n  const steel = mat(0xa5a8a4, 0.3, 0.62);\n  const coffeeDark = mat(0x242526, 0.5, 0.24);\n  box(downScene, 0.78, 0.52, 0.42, steel, -9.18, 1.1, 2.55);\n  box(downScene, 0.72, 0.12, 0.4, coffeeDark, -9.18, 1.41, 2.55);\n  box(downScene, 0.68, 0.08, 0.34, MAT.metal, -9.18, 0.81, 2.51);\n  for (const x of [-9.36, -9.0]) {\n    cyl(downScene, 0.055, 0.12, coffeeDark, x, 1.16, 2.32).rotation.x = Math.PI / 2;\n    cyl(downScene, 0.022, 0.2, MAT.metal, x, 0.96, 2.33);\n  }\n  cyl(downScene, 0.035, 0.34, MAT.metal, -8.78, 1.02, 2.48).rotation.z = 0.28;\n  for (const x of [-9.4, -9.18, -8.96]) {\n    cyl(downScene, 0.075, 0.09, mat(0xe0d4c2, 0.82, 0.01), x, 1.54, 2.59);\n  }\n  label(downScene, 'COFFEE', -9.18, 1.92, 2.55, 0.2, '#f1dfc6');\n\n  for (const x of [-8.45, -8.08, -7.71]) {\n    cyl(downScene, 0.035, 0.44, MAT.metal, x, 1.28, 2.93);\n    box(downScene, 0.18, 0.05, 0.1, MAT.metal, x, 1.49, 2.89);\n  }\n  label(downScene, 'COURTNEY + SIMLA · BAR', -8.15, 2.62, 3.25, 0.23, '#ffc9b0');\n"""
          Path('src/scenes/geometry/belowBlockout.js').write_text(start[:i] + bar_block + start[j:])

          # 2) Take A Break furniture + listener focus move east.
          p = Path('src/scenes/geometry/roomFurniture.js')
          text = p.read_text()
          old_start = 'export function buildTakeABreakFurniture(root) {'
          old_end = 'export const TAKE_A_BREAK_SEATS = [\n  [-9.18, 0, 1.55],\n  [-7.5, 0, 1.62],\n  [-8.0, 0, 2.38],\n];'
          i = text.index(old_start)
          j = text.index(old_end, i) + len(old_end)
          new = """export function buildTakeABreakFurniture(root) {\n  const primitives = createPrimitives();\n  const { box, cyl, mat } = primitives;\n\n  couch(root, primitives, {\n    x: 7.65,\n    z: 4.02,\n    width: 2.18,\n    depth: 0.78,\n    color: 0x713e45,\n  }).name = 'take-a-break-main-couch';\n\n  couch(root, primitives, {\n    x: 7.65,\n    z: 5.88,\n    width: 2.18,\n    depth: 0.72,\n    color: 0x504452,\n    rotation: Math.PI,\n  }).name = 'take-a-break-back-couch';\n\n  const cushionData = [\n    [6.72, 4.68, 0x9f6a73, -0.2],\n    [8.47, 4.75, 0x6d718f, 0.18],\n    [7.58, 5.25, 0xb28b58, -0.08],\n  ];\n  cushionData.forEach(([x, z, color, rotation], index) => {\n    const cushion = floorCushion(root, primitives, x, z, color, rotation);\n    cushion.name = `take-a-break-cushion-${index + 1}`;\n  });\n\n  box(root, 0.66, 0.1, 0.5, mat(0x594431, 0.83, 0.03), 6.72, 0.27, 5.48);\n  for (const x of [6.55, 6.89]) box(root, 0.06, 0.25, 0.06, mat(0x2f2c2d), x, 0.125, 5.48);\n  cyl(root, 0.09, 0.9, mat(0x3b3b40, 0.56, 0.15), 8.62, 0.46, 5.82);\n  cyl(root, 0.28, 0.18, mat(0xc89062, 0.5, 0.02), 8.62, 1.02, 5.82);\n}\n\nexport const TAKE_A_BREAK_SEATS = [\n  [6.72, 0, 4.68],\n  [8.47, 0, 4.75],\n  [7.58, 0, 5.25],\n];"""
          p.write_text(text[:i] + new + text[j:])

          patch(
              'src/gameplay/roomExperienceEnhancements.js',
              "const centre = [-8.72, 1.85];",
              "const centre = [7.65, 4.8];",
          )

          # 3) Spatial installation emitters move with the room.
          patch(
              'src/audio/SpatialAudioSystem.js',
              """const INSTALLATION_EMITTERS = [\n  { position: [-9.15, 1.25, 0.35], frequency: 110, wave: 'sine', lfo: 0.071, layer: 'low' },\n  {\n    position: [-7.05, 1.45, 0.55],\n    frequency: 164.81,\n    wave: 'triangle',\n    lfo: 0.053,\n    layer: 'texture',\n  },\n  {\n    position: [-9.2, 1.6, 2.95],\n    frequency: 246.94,\n    wave: 'sine',\n    lfo: 0.043,\n    layer: 'texture',\n  },\n  {\n    position: [-7.0, 1.25, 3.0],\n    frequency: 329.63,\n    wave: 'triangle',\n    lfo: 0.061,\n    layer: 'air',\n  },\n];\n""",
              """const INSTALLATION_EMITTERS = [\n  { position: [6.55, 1.25, 3.65], frequency: 110, wave: 'sine', lfo: 0.071, layer: 'low' },\n  {\n    position: [8.55, 1.45, 3.75],\n    frequency: 164.81,\n    wave: 'triangle',\n    lfo: 0.053,\n    layer: 'texture',\n  },\n  {\n    position: [6.55, 1.6, 5.9],\n    frequency: 246.94,\n    wave: 'sine',\n    lfo: 0.043,\n    layer: 'texture',\n  },\n  {\n    position: [8.55, 1.25, 6.0],\n    frequency: 329.63,\n    wave: 'triangle',\n    lfo: 0.061,\n    layer: 'air',\n  },\n];\n""",
          )

          # 4) Navigation, interactions and NPCs follow the swapped rooms.
          patch(
              'src/world/levels.js',
              "'The club is alive now. Push toward the booth, slip into Take A Break, play the old Mortal Kombat II cabinet, find the kitchen bar and coffee machine, or take the broad Clark stair back up to the studio.'",
              "'The club is alive now. Push toward the booth, cross east into Take A Break, find the kitchen bar on the west side, play the old Mortal Kombat II cabinet, or earn your way onto the Clark stair up to the studio.'",
          )
          patch(
              'src/world/levels.js',
              """        surface('lounge', 'Take A Break', -9.75, -6.25, -0.25, 3.6),\n        surface('lounge-door', 'Take A Break Doorway', -6.5, -5.65, 0.05, 1.45),\n        surface('storage', 'Storage', -5, 1.8, 3.35, 6.2),\n        surface('service', 'Service / Bar', 6.2, 8.8, -2.7, 6.15),\n        surface('bar-door', 'Bar Doorway', 5.65, 6.5, -2.05, -0.55),\n""",
              """        surface('service', 'Kitchen + Bar', -9.75, -6.25, -0.25, 3.6),\n        surface('bar-door', 'Bar Doorway', -6.5, -5.65, 0.45, 1.4),\n        surface('storage', 'Storage', -5, 1.8, 3.35, 6.2),\n        surface('lounge', 'Take A Break', 6.2, 8.8, 2.8, 6.15),\n        surface('lounge-door', 'Take A Break Doorway', 5.65, 6.5, 1.35, 2.8),\n        surface('east-service', 'Production / Service', 6.2, 8.8, -2.7, 2.8),\n""",
          )
          patch(
              'src/world/levels.js',
              """        cameraWall('cam-club-west-north', -6.23, -5.97, -1.25, 0.14),\n        cameraWall('cam-club-west-south', -6.23, -5.97, 1.32, 3.62),\n        cameraWall('cam-club-east-north', 5.97, 6.23, -3.62, -2.1),\n        cameraWall('cam-club-east-south', 5.97, 6.23, -0.62, 3.62),\n""",
              """        cameraWall('cam-club-west-north', -6.23, -5.97, -3.62, -2.08),\n        cameraWall('cam-club-west-mid', -6.23, -5.97, -0.58, 0.45),\n        cameraWall('cam-club-west-south', -6.23, -5.97, 1.4, 3.62),\n        cameraWall('cam-club-east-north', 5.97, 6.23, -3.62, -2.1),\n        cameraWall('cam-club-east-mid', 5.97, 6.23, -0.62, 1.35),\n        cameraWall('cam-club-east-south', 5.97, 6.23, 2.8, 3.62),\n""",
          )
          patch(
              'src/world/levels.js',
              """      stairs: {\n        ...anchor('Stairs upstairs', [-6.55, 0.82, -3.0], 1.55, 'travel'),\n        target: 'upstairs',\n      },\n""",
              """      stairs: {\n        ...anchor('Stairs upstairs', [-6.55, 0.82, -3.0], 1.55, 'travel'),\n        target: 'upstairs',\n        requires: 'studioAccessGranted',\n      },\n""",
          )
          patch('src/world/levels.js', "courtney: anchor('Courtney', [7.05, 0, 5.15], 1.2, 'dialogue'),", "courtney: anchor('Courtney', [-8.72, 0, 3.18], 1.2, 'dialogue'),")
          patch('src/world/levels.js', "simla: anchor('Simla', [8.05, 0, 5.15], 1.2, 'dialogue'),", "simla: anchor('Simla', [-7.58, 0, 3.18], 1.2, 'dialogue'),")
          patch('src/world/levels.js', "coffeeMachine: anchor('Kitchen coffee machine', [6.72, 0, 5.4], 1.35, 'coffee'),", "coffeeMachine: anchor('Kitchen coffee machine', [-9.18, 0, 2.55], 1.35, 'coffee'),")
          patch('src/world/levels.js', "installation: anchor('Take A Break installation', [-8.75, 0, 1.85], 1.5, 'installation'),", "installation: anchor('Take A Break installation', [7.65, 0, 4.8], 1.5, 'installation'),")
          patch(
              'src/world/levels.js',
              """          [-6.8, 0, 1.0],\n          [-8.2, 0, 2.3],\n""",
              """          [6.8, 0, 3.9],\n          [7.9, 0, 5.45],\n""",
          )
          patch(
              'src/world/levels.js',
              """      { id: 'jashim', name: 'Jashim', anchor: 'jashim', role: 'artist', color: 0x60728f },\n""",
              """      {\n        id: 'zander',\n        name: 'Zander',\n        role: 'tech',\n        position: [-5.42, 0, -1.42],\n        rotationY: -Math.PI / 2,\n      },\n      { id: 'jashim', name: 'Jashim', anchor: 'jashim', role: 'artist', color: 0x60728f },\n""",
          )

          # 5) Persist the two new progression flags.
          patch(
              'src/state/GameState.js',
              """  roofSecretUnlocked: false,\n  maddoxCompanion: false,\n""",
              """  roofSecretUnlocked: false,\n  studioAccessGranted: false,\n  houseDjDeskIntroduced: false,\n  maddoxCompanion: false,\n""",
          )
          patch(
              'src/state/GameState.js',
              """  state.roofSecretUnlocked = value.roofSecretUnlocked === true;\n  state.maddoxCompanion = state.roofSecretUnlocked && value.maddoxCompanion === true;\n""",
              """  state.roofSecretUnlocked = value.roofSecretUnlocked === true;\n  state.studioAccessGranted = value.studioAccessGranted === true;\n  state.houseDjDeskIntroduced = value.houseDjDeskIntroduced === true;\n  state.maddoxCompanion = state.roofSecretUnlocked && value.maddoxCompanion === true;\n""",
          )

          # 6) Hide the producer table interaction until James has shown it to the player.
          patch(
              'src/world/upstairs/definition.js',
              """      houseDjDesk: {\n        name: 'House DJ production desk',\n        position: at(325, 748),\n        radius: 1.55,\n        action: 'houseDjDesk',\n      },\n""",
              """      houseDjDesk: {\n        name: 'House DJ production desk',\n        position: at(325, 748),\n        radius: 1.55,\n        action: 'houseDjDesk',\n        requires: 'houseDjDeskIntroduced',\n      },\n""",
          )

          # 7) Dialogue progression: Zander gates the studio; James reveals and leads to producer table.
          patch(
              'src/interactions/createActions.js',
              """    dialogue: (target) => {\n      const id = target.npcId ?? target.id;\n      const dialogue = sceneManager.current.npcs?.dialogue?.(id);\n      if (!dialogue) return;\n      state?.meet?.(id);\n      saveState();\n      const characterActions = [];\n""",
              """    dialogue: (target) => {\n      const id = target.npcId ?? target.id;\n      const dialogue = sceneManager.current.npcs?.dialogue?.(id);\n      if (!dialogue) return;\n      const level = sceneManager.current;\n      const sceneId = level.definition.id;\n      state?.meet?.(id);\n      saveState();\n\n      if (id === 'zander' && sceneId === 'downstairs') {\n        const admitted = state?.data?.studioAccessGranted === true;\n        panel(\n          'ZANDER · STUDIO DOOR',\n          admitted\n            ? '“You already told me what you are here for. Studio is upstairs. Go make something.”'\n            : '“Upstairs is the studio, not another party room. What are you actually here to do?”',\n          admitted\n            ? []\n            : [\n                [\n                  'I want to make music, not just party.',\n                  () => {\n                    state.data.studioAccessGranted = true;\n                    saveState();\n                    panel(\n                      'ZANDER · STUDIO ACCESS',\n                      '“Good answer. Head through this doorway and take the Clark stair up. We will get deeper into the studio once you are there.”',\n                    );\n                  },\n                ],\n                [\n                  'Honestly, I am just here to party.',\n                  () =>\n                    panel(\n                      'ZANDER · STUDIO DOOR',\n                      '“Then stay down here for now. Come back when you actually want to make something.”',\n                    ),\n                ],\n              ],\n        );\n        return;\n      }\n\n      const characterActions = [];\n""",
          )
          patch(
              'src/interactions/createActions.js',
              """      if (id === 'jace' && sceneManager.current.definition.id === 'upstairs')\n        characterActions.push(['Ask about the Neve room', neveConsolePanel]);\n""",
              """      if (id === 'jace' && sceneManager.current.definition.id === 'upstairs')\n        characterActions.push(['Ask about the Neve room', neveConsolePanel]);\n      if (id === 'james' && sceneManager.current.definition.id === 'upstairs')\n        characterActions.push([\n          state?.data?.houseDjDeskIntroduced\n            ? 'Take me back to the downstairs DJ producer table'\n            : 'How do you decide who DJs downstairs?',\n          () => {\n            const desk = level.definition.anchors?.houseDjDesk;\n            if (!desk || !player) return;\n            state.data.houseDjDeskIntroduced = true;\n            saveState();\n            const [x, y, z] = desk.position;\n            player.spawn([x, y, z + 1.35], level.collision);\n            const james = level.npcs?.get?.('james');\n            if (james?.group) {\n              james.group.position.set(x - 0.82, y, z + 0.62);\n              james.group.rotation.y = Math.PI;\n            }\n            panel(\n              'JAMES · PRODUCER TABLE',\n              '“This is the table. We use it to decide who is holding down the booth downstairs. Pick somebody here, then go hear what they do in the club.”',\n            );\n          },\n        ]);\n""",
          )

          # 8) Static regression coverage for the spatial swap + progression locks.
          Path('tests/club-flow.test.js').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { levels } from '../src/world/levels.js';\nimport { TAKE_A_BREAK_SEATS } from '../src/scenes/geometry/roomFurniture.js';\nimport { validateSave } from '../src/state/GameState.js';\n\ntest('Below room functions are on the correct opposite sides', () => {\n  const downstairs = levels.downstairs;\n  const lounge = downstairs.navigation.surfaces.find((surface) => surface.id === 'lounge');\n  const bar = downstairs.navigation.surfaces.find((surface) => surface.id === 'service');\n  assert.ok(lounge.x1 > 6, 'Take A Break should be on the east side');\n  assert.ok(bar.x2 < -6, 'bar should be on the west side');\n  assert.ok(downstairs.anchors.installation.position[0] > 6);\n  assert.ok(downstairs.anchors.coffeeMachine.position[0] < -6);\n  assert.ok(TAKE_A_BREAK_SEATS.every(([x]) => x > 6));\n});\n\ntest('studio stair is gated by Zander and remains spatially accessible', () => {\n  const downstairs = levels.downstairs;\n  assert.equal(downstairs.anchors.stairs.requires, 'studioAccessGranted');\n  assert.ok(downstairs.navigation.surfaces.some((surface) => surface.id === 'studio-stairs'));\n  const zander = downstairs.npcs.find((npc) => npc.id === 'zander');\n  assert.ok(zander);\n  assert.ok(Math.abs(zander.position[0] + 5.42) < 0.01);\n});\n\ntest('James gates discovery of the house-DJ producer table', () => {\n  assert.equal(levels.upstairs.anchors.houseDjDesk.requires, 'houseDjDeskIntroduced');\n});\n\ntest('new progression flags survive save validation', () => {\n  const state = validateSave({\n    version: 1,\n    sceneId: 'downstairs',\n    studioAccessGranted: true,\n    houseDjDeskIntroduced: true,\n  });\n  assert.equal(state.studioAccessGranted, true);\n  assert.equal(state.houseDjDeskIntroduced, true);\n});\n""")

      - name: Format
        run: pnpm exec prettier --write src/scenes/geometry/belowBlockout.js src/scenes/geometry/roomFurniture.js src/gameplay/roomExperienceEnhancements.js src/audio/SpatialAudioSystem.js src/world/levels.js src/state/GameState.js src/world/upstairs/definition.js src/interactions/createActions.js tests/club-flow.test.js

      - name: Verify
        run: |
          pnpm test
          pnpm build
          pnpm exec prettier --check .

