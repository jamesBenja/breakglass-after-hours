name: Format Spectra arranger branch

on:
  push:
    branches:
      - feat/spectra-session-arranger

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'Apply Prettier formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spectra-session-arranger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/gameplay/StudioLoopEnhancements.js src/studio/StudioPlayback.js src/studio/StudioSession.js src/ui/Hud.js
      - name: Commit formatter output and remove temporary workflow
        run: |
          rm .github/workflows/format-spectra-arranger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Prettier formatting"
          git push origin HEAD:feat/spectra-session-arranger
