name: Finalize Character Realism Foundation

on:
  push:
    branches:
      - feat/character-realism-pass
    paths:
      - .github/workflows/finalize-character-realism-foundation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/character-realism-pass

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Format character realism files
        run: >-
          pnpm exec prettier --write
          src/player/PlayerController.js
          src/avatar/LightweightHuman.js
          src/gameplay/HouseDjSystem.js
          src/gameplay/LiveBandSystem.js
          src/npcs/NpcSystem.js
          src/alley/AlleyCrowdSystem.js
          src/crowd/CrowdSystem.js
          .github/workflows/iphone-preview.yml

      - name: Verify character pass foundation
        run: |
          pnpm test
          pnpm build
          pnpm exec prettier --check src server tests .github/workflows

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/finalize-character-realism-foundation.yml

      - name: Commit verified foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize character realism foundation"
          git push origin HEAD:feat/character-realism-pass
