name: Apply club Kombat pass

on:
  push:
    branches:
      - feat/club-rig-devin-kombat-roster

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/club-rig-devin-kombat-roster
      - name: Apply targeted changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          # Below geometry: suspend the quad and center sub, then relocate the cabinet by Clark.
          p = Path('src/scenes/geometry/belowBlockout.js')
          text = p.read_text()
          import_line = "import { buildRealisticDjBooth } from './djBoothRealism.js';\n"
          config_import = "import { BELOW_SOUND_RIG, MORTAL_KOMBAT_CABINET } from '../../world/belowClubConfig.js';\n"
          if config_import not in text:
              text = text.replace(import_line, import_line + config_import, 1)
          pattern = re.compile(r"  for \(const \[x, z\] of \[\n    \[-5\.25, -2\.8\],\n    \[-5\.25, 2\.8\],\n    \[5\.25, -2\.8\],\n    \[5\.25, 2\.8\],\n  \]\) \{\n    box\(downScene, 0\.7, 1\.48, 0\.72, MAT\.speaker, x, 0\.74, z\);\n    box\(downScene, 0\.54, 0\.08, 0\.54, mat\(0x1f1f1f\), x, 1\.08, z - 0\.37\);\n  \}\n  cyl\(downScene, 0\.72, 0\.62, MAT\.speaker, -1\.7, 0\.31, -0\.3\);\n")
          replacement = """  const suspension = mat(0x4c5055, 0.48, 0.3);\n  for (const [x, y, z] of BELOW_SOUND_RIG.quads) {\n    box(downScene, 0.7, 1.48, 0.72, MAT.speaker, x, y, z);\n    box(downScene, 0.54, 0.08, 0.54, mat(0x1f1f1f), x, y + 0.34, z - 0.37);\n    for (const dx of [-0.23, 0.23])\n      box(downScene, 0.025, 0.38, 0.025, suspension, x + dx, 3.0, z);\n  }\n  const [subX, subY, subZ] = BELOW_SOUND_RIG.sub;\n  cyl(downScene, 0.72, 0.62, MAT.speaker, subX, subY, subZ);\n  for (const x of [-0.36, 0.36])\n    box(downScene, 0.025, 0.3, 0.025, suspension, subX + x, 3.02, subZ);\n"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('speaker rig block was not patched')

          start = text.index("  // The studio's Mortal Kombat II cabinet.")
          end = text.index("\n  const counterZ = 2.55;", start)
          cabinet = """  // The real Mortal Kombat II cabinet now sits beside the Clark Street emergency stair.\n  // Its screen faces back into the club so it reads immediately from the dance floor.\n  const cabinetDark = mat(0x191a1d, 0.72, 0.06);\n  const cabinetRed = mat(0x7d1e25, 0.67, 0.04);\n  const cabinetGold = mat(0xd1a448, 0.46, 0.08);\n  const screenMaterial = new MeshStandardMaterial({\n    color: 0x11141a,\n    emissive: 0x263a59,\n    emissiveIntensity: 0.75,\n    roughness: 0.28,\n    metalness: 0.02,\n  });\n  const [cabinetX, , cabinetZ] = MORTAL_KOMBAT_CABINET;\n  const cabinetFrontZ = cabinetZ + 0.4;\n  box(downScene, 0.9, 1.72, 0.76, cabinetDark, cabinetX, 0.86, cabinetZ);\n  box(downScene, 0.08, 1.64, 0.78, cabinetRed, cabinetX - 0.43, 0.86, cabinetZ);\n  box(downScene, 0.08, 1.64, 0.78, cabinetRed, cabinetX + 0.43, 0.86, cabinetZ);\n  box(downScene, 0.82, 0.28, 0.1, cabinetRed, cabinetX, 1.72, cabinetFrontZ);\n  box(downScene, 0.72, 0.54, 0.035, screenMaterial, cabinetX, 1.31, cabinetFrontZ + 0.016);\n  box(downScene, 0.12, 0.3, 0.018, mat(0x2b75b6), cabinetX - 0.19, 1.29, cabinetFrontZ + 0.04);\n  box(downScene, 0.12, 0.3, 0.018, mat(0xc94e3c), cabinetX + 0.19, 1.29, cabinetFrontZ + 0.04);\n  box(downScene, 0.76, 0.12, 0.42, cabinetDark, cabinetX, 0.92, cabinetFrontZ).rotation.x = 0.16;\n  cyl(downScene, 0.035, 0.18, cabinetGold, cabinetX - 0.21, 1.03, cabinetFrontZ + 0.11);\n  cyl(downScene, 0.055, 0.035, mat(0xb52b2f), cabinetX + 0.12, 1.04, cabinetFrontZ + 0.13);\n  cyl(downScene, 0.055, 0.035, mat(0xe0b444), cabinetX + 0.27, 1.04, cabinetFrontZ + 0.13);\n  for (const x of [cabinetX - 0.19, cabinetX, cabinetX + 0.19])\n    box(downScene, 0.085, 0.02, 0.025, cabinetGold, x, 1.57, cabinetFrontZ + 0.055);\n  box(downScene, 0.22, 0.07, 0.025, mat(0x642228), cabinetX, 0.47, cabinetFrontZ + 0.02);\n  label(downScene, 'MORTAL KOMBAT II', cabinetX, 1.76, cabinetFrontZ + 0.09, 0.14, '#ffd469');\n  label(downScene, 'MKII', cabinetX, 2.02, cabinetZ, 0.2, '#d5b056');\n"""
          text = text[:start] + cabinet + text[end:]
          p.write_text(text)

          # Level anchors and crowd clearance use the same cabinet config as the rendered fixture.
          p = Path('src/world/levels.js')
          text = p.read_text()
          if "from './belowClubConfig.js'" not in text:
              text = text.replace(
                  "import { roofLevel } from './roof.js';\n",
                  "import { roofLevel } from './roof.js';\nimport { MORTAL_KOMBAT_CABINET } from './belowClubConfig.js';\n",
                  1,
              )
          text = text.replace(
              "        { x1: -0.95, x2: 5.15, z1: -3.25, z2: -1.2 },\n",
              "        { x1: -0.95, x2: 5.15, z1: -3.25, z2: -1.2 },\n        { x1: 2.42, x2: 3.48, z1: -3.18, z2: -2.12 },\n",
              1,
          )
          old_anchor = "      arcade: anchor('Mortal Kombat II cabinet', [-9.15, 0, -0.02], 1.45, 'arcade'),"
          new_anchor = "      arcade: anchor('Mortal Kombat II cabinet', MORTAL_KOMBAT_CABINET, 1.45, 'arcade'),"
          if old_anchor not in text:
              raise SystemExit('arcade anchor not found')
          text = text.replace(old_anchor, new_anchor, 1)
          p.write_text(text)

          # Devin starts with sound, with an explicit optional arcade thread.
          p = Path('src/npcs/dialogues.js')
          text = p.read_text()
          old = """  devin: {\n    title: 'DEVIN · SOUND SYSTEM TECH',\n    text: '“I’m listening. Something in this corner is bothering me. Also, do you have any candy?”',\n  },\n"""
          new = """  devin: {\n    title: 'DEVIN · SOUND SYSTEM TECH',\n    text: '“Listen from the middle. The four hangs should image evenly, and the center sub should feel like it is coming from everywhere and nowhere. I keep walking the room until it locks in.”',\n    soundPrompt: 'What are you listening for?',\n    soundText:\n      '“Coverage first, then timing. If one corner pulls your ear, or the center gets lumpy, I want to know why before I touch anything. The room should feel powerful without one box announcing itself.”',\n    arcadePrompt: 'Do you like old arcade games?',\n    arcadeText:\n      '“Wait — yes. Old fighting cabinets especially. Come on, come on. Mortal Kombat is right by the Clark stairs. The sound can wait thirty seconds.”',\n  },\n"""
          if old not in text:
              raise SystemExit('Devin dialogue block not found')
          p.write_text(text.replace(old, new, 1))

          # Give Devin a dedicated sound/arcade conversation and physically escort the player.
          p = Path('src/core/Game.js')
          text = p.read_text()
          if "DEVIN_ARCADE_GUIDE" not in text:
              text = text.replace(
                  "import { createActions } from '../interactions/createActions.js';\n",
                  "import { createActions } from '../interactions/createActions.js';\nimport { DEVIN_ARCADE_GUIDE } from '../world/belowClubConfig.js';\n",
                  1,
              )
          marker = "    const canAct = () => this.started && !this.sceneManager.changing && !document.hidden;\n"
          helper = """    const openDevinDialogue = () => {\n      const level = this.sceneManager.current;\n      if (level?.definition?.id !== 'downstairs') return false;\n      const dialogue = level.npcs?.dialogue?.('devin');\n      if (!dialogue) return false;\n      this.state.meet('devin');\n      this.save();\n      ui.panel(dialogue.title, dialogue.text, [\n        [\n          dialogue.soundPrompt,\n          () => ui.panel('DEVIN · SYSTEM WALK', dialogue.soundText, []),\n        ],\n        [\n          dialogue.arcadePrompt,\n          () => {\n            this.player.spawn(DEVIN_ARCADE_GUIDE.player, level.collision);\n            const devin = level.npcs?.get?.('devin');\n            if (devin?.group) {\n              devin.group.position.fromArray(DEVIN_ARCADE_GUIDE.npc);\n              devin.group.rotation.y = Math.atan2(\n                this.player.position.x - devin.group.position.x,\n                this.player.position.z - devin.group.position.z,\n              );\n            }\n            ui.panel('DEVIN · OLD ARCADE GAMES', dialogue.arcadeText, [\n              [\n                'Play Mortal Kombat II',\n                () => {\n                  this.stopAll();\n                  this.arcade.start();\n                },\n              ],\n            ]);\n          },\n        ],\n      ]);\n      return true;\n    };\n\n"""
          if helper not in text:
              if marker not in text:
                  raise SystemExit('Game canAct marker not found')
              text = text.replace(marker, helper + marker, 1)
          callback = """    this.interactions = new InteractionSystem((target) => {\n      if (target?.action === 'arcade') {\n"""
          callback_new = """    this.interactions = new InteractionSystem((target) => {\n      if (\n        target?.action === 'dialogue' &&\n        (target.npcId ?? target.id) === 'devin' &&\n        openDevinDialogue()\n      )\n        return;\n      if (target?.action === 'arcade') {\n"""
          if callback not in text:
              raise SystemExit('interaction callback marker not found')
          text = text.replace(callback, callback_new, 1)
          p.write_text(text)

      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/geometry/belowBlockout.js src/world/levels.js src/npcs/dialogues.js src/core/Game.js
          git diff --cached --quiet && exit 0
          git commit -m "Adjust Below rig, arcade location and Devin guide"
          git push origin HEAD:feat/club-rig-devin-kombat-roster
