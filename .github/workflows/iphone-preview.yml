name: iPhone Preview

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iphone-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Add cache-proof preview entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          sha = os.environ['GITHUB_SHA']
          index = Path('dist/index.html')
          html = index.read_text()
          stamp = (
              '<div id="buildStamp" style="position:fixed;right:8px;bottom:8px;z-index:99999;'
              'font:10px/1.2 monospace;color:#aaa;background:rgba(0,0,0,.68);padding:4px 6px;'
              'border-radius:4px;pointer-events:none">BUILD ' + sha[:8] + '</div>'
          )
          html = html.replace('</body>', stamp + '</body>')
          index.write_text(html)
          Path('dist/latest.html').write_text(html)
          Path('dist/version.json').write_text(json.dumps({'sha': sha}))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
