name: Format iPhone preview pass

on:
  push:
    branches:
      - feat/dynamic-below-avatar-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-below-avatar-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format source
        run: pnpm exec prettier --write src tests scripts index.html vite.config.js
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts index.html vite.config.js
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "Format iPhone preview pass"
          git push origin HEAD:feat/dynamic-below-avatar-foundation
