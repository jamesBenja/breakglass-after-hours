name: Temp Prettier Diff

on:
  push:
    branches:
      - fix/spectra-recording-signal-mute-diagnostics

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/gameplay/StudioLoopEnhancements.js tests/spectra-recording-monitor.test.js
      - run: git diff -- src/gameplay/StudioLoopEnhancements.js tests/spectra-recording-monitor.test.js
