name: Finalize Below Alley World Pass

on:
  push:
    branches:
      - feat/below-alley-world-systems
    paths:
      - .github/workflows/finalize-below-alley-world-pass.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/below-alley-world-systems
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Apply complete world pass from prepared workflows
        shell: python
        run: |
          from pathlib import Path
          import re

          def execute_block(path, marker, next_marker):
              workflow = Path(path).read_text()
              section = workflow.index(marker)
              start = workflow.index('        run: |\n', section) + len('        run: |\n')
              end = workflow.index(next_marker, start)
              block = workflow[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
              scope = {'__builtins__': __builtins__, 'Path': Path, 're': re}
              exec(compile(script, f'{path}:{marker}', 'exec'), scope, scope)

          execute_block(
              '.github/workflows/apply-scoreboard-song-pass.yml',
              '      - name: Apply stats, scoreboard, song playback and upstairs espresso pass',
              '\n      - name: Format changed files',
          )
          execute_block(
              '.github/workflows/apply-below-alley-world-pass.yml',
              '      - name: Apply Below layout, circulation, storage and alley life pass',
              '\n      - name: Format changed files',
          )

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected finalizer block not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count))

          # Keep the alley arrival at the Zander/studio stair core but land on the valid club floor
          # immediately beside the bottom of the stair rather than outside its authored surface.
          patch(
              'src/world/levels.js',
              "      alley: [-6.55, 0, -0.55],\n",
              "      alley: [-5.7, 0, -0.55],\n",
          )
          patch(
              'src/world/levels.js',
              "...anchor('Alley stairs · down from the studio stair core', [-6.55, 0, -0.55], 1.35, 'travel'),",
              "...anchor('Alley stairs · down from the studio stair core', [-5.7, 0, -0.55], 1.35, 'travel'),",
          )

          # The espresso pass intentionally adds coffee upstairs; keep bartender interactions Below-only.
          patch(
              'tests/bar-service.test.js',
              """test('bar service only intercepts its downstairs interactions', () => {\n  const h = harness();\n  assert.equal(h.system.handle({ npcId: 'nora' }), false);\n  assert.equal(h.system.handle({ action: 'coffee' }), true);\n  h.system.sceneManager.current.definition.id = 'upstairs';\n  assert.equal(h.system.handle({ npcId: 'courtney' }), false);\n  assert.equal(h.system.handle({ action: 'coffee' }), false);\n});\n""",
              """test('bar service keeps bartenders downstairs but supports studio coffee upstairs', () => {\n  const h = harness();\n  assert.equal(h.system.handle({ npcId: 'nora' }), false);\n  assert.equal(h.system.handle({ action: 'coffee' }), true);\n  h.system.sceneManager.current.definition.id = 'upstairs';\n  assert.equal(h.system.handle({ npcId: 'courtney' }), false);\n  assert.equal(h.system.handle({ action: 'coffee' }), true);\n});\n""",
          )

      - name: Format complete pass
        run: >-
          pnpm exec prettier --write
          src/state/GameState.js
          src/studio/StudioSession.js
          src/gameplay/StudioLoopEnhancements.js
          src/gameplay/GameStatsSystem.js
          src/gameplay/BelowAlleyWorldSystem.js
          src/world/levels.js
          src/world/alley.js
          src/scenes/geometry/belowBlockout.js
          src/scenes/geometry/alleyBlockout.js
          src/scenes/geometry/roomFurniture.js
          src/photos/PhotoSystem.js
          src/npcs/NpcSystem.js
          src/npcs/dialogues.js
          src/gameplay/PartyLifePhotoSystem.js
          src/gameplay/roomExperienceEnhancements.js
          src/gameplay/BarServiceSystem.js
          src/world/upstairs/definition.js
          src/scenes/geometry/upstairsFixtures.js
          src/gameplay/HouseDjSystem.js
          src/main.js
          tests/bar-service.test.js
          tests/scoreboard-song.test.js
          tests/below-alley-world.test.js

      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Formatting check
        run: pnpm run format:check

      - name: Commit verified pass and remove one-shot machinery
        run: |
          rm -f .github/workflows/apply-scoreboard-song-pass.yml
          rm -f .github/workflows/apply-below-alley-world-pass.yml
          rm -f .github/workflows/debug-below-pass.yml
          rm -f .github/workflows/debug-below-pass-v2.yml
          rm -f .github/workflows/finalize-below-alley-world-pass.yml
          rm -f notes/below-alley-world-systems-plan.md notes/scoreboard-spec.md notes/.keep-below-pass notes/placeholder.tmp
          rm -f debug-test-output.txt debug-test-status.txt debug-v2-output.txt
          rmdir notes 2>/dev/null || true
          git config user.name "jamesBenja"
          git config user.email "70452184+jamesBenja@users.noreply.github.com"
          git add -A
          git commit -m "Build Below world systems, scoreboard and alley life"
          git push origin HEAD:feat/below-alley-world-systems
