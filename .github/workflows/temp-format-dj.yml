name: Temporary DJ formatter

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format DJ UI
        run: pnpm exec prettier --write src/ui/djHardwareV2.js

      - name: Commit formatter result
        run: |
          if git diff --quiet -- src/ui/djHardwareV2.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/djHardwareV2.js
          git commit -m "Format DJ crate UI"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
