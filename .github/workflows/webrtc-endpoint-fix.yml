name: One-shot WebRTC endpoint fix

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/webrtc-endpoint-fix.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - name: Point preview at fixed backend and strengthen smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://multiplayer-phase2-live-production.up.railway.app'
          new = 'https://multiplayer-phase2-webrtc-production.up.railway.app'

          client = Path('src/multiplayer/MultiplayerClient.js')
          text = client.read_text()
          if old not in text:
              raise SystemExit('old multiplayer endpoint not found in client')
          client.write_text(text.replace(old, new))

          workflow = Path('.github/workflows/live-multiplayer-smoke.yml')
          text = workflow.read_text()
          if old.replace('https://', 'wss://') not in text:
              raise SystemExit('old multiplayer endpoint not found in smoke workflow')
          workflow.write_text(text.replace(old.replace('https://', 'wss://'), new.replace('https://', 'wss://')))

          smoke = Path('scripts/smoke-live-multiplayer.mjs')
          text = smoke.read_text()
          needle = "assert.equal(signal.data.candidate.candidate, 'phase2-smoke-candidate');\n"
          insertion = """assert.equal(signal.data.candidate.candidate, 'phase2-smoke-candidate');

const longSdp = `v=0\\r\\n${Array.from(
  { length: 80 },
  (_, index) => `a=x-breakglass-${index}:${'x'.repeat(48)}\\r\\n`,
).join('')}`;
assert.ok(longSdp.length > 500);
const descriptionOnA = onceMessage(
  a,
  (message) =>
    message.type === 'signal' &&
    message.fromId === welcomeB.id &&
    message.data?.description?.type === 'offer',
);
b.send(
  JSON.stringify({
    type: 'signal',
    targetId: welcomeA.id,
    data: { description: { type: 'offer', sdp: longSdp } },
  }),
);
const descriptionSignal = await descriptionOnA;
assert.equal(descriptionSignal.data.description.sdp, longSdp);
"""
          if 'const longSdp =' not in text:
              if needle not in text:
                  raise SystemExit('smoke insertion point not found')
              text = text.replace(needle, insertion)
              smoke.write_text(text)
          PY
      - name: Commit endpoint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayer/MultiplayerClient.js .github/workflows/live-multiplayer-smoke.yml scripts/smoke-live-multiplayer.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Point multiplayer preview at fixed WebRTC backend"
          git push origin HEAD:feat/multiplayer-phase-2-shared-world
