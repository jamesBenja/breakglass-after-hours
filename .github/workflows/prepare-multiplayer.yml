name: Prepare Multiplayer Dependencies

on:
  push:
    branches:
      - feat/live-multiplayer-foundation
    paths:
      - .github/workflows/prepare-multiplayer.yml
      - package.json
      - server/**
      - src/multiplayer/**
      - src/ui/multiplayer.css
      - src/main.js
      - railway.json

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'Prepare multiplayer lockfile and formatting') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-multiplayer-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global pnpm@11.19.0
      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format multiplayer pass
        run: pnpm exec prettier --write package.json pnpm-lock.yaml railway.json server src/multiplayer src/ui/multiplayer.css src/main.js
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "Already prepared"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml railway.json server src/multiplayer src/ui/multiplayer.css src/main.js
          git commit -m "Prepare multiplayer lockfile and formatting"
          git push origin HEAD:feat/live-multiplayer-foundation
