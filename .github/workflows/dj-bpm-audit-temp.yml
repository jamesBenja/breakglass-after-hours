name: DJ BPM Audit Temp

on:
  push:
    branches: [feat/dj-accuracy-audit-current]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: pip install 'librosa==0.11.0' 'soundfile>=0.13.1'
      - name: Build real-track input list
        run: |
          node --input-type=module <<'NODE' > /tmp/dj-tracks.json
          import { DJ_TRACKS } from './src/dj/DjMixer.js';
          import { assetManifest } from './src/assets/manifest.js';
          const tracks = DJ_TRACKS
            .filter((track) => track.real && assetManifest[track.id]?.url)
            .map((track) => ({
              id: track.id,
              label: track.label,
              bpm: track.bpm,
              path: `public/${assetManifest[track.id].url}`,
            }));
          console.log(JSON.stringify(tracks));
          NODE
      - name: Audit every real DJ master
        run: python scripts/audit-dj-bpm.py /tmp/dj-tracks.json
      - name: Print machine-readable report
        run: cat dj-bpm-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dj-bpm-audit
          path: dj-bpm-audit.json
          retention-days: 1
