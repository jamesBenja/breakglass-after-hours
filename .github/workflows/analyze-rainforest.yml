name: Analyze Rainforest Audio Once

on:
  push:
    branches:
      - feat/multiplayer-phase-2-shared-world
    paths:
      - .github/workflows/analyze-rainforest.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiplayer-phase-2-shared-world
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Inspect rainforest derivative
        run: |
          set -euo pipefail
          f="public/assets/audio/ambient/rainforest/rainforest-ambix-dawn-loop.wav"
          ffprobe -v error -show_entries stream=channels,sample_rate,bits_per_sample -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
          echo "=== overall volumedetect ==="
          ffmpeg -hide_banner -i "$f" -filter_complex "volumedetect" -f null - 2>&1 | grep -E "mean_volume|max_volume"
          for c in 0 1 2 3; do
            echo "=== channel $c volumedetect ==="
            ffmpeg -hide_banner -i "$f" -map_channel 0.0.$c -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"
          done
