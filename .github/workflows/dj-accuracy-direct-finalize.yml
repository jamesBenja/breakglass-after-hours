name: DJ Accuracy Direct Finalize

on:
  push:
    branches:
      - feat/dj-accuracy-audit-current

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dj-accuracy-audit-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply DJ accuracy patches
        run: node scripts/finalize-dj-accuracy.mjs
      - name: Format
        run: pnpm exec prettier --write src/gameplay/DjAccuracyEnhancements.js src/gameplay/djSyncEnhancements.js server/multiplayerServer.mjs tests/dj-accuracy-enhancements.test.js src/dj/djAuditMetadata.js
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit finalized DJ system
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dj-accuracy-direct-finalize.yml .github/workflows/dj-accuracy-finalize-temp.yml scripts/finalize-dj-accuracy.mjs
          git add src/gameplay/DjAccuracyEnhancements.js src/gameplay/djSyncEnhancements.js server/multiplayerServer.mjs tests/dj-accuracy-enhancements.test.js src/dj/djAuditMetadata.js
          git commit -m "Finalize audited BPM grids and realistic DJ controls"
          git push origin HEAD:feat/dj-accuracy-audit-current
